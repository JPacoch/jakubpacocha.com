<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jakub Pacocha | CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            electric: '#0055FF',
            dark: '#111827',
            offwhite: '#F9FAFB',
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      background-color: #0055FF;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0055FF;
    }

    ::-webkit-scrollbar-thumb {
      background: #ffffff;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    const { useState, useEffect, useLayoutEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- ICONS ---
    const ArrowRight = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>;
    const ArrowUpRight = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17L17 7" /><path d="M7 7h10v10" /></svg>;
    const MenuIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg>;
    const CloseIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const MailIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>;
    const LinkedinIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect width="4" height="12" x="2" y="9" /><circle cx="4" cy="4" r="2" /></svg>;
    const TwitterIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5 5.96 15.6 7 12c-1.2.3-2.4.2-3.6-.1C2.5 10.6 4 9 4 9c-1.1-.3-2-.9-2.5-1.9 1-.3 2.1-.3 3.1-.1C2.3 5 4 2 4 2c1.6 2 4 4 7.4 4.5 0-1.1.5-2.2 1.5-2.9 1.4-1.1 3.5-.8 4.6.5 1.1-.2 2.1-.7 3-1.2-.4 1.1-1.1 2-2 2.7 1-.1 1.9-.4 2.8-.8Z" /></svg>;
    const GithubIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" /></svg>;

    // --- COMPONENTS ---
    const Nav = ({ isCV }) => {
      const [isOpen, setIsOpen] = useState(false);
      const links = isCV
        ? [
          { name: "Main Page", href: "index.html", special: true },
          { name: "Experience", href: "#experience" },
          { name: "Skills", href: "#skills" },
          { name: "Education", href: "#education" }
        ]
        : [
          { name: "About", href: "#about" },
          { name: "Skills", href: "#skills" },
          { name: "Writing", href: "#writing" },
          { name: "My CV", href: "cv.html", special: true }
        ];

      return (
        <>
          <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-[100] px-2 py-2 pr-6 bg-white/70 backdrop-blur-xl border border-dark/5 rounded-full flex items-center justify-between shadow-[0_8px_30px_rgba(0,0,0,0.04)] w-[90%] md:w-auto">
            <div className="flex items-center gap-3 pl-4">
              <span className="w-2.5 h-2.5 bg-electric rounded-full"></span>
              <span className="font-bold tracking-tight text-dark">JP</span>
            </div>
            <div className="hidden md:flex gap-6 text-sm font-semibold text-dark/60 ml-8">
              {links.map(l => (
                <a key={l.name} href={l.href} className={`flex items-center gap-1.5 hover:text-electric transition-colors ${l.special ? 'text-electric' : ''}`}>
                  {l.special && <span className="w-1.5 h-1.5 bg-electric rounded-full"></span>}
                  {l.name}
                </a>
              ))}
            </div>
            <button onClick={() => setIsOpen(!isOpen)} className="md:hidden p-2 rounded-full bg-offwhite border border-dark/5 hover:bg-gray-200 transition-colors ml-4">
              {isOpen ? <CloseIcon /> : <MenuIcon />}
            </button>
          </nav>

          <AnimatePresence>
            {isOpen && (
              <motion.div
                initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -20 }}
                className="fixed inset-0 z-[90] bg-white/80 backdrop-blur-xl pt-32 px-8 flex flex-col gap-8 items-center justify-center pb-20"
              >
                {links.map((l, i) => (
                  <motion.a
                    key={l.name} href={l.href} onClick={() => setIsOpen(false)}
                    initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: i * 0.1 }}
                    className={`text-3xl md:text-4xl font-sans font-medium tracking-tight hover:text-electric transition-colors flex items-center gap-3 ${l.special ? 'text-electric' : 'text-dark'}`}
                  >
                    {l.special && <span className="w-3 h-3 bg-electric rounded-full"></span>}
                    {l.name}
                  </motion.a>
                ))}
              </motion.div>
            )}
          </AnimatePresence>
        </>
      );
    };

    const Hero = () => (
      <section className="min-h-screen flex flex-col justify-center px-6 md:px-12 lg:px-24 pt-32 pb-20 max-w-[1400px] mx-auto relative border-b border-dark/5">
        <div className="max-w-5xl relative z-10">
          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8 }} className="flex items-center gap-4 mb-12">
            <div className="w-12 h-[1px] bg-dark/20"></div>
            <span className="text-sm font-semibold tracking-widest uppercase text-dark/50">Curriculum Vitae</span>
          </motion.div>

          <motion.h1
            initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, ease: [0.34, 1.56, 0.64, 1] }}
            className="font-serif text-[3.5rem] sm:text-[4.5rem] md:text-[5.5rem] lg:text-[6.5rem] leading-[1.05] tracking-[-0.03em] text-dark mb-10"
          >
            Jakub <em className="text-electric italic font-light pr-4">Pacocha</em>
          </motion.h1>

          <div className="flex flex-col md:flex-row gap-8 md:items-end justify-between mt-16">
            <motion.p
              initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, delay: 0.2, ease: [0.34, 1.56, 0.64, 1] }}
              className="font-sans text-xl md:text-2xl text-dark/60 max-w-xl leading-relaxed font-light"
            >
              Full-stack AI engineer and hobbyist writer specializing in RAG architectures and scalable ML infrastructure. Based in Bydgoszcz, Poland.
            </motion.p>
            <motion.div
              initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, delay: 0.4, ease: [0.34, 1.56, 0.64, 1] }}
              className="flex items-center gap-4"
            >
              <a href="mailto:pacochp@gmail.com" className="px-8 py-4 bg-electric text-white rounded-full font-semibold hover:bg-electric/90 transition-all flex items-center gap-2 shadow-[0_0_15px_rgba(0,85,255,0.4)] hover:shadow-[0_0_25px_rgba(0,85,255,0.6)]">
                Mail Me <ArrowRight />
              </a>
              <a href="assets/resume.pdf" download className="px-8 py-4 bg-white border border-dark/10 text-dark rounded-full font-semibold hover:bg-offwhite transition-colors">PDF</a>
            </motion.div>
          </div>
        </div>
      </section>
    );

    const Experience = () => {
      const expData = [
        { role: "AI Engineer / Data Scientist", company: "iQor", desc: "Architecting production-grade RAG systems and optimizing vector search performance. Leading the transition to agentic workflows.", tags: ["Python", "AWS", "LLMOps"], year: "2023 — Present" },
        { role: "Data Scientist", company: "O-I Poland", desc: "Developed and maintained machine learning pipelines for internal clients on large, tabular sales and cost datasets.", tags: ["Python", "Azure", "MLOps"], year: "2021 — 2023" },
        { role: "Spatial Data Analyst", company: "Heksagon Research", desc: "Analyzed and prepared datasets and visualizations for private, civic and municipal clients.", tags: ["Python", "GIS", "SQL"], year: "2021 — 2022" }
      ];

      return (
        <section id="experience" className="px-6 md:px-12 lg:px-24 py-32 bg-white">
          <div className="max-w-[1400px] mx-auto">
            <div className="mb-20">
              <div className="text-electric font-semibold uppercase tracking-widest text-sm mb-4">Experience</div>
              <h2 className="font-serif text-5xl md:text-7xl text-dark leading-tight">Professional <em className="text-electric italic font-light">Trajectory</em></h2>
            </div>

            <div className="flex flex-col border-t border-dark/10">
              {expData.map((exp, i) => (
                <div key={i} className="py-12 border-b border-dark/10 flex flex-col lg:flex-row items-start gap-8 lg:gap-16 group hover:bg-offwhite transition-colors duration-500 px-6 -mx-6 rounded-2xl">
                  <div className="lg:w-1/4 pt-2">
                    <span className={`text-sm font-semibold tracking-widest uppercase ${i === 0 ? 'text-electric' : 'text-dark/50'}`}>{exp.year}</span>
                  </div>
                  <div className="lg:w-3/4">
                    <h3 className="text-3xl md:text-4xl font-serif font-bold text-dark mb-3">
                      {exp.role}
                    </h3>
                    <div className="text-xl font-medium text-electric mb-6">{exp.company}</div>
                    <p className="text-xl text-dark/60 leading-relaxed max-w-3xl mb-8 font-light">{exp.desc}</p>
                    <div className="flex flex-wrap gap-2">
                      {exp.tags.map(tag => (
                        <span key={tag} className="px-4 py-1.5 bg-white border border-dark/10 text-dark/70 text-sm font-semibold rounded-full shadow-sm">{tag}</span>
                      ))}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const Skills = () => {
      const skillsData = [
        { icon: "🖥️", title: "Generative AI & RAG", desc: "Utilizing LLMs and ML techniques for data analysis, serving AI-based apps and services.", tags: ["Python", "Vector stores", "Prompt Engineering"] },
        { icon: "⚙️", title: "Full-Stack AI Infra", desc: "Productization of AI and ML workflows via containerization and cloud orchestration.", tags: ["Docker", "FastAPI", "Flask"] },
        { icon: "☁️", title: "Cloud & DevOps", desc: "Deploying and maintaining infrastructure, containerization & monitoring on cloud.", tags: ["AWS", "Azure", "GitHub Actions"] },
        { icon: "🗺️", title: "Spatial & Civic Tech", desc: "Leveraging GIS and Computer Vision backgrounds for municipal and social impact.", tags: ["GIS", "Computer Vision", "Spatial Data"] }
      ];

      return (
        <section id="skills" className="px-6 md:px-12 lg:px-24 py-32 bg-offwhite relative">
          <div className="max-w-[1400px] mx-auto relative z-10">
            <div className="mb-16">
              <div className="text-electric font-semibold uppercase tracking-widest text-sm mb-4">Capabilities</div>
              <h2 className="font-serif text-5xl md:text-7xl text-dark leading-tight">Tools &amp; <em className="text-electric italic font-light">expertise</em></h2>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {skillsData.map((skill, i) => (
                <motion.div key={i} whileHover={{ y: -8, scale: 1.01 }} transition={{ type: "spring", stiffness: 300, damping: 20 }} className="group bg-white hover:bg-electric transition-colors duration-500 rounded-[2rem] p-10 md:p-12 shadow-[0_8px_30px_rgba(0,0,0,0.02)] border border-dark/5 flex flex-col cursor-crosshair">
                  <div className="w-16 h-16 bg-offwhite rounded-2xl flex items-center justify-center text-3xl mb-8 group-hover:bg-white/20 transition-colors duration-500 shadow-sm">{skill.icon}</div>
                  <h3 className="text-3xl font-serif font-bold text-dark group-hover:text-white transition-colors mb-4">{skill.title}</h3>
                  <p className="text-lg text-dark/60 group-hover:text-white/80 transition-colors mb-10 leading-relaxed">{skill.desc}</p>
                  <div className="flex flex-wrap gap-2 mt-auto">
                    {skill.tags.map(tag => (
                      <span key={tag} className="px-4 py-2 bg-offwhite group-hover:bg-white/20 group-hover:text-white text-dark/80 text-sm font-semibold rounded-full transition-colors">{tag}</span>
                    ))}
                  </div>
                </motion.div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const Education = () => {
      const eduData = [
        { title: "Master's Geoinformatics", place: "Adam Mickiewicz University in Poznań", desc: "My master's thesis focused on computer vision in geomorphology and other earth sciences.", tags: ["GIS", "CNN", "Computer Vision"], year: "2022 - 2023" },
        { title: "Engineering in Geoinformation", place: "Eötvös Loránd University", desc: "Erasmus+ programme.", tags: ["Python", "GIS"], year: "2019 - 2020" },
        { title: "Engineering in Geoinformation", place: "Adam Mickiewicz University in Poznań", desc: "Engineering thesis focused on creating a python based spatial tool for transport analysis.", tags: ["Python", "GIS", "Network analysis"], year: "2018 - 2022" }
      ];

      return (
        <section id="education" className="px-6 md:px-12 lg:px-24 pt-32 pb-32 bg-white">
          <div className="max-w-[1400px] mx-auto">
            <div className="mb-16">
              <div className="text-electric font-semibold uppercase tracking-widest text-sm mb-4">Education</div>
              <h2 className="font-serif text-5xl md:text-7xl text-dark leading-tight">My <em className="text-electric italic font-light">Education</em></h2>
            </div>
            <div className="flex flex-col border-t border-dark/10">
              {eduData.map((edu, i) => (
                <div key={i} className="py-10 border-b border-dark/10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 group hover:px-6 hover:bg-electric transition-all duration-300">
                  <div className="flex flex-col md:w-2/3">
                    <span className="text-sm font-semibold tracking-widest uppercase mb-4 text-electric group-hover:text-white/70 transition-colors duration-300">{edu.year}</span>
                    <h3 className="text-3xl md:text-4xl font-serif font-bold text-dark mb-2 group-hover:text-white transition-colors duration-300">{edu.title}</h3>
                    <div className="text-xl font-medium text-dark/50 mb-4 group-hover:text-white/70 transition-colors duration-300">{edu.place}</div>
                    <p className="text-lg text-dark/60 leading-relaxed mb-6 group-hover:text-white/80 transition-colors duration-300">{edu.desc}</p>
                    <div className="flex flex-wrap gap-2">
                      {edu.tags.map(tag => <span key={tag} className="px-3 py-1 bg-white border border-dark/10 text-dark/70 text-xs font-semibold rounded-full shadow-sm group-hover:border-transparent transition-colors duration-300">{tag}</span>)}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const App = () => {
      useLayoutEffect(() => {
        const lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        gsap.registerPlugin(ScrollTrigger);

        const initScrollTrigger = () => {
          ScrollTrigger.create({
            trigger: "#footer-spacer",
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            animation: gsap.timeline()
              .to("#main-content", {
                scale: 0.96,
                borderBottomLeftRadius: "48px",
                borderBottomRightRadius: "48px",
                ease: "none"
              })
              .fromTo("#footer-container-inner", { y: "15%" }, { y: "0%", ease: "none" }, 0)
          });
        };

        // Initialize after a tiny delay to ensure layout is computed
        setTimeout(() => {
          initScrollTrigger();
          ScrollTrigger.refresh();
        }, 100);

        const resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
        resizeObserver.observe(document.body);

        return () => {
          lenis.destroy();
          ScrollTrigger.getAll().forEach(t => t.kill());
          resizeObserver.disconnect();
        };
      }, []);

      return (
        <div className="bg-electric min-h-screen font-sans text-dark selection:bg-electric selection:text-white">
          <Nav isCV={true} />

          <main id="main-content" className="bg-white w-full relative z-10 shadow-[0_20px_60px_rgba(0,0,0,0.1)] origin-[50%_100%] overflow-hidden" style={{ willChange: "transform, border-radius" }}>
            <Hero />
            <Experience />
            <Skills />
            <Education />
          </main>

          <div id="footer-spacer" className="h-[75vh] md:h-[70vh] w-full pointer-events-none"></div>

          <footer id="footer-container" className="fixed bottom-0 left-0 w-full h-[75vh] md:h-[70vh] z-0 flex flex-col justify-end bg-electric text-white overflow-hidden">
            <div id="footer-container-inner" className="w-full h-full px-6 md:px-12 lg:px-24 py-16 flex flex-col justify-between">
              <div className="max-w-[1400px] w-full mx-auto flex flex-col h-full justify-between">
                <div className="pt-8">
                  <div id="contact" className="text-white/60 font-semibold uppercase tracking-widest text-sm mb-4">Contact</div>
                  <h2 className="font-serif text-5xl md:text-7xl leading-tight mb-8">Open for <br /> <em className="italic font-light">Collaboration</em>.</h2>
                  <p className="text-xl text-white/80 mb-12">Want to say hello? Hit me up:</p>

                  <div className="flex flex-wrap gap-4">
                    <a href="mailto:pacochp@gmail.com" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <MailIcon /> Email
                    </a>
                    <a href="https://www.linkedin.com/in/jakubpacocha/" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <LinkedinIcon /> LinkedIn
                    </a>
                    <a href="https://x.com/JakubPacocha" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <TwitterIcon /> Twitter / X
                    </a>
                    <a href="https://github.com/JPacoch" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <GithubIcon /> GitHub
                    </a>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row justify-between items-center pt-8 border-t border-white/10 text-white/50 text-sm mt-12">
                  <div>© 2026 <span className="font-semibold text-white">Jakub Pacocha</span> All rights reserved.</div>
                  <div>Bydgoszcz, Poland</div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
