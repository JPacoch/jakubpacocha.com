    // --- EXPLICIT FINITE STATE MACHINE ENGINE (DX + AX + UX) ---
    window.__APP_MACHINES__ = window.__APP_MACHINES__ || {};

    function useMachine(config) {
      const reducer = useCallback((current, event) => {
        const eventObj = typeof event === "string" ? { type: event } : event;
        const stateNode = config.states[current.value];
        const handler =
          (stateNode && stateNode.on && stateNode.on[eventObj.type]) ||
          (config.on && config.on[eventObj.type]);

        if (!handler) return current;

        if (typeof handler === "string") {
          return { value: handler, context: current.context };
        }

        if (typeof handler === "function") {
          const next = handler(current.context, eventObj, current.value);
          if (!next) return current;
          return {
            value: next.target || current.value,
            context: next.context !== undefined ? next.context : current.context
          };
        }

        const nextContext = handler.reduce
          ? handler.reduce(current.context, eventObj)
          : current.context;
        return {
          value: handler.target || current.value,
          context: nextContext
        };
      }, [config]);

      const [state, dispatch] = useReducer(reducer, undefined, () => ({
        value: typeof config.initial === "function" ? config.initial() : config.initial,
        context: typeof config.context === "function" ? config.context() : (config.context || {})
      }));

      useEffect(() => {
        if (!config.id) return;
        window.__APP_MACHINES__[config.id] = {
          id: config.id,
          state: state.value,
          context: state.context,
          states: Object.keys(config.states),
          send: dispatch,
          getSnapshot: () => ({ state: state.value, context: state.context })
        };
        return () => {
          delete window.__APP_MACHINES__[config.id];
        };
      }, [config.id, config.states, state, dispatch]);

      return [state, dispatch];
    }

    // --- CV NAVIGATION & SCROLL-SPY STATE MACHINE ---
    const CV_NAV_SECTIONS = [

    const CV_NAV_MACHINE = {
      id: "cvNavigation",
      initial: () => (typeof window !== "undefined" && window.scrollY > 30 ? "elevated" : "top"),
      context: () => ({
        activeSection: "experience"
      }),
      on: {
        SCROLL_UPDATE: (ctx, event, currentState) => {
          const nextState = event.scrollY > 30 ? "elevated" : "top";
          const nextSection = event.activeSection || ctx.activeSection;
          if (nextState === currentState && nextSection === ctx.activeSection) return null;
          return {
            target: nextState,
            context: { ...ctx, activeSection: nextSection }
          };
        },
        SELECT_SECTION: (ctx, event, currentState) => ({
          target: currentState,
          context: { ...ctx, activeSection: event.section || ctx.activeSection }
        })
      },
      states: {
        top: {},
        elevated: {}
      }
    };

    const Nav = () => {
      const [navState, send] = useMachine(CV_NAV_MACHINE);
      const scrolled = navState.value === "elevated";
      const { activeSection } = navState.context;

      useEffect(() => {
        const computeScrollState = () => {
          const ordered = ["education", "skills", "experience"];
          const scrollPos = window.scrollY + 260;
          let detected = "experience";
          for (const id of ordered) {
            const el = document.getElementById(id);
            if (el && scrollPos >= el.offsetTop) {
              detected = id;
              break;
            }
          }
          send({ type: "SCROLL_UPDATE", scrollY: window.scrollY, activeSection: detected });
        };

        computeScrollState();
        window.addEventListener("scroll", computeScrollState, { passive: true });
        return () => window.removeEventListener("scroll", computeScrollState);
      }, [send]);

      const handleAnchorClick = (e, id, href) => {
        send({ type: "SELECT_SECTION", section: id });
        if (window.__LENIS__ && href.startsWith("#")) {
          const targetEl = document.querySelector(href);
          if (targetEl) {
            e.preventDefault();
            window.__LENIS__.scrollTo(targetEl, { offset: -96 });
          }
        }
      };

          data-state={navState.value}
          data-active-section={activeSection}

                      href={sec.href}

                      aria-current={isActive ? "location" : undefined}
                      data-active={isActive}
                      className={`transition-colors ${
                        isActive ? "text-electric font-semibold" : "hover:text-electric"

                ))}
              </div>
            </section>
          </div>
        </div>
      );
    };

    const FOOTER_CURTAIN_MACHINE = {
      id: "footerCurtain",
      initial: "hidden",
      context: () => ({ progress: 0 }),
      on: {
        SCRUB_PROGRESS: (ctx, event, currentState) => {
          const p = Math.max(0, Math.min(1, Number(event.progress) || 0));
          const nextState = p <= 0.01 ? "hidden" : p >= 0.98 ? "revealed" : "revealing";
          if (nextState === currentState && Math.abs(ctx.progress - p) < 0.02) {
            return null;
          }
          return {
            target: nextState,
            context: { progress: Number(p.toFixed(3)) }
          };
        }
      },
      states: {
        hidden: {},
        revealing: {},
        revealed: {}
      }
    };

    const App = () => {
      const [curtainState, sendCurtain] = useMachine(FOOTER_CURTAIN_MACHINE);
      const isFooterHidden = curtainState.value === "hidden";

      useLayoutEffect(() => {
        const lenis = new Lenis({
          duration: 1.15,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
        });
        window.__LENIS__ = lenis;

        gsap.registerPlugin(ScrollTrigger);
        lenis.on("scroll", ScrollTrigger.update);

        let rafId = null;
        function raf(time) {
          lenis.raf(time);
          rafId = requestAnimationFrame(raf);
        }
        rafId = requestAnimationFrame(raf);

        const initScrollTrigger = () => {
          ScrollTrigger.create({
            trigger: "#footer-spacer",
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            onUpdate: (self) => {
              sendCurtain({ type: "SCRUB_PROGRESS", progress: self.progress });
            },
            animation: gsap.timeline()
              .to(["#footer-container", "#blue-bg"], { autoAlpha: 1, duration: 0.05, ease: "none" }, 0)
              .to("#main-content", {
                scale: 0.96,
                borderBottomLeftRadius: "48px",
                borderBottomRightRadius: "48px",
                ease: "none"
              }, 0)
              .fromTo("#footer-container-inner", { y: "15%" }, { y: "0%", ease: "none" }, 0)
          });
        };

        const initTimer = setTimeout(() => {
          initScrollTrigger();
          ScrollTrigger.refresh();
        }, 100);

        const resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
        resizeObserver.observe(document.body);

        return () => {
          clearTimeout(initTimer);
          if (rafId !== null) cancelAnimationFrame(rafId);
          delete window.__LENIS__;
          lenis.destroy();
          ScrollTrigger.getAll().forEach(t => t.kill());
          resizeObserver.disconnect();
        };
      }, [sendCurtain]);

      return (
        <div className="bg-white min-h-screen font-sans text-dark selection:bg-electric selection:text-white">
          <div id="blue-bg" className="fixed inset-0 bg-electric z-0 opacity-0 invisible pointer-events-none"></div>
          <Nav />

          <main
            id="main-content"
            className="bg-white w-full relative z-10 shadow-[0_20px_60px_rgba(0,0,0,0.1)] origin-[50%_100%] overflow-hidden"
            style={{ willChange: "transform, border-radius" }}
          >
            <CVDocument />
          </main>

          <div id="footer-spacer" className="min-h-[700px] h-[85vh] md:min-h-0 md:h-[70vh] w-full pointer-events-none"></div>

          <footer
            id="footer-container"
            data-machine="footerCurtain"
            data-state={curtainState.value}
            data-progress={curtainState.context.progress}
            aria-hidden={isFooterHidden}
            className="fixed bottom-0 left-0 w-full min-h-[700px] h-[85vh] md:min-h-0 md:h-[70vh] z-0 flex flex-col justify-end bg-electric text-white overflow-hidden opacity-0 invisible"
          >
            <div id="footer-container-inner" className="w-full h-full px-6 md:px-12 lg:px-24 py-16 flex flex-col justify-between">
              <div className="max-w-[1400px] w-full mx-auto flex flex-col h-full justify-between">
                <div className="pt-8">
                  <div id="contact" className="text-white/60 font-semibold uppercase tracking-widest text-sm mb-4">Contact</div>
                  <h2 className="font-serif text-5xl md:text-7xl leading-tight mb-8">
                    Open for <br /> <em className="italic font-light">Collaboration</em>.
                  </h2>
                  <p className="text-xl text-white/80 mb-12">Want to say hello? Hit me up:</p>

                  <div className="flex flex-wrap gap-4">
                    <a
                      href="mailto:pacochp@gmail.com"
                      tabIndex={isFooterHidden ? -1 : 0}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <MailIcon /> Email
                    </a>
                    <a
                      href="https://www.linkedin.com/in/jakubpacocha/"
                      tabIndex={isFooterHidden ? -1 : 0}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <LinkedinIcon /> LinkedIn
                    </a>
                    <a
                      href="https://x.com/JakubPacocha"
                      tabIndex={isFooterHidden ? -1 : 0}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <TwitterIcon /> Twitter / X
                    </a>
                    <a
                      href="https://github.com/JPacoch"
                      tabIndex={isFooterHidden ? -1 : 0}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <GithubIcon /> GitHub
                    </a>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row justify-between items-center pt-8 border-t border-white/10 text-white/50 text-sm mt-12">
                  <div>© 2026 <span className="font-semibold text-white">Jakub Pacocha</span> All rights reserved.</div>
                  <div>Bydgoszcz, Poland</div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
