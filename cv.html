<body>
  <div id="root"></div>
  <script>
    Babel.registerPreset('my-react', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]

  <script type="text/babel" data-presets="my-react,env" data-type="module">
    const { useState, useEffect, useLayoutEffect, useRef, useMemo, useReducer, useCallback } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- EXPLICIT FINITE STATE MACHINE ENGINE & AGENT/DEV TELEMETRY REGISTRY (UX + DX + AX) ---
    const MACHINE_REGISTRY = window.__APP_MACHINES__ || {};
    const GLOBAL_HISTORY = [];
    const GLOBAL_SUBSCRIBERS = new Set();
    let GLOBAL_SEQ = 0;

    function notifyGlobalSubscribers(record) {
      GLOBAL_SUBSCRIBERS.forEach((fn) => {
        try {
          fn(record);
        } catch (err) {
          console.error("[FSM Registry] Subscriber error:", err);
        }
      });
    }

    Object.defineProperties(MACHINE_REGISTRY, {
      __history__: { value: GLOBAL_HISTORY, enumerable: false, configurable: true },
      getAllSnapshots: {
        value: () => {
          const out = {};
          Object.keys(MACHINE_REGISTRY).forEach((k) => {
            if (MACHINE_REGISTRY[k] && typeof MACHINE_REGISTRY[k].getSnapshot === "function") {
              out[k] = MACHINE_REGISTRY[k].getSnapshot();
            }
          });
          return out;
        },
        enumerable: false,
        configurable: true
      },
      getHistory: {
        value: (limit = 30) => GLOBAL_HISTORY.slice(-limit),
        enumerable: false,
        configurable: true
      },
      send: {
        value: (machineId, event) => {
          const target = MACHINE_REGISTRY[machineId];
          if (!target || typeof target.send !== "function") return false;
          target.send(event);
          return true;
        },
        enumerable: false,
        configurable: true
      },
      resetAll: {
        value: () => {
          Object.keys(MACHINE_REGISTRY).forEach((k) => {
            if (MACHINE_REGISTRY[k] && typeof MACHINE_REGISTRY[k].reset === "function") {
              MACHINE_REGISTRY[k].reset();
            }
          });
        },
        enumerable: false,
        configurable: true
      },
      subscribe: {
        value: (listener) => {
          if (typeof listener !== "function") return () => {};
          GLOBAL_SUBSCRIBERS.add(listener);
          return () => GLOBAL_SUBSCRIBERS.delete(listener);
        },
        enumerable: false,
        configurable: true
      },
      inspect: {
        value: () => {
          if (MACHINE_REGISTRY.machineInspector) {
            MACHINE_REGISTRY.machineInspector.send("TOGGLE");
            return MACHINE_REGISTRY.getAllSnapshots();
          }
          return MACHINE_REGISTRY.getAllSnapshots();
        },
        enumerable: false,
        configurable: true
      }
    });

    window.__APP_MACHINES__ = MACHINE_REGISTRY;

    function getAvailableEvents(config, stateValue) {
      const stateNode = config.states && config.states[stateValue];
      const stateEvents = stateNode && stateNode.on ? Object.keys(stateNode.on) : [];
      const rootEvents = config.on ? Object.keys(config.on) : [];
      return Array.from(new Set([...stateEvents, ...rootEvents]));
    }

    function evaluateMachineTransition(config, current, event) {
      const eventObj = typeof event === "string" ? { type: event } : (event || { type: "NOOP" });

      if (eventObj.type === "@@RESET") {
        const initialValue = typeof config.initial === "function" ? config.initial() : config.initial;
        const initialContext = typeof config.context === "function" ? config.context() : (config.context || {});
        return {
          value: initialValue,
          context: initialContext,
          changed: true,
          event: eventObj
        };
      }

      const stateNode = config.states && config.states[current.value];
      const handler =
        (stateNode && stateNode.on && stateNode.on[eventObj.type]) ||
        (config.on && config.on[eventObj.type]);

      if (!handler) {
        return { value: current.value, context: current.context, changed: false, event: eventObj };
      }

      let nextValue = current.value;
      let nextContext = current.context;

      if (typeof handler === "string") {
        nextValue = handler;
      } else if (typeof handler === "function") {
        const next = handler(current.context, eventObj, current.value);
        if (!next) {
          return { value: current.value, context: current.context, changed: false, event: eventObj };
        }
        nextValue = next.target || current.value;
        nextContext = next.context !== undefined ? next.context : current.context;
      } else if (typeof handler === "object") {
        nextValue = handler.target || current.value;
        nextContext = handler.reduce
          ? handler.reduce(current.context, eventObj, current.value)
          : current.context;
      }

      const changed = nextValue !== current.value || nextContext !== current.context;
      return { value: nextValue, context: nextContext, changed, event: eventObj };
    }

    function useMachine(config) {
      const initialRef = useRef(null);
      if (!initialRef.current) {
        initialRef.current = {
          value: typeof config.initial === "function" ? config.initial() : config.initial,
          context: typeof config.context === "function" ? config.context() : (config.context || {})
        };
      }

      const stateRef = useRef(initialRef.current);
      const historyRef = useRef([]);
      const listenersRef = useRef(new Set());
      const [, forceRender] = useReducer((x) => x + 1, 0);

      const send = useCallback((event) => {
        const prev = stateRef.current;
        const result = evaluateMachineTransition(config, prev, event);
        if (!result.changed) return stateRef.current;

        const nextState = { value: result.value, context: result.context };
        stateRef.current = nextState;

        const record = {
          seq: ++GLOBAL_SEQ,
          id: config.id || "anonymous",
          timestamp: new Date().toISOString(),
          event: result.event.type,
          from: prev.value,
          to: nextState.value
        };

        historyRef.current = [...historyRef.current.slice(-24), record];
        if (config.id !== "machineInspector" && result.event.type !== "SCROLL_UPDATE" && result.event.type !== "SCRUB_PROGRESS") {
          GLOBAL_HISTORY.push(record);
          if (GLOBAL_HISTORY.length > 60) GLOBAL_HISTORY.shift();
        }

        forceRender();

        listenersRef.current.forEach((fn) => {
          try {
            fn(nextState, record);
          } catch (e) {
            console.error(e);
          }
        });
        notifyGlobalSubscribers(record);

        return nextState;
      }, [config]);

      const actor = useMemo(() => {
        const controller = {
          id: config.id,
          states: Object.keys(config.states || {}),
          send,
          reset: () => send({ type: "@@RESET" }),
          can: (eventType) => getAvailableEvents(config, stateRef.current.value).includes(eventType),
          getSnapshot: () => ({
            id: config.id,
            state: stateRef.current.value,
            context: stateRef.current.context,
            states: Object.keys(config.states || {}),
            availableEvents: getAvailableEvents(config, stateRef.current.value)
          }),
          subscribe: (fn) => {
            if (typeof fn !== "function") return () => {};
            listenersRef.current.add(fn);
            return () => listenersRef.current.delete(fn);
          }
        };

        Object.defineProperties(controller, {
          state: {
            get: () => stateRef.current.value,
            enumerable: true
          },
          context: {
            get: () => stateRef.current.context,
            enumerable: true
          },
          availableEvents: {
            get: () => getAvailableEvents(config, stateRef.current.value),
            enumerable: true
          },
          history: {
            get: () => historyRef.current.slice(),
            enumerable: true
          }
        });

        return controller;
      }, [config, send]);

      if (config.id && !MACHINE_REGISTRY[config.id]) {
        MACHINE_REGISTRY[config.id] = actor;
      }

      useEffect(() => {
        if (!config.id) return;
        MACHINE_REGISTRY[config.id] = actor;
        return () => {
          if (MACHINE_REGISTRY[config.id] === actor) {
            delete MACHINE_REGISTRY[config.id];
          }
        };
      }, [config.id, actor]);

      return [stateRef.current, send, actor];
    }

    // --- ICONS ---
    const ArrowLeft = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M19 12H5" /><path d="m12 19-7-7 7-7" />

    );
    const ArrowUpRight = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M7 17L17 7" /><path d="M7 7h10v10" />
      </svg>
    );
    const DownloadIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" />
      </svg>
    );
    const MailIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
      </svg>
    );
    const LinkedinIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect width="4" height="12" x="2" y="9" /><circle cx="4" cy="4" r="2" />
      </svg>
    );
    const TwitterIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5 5.96 15.6 7 12c-1.2.3-2.4.2-3.6-.1C2.5 10.6 4 9 4 9c-1.1-.3-2-.9-2.5-1.9 1-.3 2.1-.3 3.1-.1C2.3 5 4 2 4 2c1.6 2 4 4 7.4 4.5 0-1.1.5-2.2 1.5-2.9 1.4-1.1 3.5-.8 4.6.5 1.1-.2 2.1-.7 3-1.2-.4 1.1-1.1 2-2 2.7 1-.1 1.9-.4 2.8-.8Z" />
      </svg>
    );
    const GithubIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" />
      </svg>
    );

    // --- CV NAVIGATION & SCROLL-SPY STATE MACHINE (With Programmatic Scroll Lock) ---
    const CV_NAV_SECTIONS = [
      { id: "experience", label: "Experience", href: "#experience" },
      { id: "skills", label: "Stack", href: "#skills" },
      { id: "education", label: "Education", href: "#education" }
    ];

    const CV_NAV_MACHINE = {
      id: "cvNavigation",
      initial: () => (typeof window !== "undefined" && window.scrollY > 30 ? "elevated" : "top"),
      context: () => ({
        activeSection: "experience",
        scrollMode: "spy",
        targetSection: null
      }),
      on: {
        SCROLL_UPDATE: (ctx, event, currentState) => {
          const nextState = event.scrollY > 30 ? "elevated" : "top";
          let nextSection = event.activeSection || ctx.activeSection;
          let nextScrollMode = ctx.scrollMode;
          let nextTarget = ctx.targetSection;

          if (ctx.scrollMode === "programmatic" && ctx.targetSection) {
            if (event.activeSection === ctx.targetSection) {
              nextScrollMode = "spy";
              nextTarget = null;
              nextSection = ctx.targetSection;
            } else {
              nextSection = ctx.targetSection;
            }
          }

          if (nextState === currentState && nextSection === ctx.activeSection && nextScrollMode === ctx.scrollMode) {
            return null;
          }
          return {
            target: nextState,
            context: {
              ...ctx,
              activeSection: nextSection,
              scrollMode: nextScrollMode,
              targetSection: nextTarget
            }
          };
        },
        SELECT_SECTION: (ctx, event, currentState) => {
          const targetSec = event.section || ctx.activeSection;
          return {
            target: currentState,
            context: {
              ...ctx,
              activeSection: targetSec,
              targetSection: targetSec,
              scrollMode: "programmatic"
            }
          };
        },
        NAVIGATE_COMPLETE: (ctx, _event, currentState) => {
          if (ctx.scrollMode === "spy" && !ctx.targetSection) return null;
          return {
            target: currentState,
            context: {
              ...ctx,
              scrollMode: "spy",
              targetSection: null
            }
          };
        }
      },
      states: {
        top: {},
        elevated: {}
      }
    };

    const Nav = () => {
      const [navState, send] = useMachine(CV_NAV_MACHINE);
      const scrolled = navState.value === "elevated";
      const { activeSection, scrollMode } = navState.context;

      useEffect(() => {
        let programmaticTimer = null;

        const computeScrollState = () => {
          const ordered = ["education", "skills", "experience"];
          const scrollPos = window.scrollY + Math.min(340, window.innerHeight * 0.45);
          let detected = "experience";
          for (const id of ordered) {
            const el = document.getElementById(id);
            if (el && scrollPos >= el.offsetTop) {
              detected = id;
              break;
            }
          }
          send({ type: "SCROLL_UPDATE", scrollY: window.scrollY, activeSection: detected });
        };

        const cancelProgrammaticOnUserInput = () => {
          if (MACHINE_REGISTRY.cvNavigation && MACHINE_REGISTRY.cvNavigation.context.scrollMode === "programmatic") {
            clearTimeout(programmaticTimer);
            programmaticTimer = setTimeout(() => {
              send("NAVIGATE_COMPLETE");
            }, 150);
          }
        };

        computeScrollState();
        window.addEventListener("scroll", computeScrollState, { passive: true });
        window.addEventListener("wheel", cancelProgrammaticOnUserInput, { passive: true });
        window.addEventListener("touchmove", cancelProgrammaticOnUserInput, { passive: true });
        return () => {
          clearTimeout(programmaticTimer);
          window.removeEventListener("scroll", computeScrollState);
          window.removeEventListener("wheel", cancelProgrammaticOnUserInput);
          window.removeEventListener("touchmove", cancelProgrammaticOnUserInput);
        };
      }, [send]);

      const handleAnchorClick = (e, id, href) => {
        send({ type: "SELECT_SECTION", section: id });
        if (MACHINE_REGISTRY.scrollEngine) {
          MACHINE_REGISTRY.scrollEngine.send({ type: "PROGRAMMATIC_START", target: id });
        }
        if (window.__LENIS__ && href.startsWith("#")) {
          const targetEl = document.querySelector(href);
          if (targetEl) {
            e.preventDefault();
            window.__LENIS__.scrollTo(targetEl, {
              offset: -96,
              onComplete: () => {
                send("NAVIGATE_COMPLETE");
                if (MACHINE_REGISTRY.scrollEngine) {
                  MACHINE_REGISTRY.scrollEngine.send("PROGRAMMATIC_END");
                }
              }
            });
          }
        }
      };

      return (
        <header
          data-machine="cvNavigation"
          data-state={navState.value}
          data-active-section={activeSection}
          data-scroll-mode={scrollMode}
          className="fixed top-5 left-0 right-0 z-[100] px-4 sm:px-8 pointer-events-none flex justify-center"
        >
          <nav
            aria-label="CV Navigation"
            className={`pointer-events-auto transition-all duration-500 rounded-full flex items-center justify-between px-3 py-2 border ${
              scrolled
                ? "bg-white/85 backdrop-blur-xl border-dark/10 shadow-[0_12px_40px_rgba(17,24,39,0.08)]"
                : "bg-white/75 backdrop-blur-md border-dark/8 shadow-[0_4px_20px_rgba(17,24,39,0.03)]"
            } w-full max-w-[780px]`}
          >
            <a
              href="index.html"
              className="flex items-center gap-2.5 pl-3 pr-4 py-1.5 rounded-full hover:bg-offwhite text-dark font-medium text-xs transition-colors"
            >
              <ArrowLeft className="w-3.5 h-3.5 text-electric" />
              <span>Back to Portfolio</span>
            </a>

            <div className="hidden sm:flex items-center gap-4 text-xs font-mono text-dark/60">
              {CV_NAV_SECTIONS.map((sec, idx) => {
                const isActive = activeSection === sec.id;
                return (
                  <React.Fragment key={sec.id}>
                    {idx > 0 && <span className="text-dark/25">/</span>}
                    <a
                      href={sec.href}
                      onClick={(e) => handleAnchorClick(e, sec.id, sec.href)}
                      aria-current={isActive ? "location" : undefined}
                      data-active={isActive}
                      className={`transition-colors ${
                        isActive ? "text-electric font-semibold" : "hover:text-electric"
                      }`}
                    >
                      {sec.label}
                    </a>
                  </React.Fragment>
                );
              })}
            </div>

            <a
              href="assets/resume.pdf"
              download
              className="px-4 py-1.5 rounded-full bg-electric text-white hover:bg-electric/90 text-xs font-mono font-medium transition-all flex items-center gap-1.5 shadow-[0_4px_14px_rgba(0,85,255,0.25)]"
            >
              <DownloadIcon className="w-3.5 h-3.5" />
              <span>Download PDF</span>
            </a>
          </nav>
        </header>
      );
    };

    // --- CV CREDENTIAL & TAG EXPLORER MACHINE (Cross-Section Skill Highlighting) ---
    const CV_EXPLORER_MACHINE = {
      id: "cvExplorer",
      initial: "overview",
      context: () => ({
        selectedTag: null,
        hoveredRole: null
      }),
      on: {
        TOGGLE_TAG: (ctx, event) => {
          const nextTag = ctx.selectedTag === event.tag ? null : event.tag;
          return {
            target: nextTag ? "filteringByTag" : "overview",
            context: { ...ctx, selectedTag: nextTag }
          };
        },
        CLEAR_TAG: (ctx) => ({
          target: "overview",
          context: { ...ctx, selectedTag: null }
        }),
        HOVER_ROLE: (ctx, event) => ({
          context: { ...ctx, hoveredRole: event.company || null }
        }),
        LEAVE_ROLE: (ctx) => ({
          context: { ...ctx, hoveredRole: null }
        })
      },
      states: {
        overview: {},
        filteringByTag: {
          on: {
            ESCAPE: (ctx) => ({
              target: "overview",
              context: { ...ctx, selectedTag: null }
            })
          }
        }
      }
    };

    const CVDocument = () => {
      const [explorerState, sendExplorer] = useMachine(CV_EXPLORER_MACHINE);
      const { selectedTag, hoveredRole } = explorerState.context;

      useEffect(() => {
        if (!selectedTag) return;
        const onKeyDown = (e) => {
          if (e.key === "Escape") sendExplorer("ESCAPE");
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [selectedTag, sendExplorer]);

      const experience = [
        {
          period: "Nov 2026 - Present",
          role: "Lead AI Engineer",
          company: "HERE Technologies",
          domain: "AI Systems",
          bullets: [
            "Architecting scalable AI and location-aware data services for global mapping and spatial intelligence workflows.",
            "Building resilient production pipelines and containerized microservices with modern cloud infrastructure."
          ],
          tags: ["Python", "AI Engineering", "AWS"],
          current: true
        },
        {
          period: "Mar 2023 - Oct 2026",
          role: "AI Engineer / Data Scientist",
          company: "iQor",
          domain: "Enterprise Generative AI & LLMOps",
          bullets: [
            "Architected production-grade Retrieval-Augmented Generation (RAG) systems and optimized high-throughput vector search performance.",
            "Led the architectural transition toward agentic LLM workflows, containerized APIs (FastAPI / Docker), and AWS cloud deployment."
          ],
          tags: ["Python", "AWS", "LLMOps", "RAG", "Vector Databases", "FastAPI"]
        },
        {
          period: "Jul 2021 - Feb 2023",
          role: "Data Scientist",
          company: "O-I Poland",
          domain: "Predictive Analytics & MLOps",
          bullets: [
            "Developed, deployed, and maintained automated machine learning pipelines for internal global stakeholders on large-scale tabular sales and cost datasets.",
            "Streamlined feature engineering and model lifecycle monitoring on Microsoft Azure."
          ],
          tags: ["Python", "Azure", "MLOps", "Tabular ML", "SQL"]
        },

    // --- SMOOTH SCROLL & VIEWPORT LIFECYCLE ENGINE MACHINE ---
    const SCROLL_ENGINE_MACHINE = {
      id: "scrollEngine",
      initial: () =>

        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "reducedMotion"
          : "initializing",
      context: () => ({
        direction: "down",
        targetSection: null
      }),
      on: {
        VISIBILITY_HIDDEN: "suspended",
        VISIBILITY_VISIBLE: "idle",
        REDUCED_MOTION: "reducedMotion",
        MOTION_ALLOWED: "idle"
      },
      states: {
        initializing: {
          on: {
            READY: "idle"
          }
        },
        idle: {
          on: {
            SCROLL_ACTIVE: (ctx, event) => ({
              target: "scrolling",
              context: { ...ctx, direction: event.direction || ctx.direction }
            }),
            PROGRAMMATIC_START: (ctx, event) => ({
              target: "programmatic",
              context: { ...ctx, targetSection: event.target || null }
            })
          }
        },
        scrolling: {
          on: {
            SCROLL_ACTIVE: (ctx, event) => {
              const nextDir = event.direction || ctx.direction;
              if (nextDir === ctx.direction) return null;
              return { target: "scrolling", context: { ...ctx, direction: nextDir } };
            },
            SCROLL_IDLE: "idle",
            PROGRAMMATIC_START: (ctx, event) => ({
              target: "programmatic",
              context: { ...ctx, targetSection: event.target || null }
            })
          }
        },
        programmatic: {
          on: {
            PROGRAMMATIC_END: (ctx) => ({
              target: "idle",
              context: { ...ctx, targetSection: null }
            }),
            SCROLL_IDLE: (ctx) => ({
              target: "idle",
              context: { ...ctx, targetSection: null }
            })
          }
        },
        suspended: {},
        reducedMotion: {}
      }
    };

    const FOOTER_CURTAIN_MACHINE = {
      id: "footerCurtain",
      initial: "hidden",
      context: () => ({ progress: 0, activeChannel: null }),
      on: {
        SCRUB_PROGRESS: (ctx, event, currentState) => {
          const p = Math.max(0, Math.min(1, Number(event.progress) || 0));
          const nextState = p <= 0.01 ? "hidden" : p >= 0.98 ? "revealed" : "revealing";
          if (nextState === currentState && Math.abs(ctx.progress - p) < 0.02) {
            return null;
          }
          return {
            target: nextState,
            context: { ...ctx, progress: Number(p.toFixed(3)) }
          };
        },
        REVEAL: (ctx) => ({
          target: "revealed",
          context: { ...ctx, progress: 1 }
        }),
        HIDE: (ctx) => ({
          target: "hidden",
          context: { ...ctx, progress: 0 }
        }),
        FOCUS_CHANNEL: (ctx, event) => ({
          context: { ...ctx, activeChannel: event.channel || null }
        }),
        BLUR_CHANNEL: (ctx) => ({
          context: { ...ctx, activeChannel: null }
        })
      },

        hidden: {},
        revealing: {},

    // --- DEV / AGENT STATE MACHINE TELEMETRY HUD (Toggle with Alt+M or ?debug=machines) ---
    const MACHINE_INSPECTOR_CONFIG = {

      initial: () => {
        if (typeof window !== "undefined") {
          const params = new URLSearchParams(window.location.search);
          if (params.get("debug") === "machines" || params.get("inspector") === "1") {

        selectedMachineId: "cvNavigation"
      }),
      on: {
        SELECT_MACHINE: (ctx, event) => ({

        })

      states: {
        closed: {
          on: {
            TOGGLE: "open",
            OPEN: "open"

        open: {

            TOGGLE: "closed",

    const MachineInspectorHUD = () => {
      const [inspector, send] = useMachine(MACHINE_INSPECTOR_CONFIG);
      const [, setTick] = useState(0);
      const isOpen = inspector.value === "open";
      const { selectedMachineId } = inspector.context;

      useEffect(() => {
        const onKeyDown = (e) => {
          if ((e.altKey && e.key.toLowerCase() === "m") || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "m")) {
            e.preventDefault();
            send("TOGGLE");

            send("ESCAPE");

        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [isOpen, send]);

      useEffect(() => {
        if (!isOpen) return;
        return MACHINE_REGISTRY.subscribe(() => {
          setTick((t) => t + 1);

      }, [isOpen]);

      if (!isOpen) return null;

      const snapshots = MACHINE_REGISTRY.getAllSnapshots();
      const machineIds = Object.keys(snapshots).filter((id) => id !== "machineInspector");
      const activeSnap = snapshots[selectedMachineId] || snapshots[machineIds[0]];
      const recentHistory = MACHINE_REGISTRY.getHistory(8).slice().reverse();

      return (

          </div>

          <div className="flex flex-wrap gap-1 mb-3">

                <div className="text-white/50 mb-1">Available Events:</div>

                <div className="text-white/50 mb-1">Context:</div>

            </div>
          )}

          <div>
            <div className="text-white/45 text-[10px] uppercase tracking-wider mb-1">Recent Transitions</div>
            <div className="space-y-1 max-h-24 overflow-y-auto custom-scrollbar-minimal">
              {recentHistory.length === 0 ? (
                <div className="text-white/35 text-[10px]">Interact with the page to log transitions</div>
              ) : (
                recentHistory.map((h) => (
                  <div key={h.seq} className="text-[10px] text-white/70 flex items-center justify-between gap-2">
                    <span className="truncate">
                      <strong className="text-white">{h.id}</strong>: {h.from} → <span className="text-electric">{h.to}</span>
                    </span>

    const App = () => {
      const [scrollEngine, sendScrollEngine] = useMachine(SCROLL_ENGINE_MACHINE);
      const [curtainState, sendCurtain] = useMachine(FOOTER_CURTAIN_MACHINE);
      const isFooterHidden = curtainState.value === "hidden";

      useLayoutEffect(() => {
        const prefersReduced =
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const lenis = new Lenis({
          duration: prefersReduced ? 0 : 1.15,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
        });
        window.__LENIS__ = lenis;

        gsap.registerPlugin(ScrollTrigger);

        let scrollIdleTimer = null;
        lenis.on("scroll", ({ velocity, direction }) => {
          ScrollTrigger.update();
          const currentEngineState = MACHINE_REGISTRY.scrollEngine && MACHINE_REGISTRY.scrollEngine.state;
          if (currentEngineState === "programmatic") return;

          if (Math.abs(velocity) > 0.08) {
            sendScrollEngine({
              type: "SCROLL_ACTIVE",
              direction: direction >= 0 ? "down" : "up"
            });
            clearTimeout(scrollIdleTimer);
            scrollIdleTimer = setTimeout(() => {
              sendScrollEngine("SCROLL_IDLE");
            }, 160);
          }
        });

        let rafId = null;
        let isTabVisible = document.visibilityState !== "hidden";

        function raf(time) {
          if (isTabVisible) {
            lenis.raf(time);
            rafId = requestAnimationFrame(raf);
          } else {
            rafId = null;
          }
        }
        rafId = requestAnimationFrame(raf);

        const onVisChange = () => {
          isTabVisible = document.visibilityState !== "hidden";
          if (isTabVisible) {
            sendScrollEngine("VISIBILITY_VISIBLE");
            if (rafId === null) rafId = requestAnimationFrame(raf);
          } else {
            sendScrollEngine("VISIBILITY_HIDDEN");
            if (rafId !== null) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
          }
        };
        document.addEventListener("visibilitychange", onVisChange);

        const initScrollTrigger = () => {
          ScrollTrigger.create({
            trigger: "#footer-spacer",
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            onUpdate: (self) => {
              sendCurtain({ type: "SCRUB_PROGRESS", progress: self.progress });
            },
            animation: gsap.timeline()
              .to(["#footer-container", "#blue-bg"], { autoAlpha: 1, duration: 0.05, ease: "none" }, 0)
              .to("#main-content", {
                scale: 0.96,
                borderBottomLeftRadius: "48px",
                borderBottomRightRadius: "48px",
                ease: "none"
              }, 0)
              .fromTo("#footer-container-inner", { y: "15%" }, { y: "0%", ease: "none" }, 0)
          });
          sendScrollEngine("READY");
        };

        const initTimer = setTimeout(() => {
          initScrollTrigger();
          ScrollTrigger.refresh();
        }, 100);

        const resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
        resizeObserver.observe(document.body);

        return () => {
          clearTimeout(initTimer);
          clearTimeout(scrollIdleTimer);
          document.removeEventListener("visibilitychange", onVisChange);
          if (rafId !== null) cancelAnimationFrame(rafId);
          delete window.__LENIS__;
          lenis.destroy();
          ScrollTrigger.getAll().forEach(t => t.kill());
          resizeObserver.disconnect();
        };
      }, [sendCurtain, sendScrollEngine]);

      const handleFooterLinkFocus = (channel) => {
        sendCurtain({ type: "FOCUS_CHANNEL", channel });
        if (curtainState.value !== "revealed" && window.__LENIS__) {
          window.__LENIS__.scrollTo(document.body.scrollHeight);
        }
      };

      return (
        <div
          id="app-shell"
          data-machine="scrollEngine"
          data-state={scrollEngine.value}
          data-scroll-direction={scrollEngine.context.direction}
          className="bg-white min-h-screen font-sans text-dark selection:bg-electric selection:text-white"
        >
          <div id="blue-bg" className="fixed inset-0 bg-electric z-0 opacity-0 invisible pointer-events-none"></div>
          <Nav />

          <main
            id="main-content"
            className="bg-white w-full relative z-10 shadow-[0_20px_60px_rgba(0,0,0,0.1)] origin-[50%_100%] overflow-hidden"
            style={{ willChange: "transform, border-radius" }}
          >
            <CVDocument />
          </main>

          <div id="footer-spacer" className="min-h-[700px] h-[85vh] md:min-h-0 md:h-[70vh] w-full pointer-events-none"></div>

          <footer
            id="footer-container"
            data-machine="footerCurtain"
            data-state={curtainState.value}
            data-progress={curtainState.context.progress}
            data-active-channel={curtainState.context.activeChannel || undefined}
            aria-hidden={isFooterHidden}
            className="fixed bottom-0 left-0 w-full min-h-[700px] h-[85vh] md:min-h-0 md:h-[70vh] z-0 flex flex-col justify-end bg-electric text-white overflow-hidden opacity-0 invisible"
          >
            <div id="footer-container-inner" className="w-full h-full px-6 md:px-12 lg:px-24 py-16 flex flex-col justify-between">
              <div className="max-w-[1400px] w-full mx-auto flex flex-col h-full justify-between">
                <div className="pt-8">
                  <div id="contact" className="text-white/60 font-semibold uppercase tracking-widest text-sm mb-4">Contact</div>
                  <h2 className="font-serif text-5xl md:text-7xl leading-tight mb-8">
                    Open for <br /> <em className="italic font-light">Collaboration</em>.
                  </h2>
                  <p className="text-xl text-white/80 mb-12">Want to say hello? Hit me up:</p>

                  <div className="flex flex-wrap gap-4">
                    <a
                      href="mailto:pacochp@gmail.com"
                      tabIndex={isFooterHidden ? -1 : 0}
                      onFocus={() => handleFooterLinkFocus("email")}
                      onBlur={() => sendCurtain("BLUR_CHANNEL")}
                      onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: "email" })}
                      onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <MailIcon /> Email
                    </a>
                    <a
                      href="https://www.linkedin.com/in/jakubpacocha/"
                      target="_blank"
                      rel="noopener noreferrer"
                      tabIndex={isFooterHidden ? -1 : 0}
                      onFocus={() => handleFooterLinkFocus("linkedin")}
                      onBlur={() => sendCurtain("BLUR_CHANNEL")}
                      onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: "linkedin" })}
                      onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <LinkedinIcon /> LinkedIn
                    </a>
                    <a
                      href="https://x.com/JakubPacocha"
                      target="_blank"
                      rel="noopener noreferrer"
                      tabIndex={isFooterHidden ? -1 : 0}
                      onFocus={() => handleFooterLinkFocus("twitter")}
                      onBlur={() => sendCurtain("BLUR_CHANNEL")}
                      onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: "twitter" })}
                      onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <TwitterIcon /> Twitter / X
                    </a>
                    <a
                      href="https://github.com/JPacoch"
                      target="_blank"
                      rel="noopener noreferrer"
                      tabIndex={isFooterHidden ? -1 : 0}
                      onFocus={() => handleFooterLinkFocus("github")}
                      onBlur={() => sendCurtain("BLUR_CHANNEL")}
                      onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: "github" })}
                      onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <GithubIcon /> GitHub
                    </a>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row justify-between items-center pt-8 border-t border-white/10 text-white/50 text-sm mt-12">
                  <div>© 2026 <span className="font-semibold text-white">Jakub Pacocha</span> All rights reserved.</div>
                  <div>Bydgoszcz, Poland</div>
                </div>
              </div>
            </div>
          </footer>

          <MachineInspectorHUD />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
