    :root {
      /* Light Mode Palette — Verified WCAG AA */
      --color-canvas: #fcfcfc;
      --color-surface: #f4f4f5;
      --color-surface-hover: #ececef;
      --color-ink: #111113;
      --color-ink-secondary: #4a4a52;
      --color-ink-muted: #63636d;
      --color-hairline: rgba(17, 17, 19, 0.08);
      --color-underline: rgba(17, 17, 19, 0.38);
      --color-underline-hover: #111113;

      --color-badge-bg: #dcfce7;
      --color-badge-text: #166534;

      /* Emerging Curtain Footer */
      --color-footer-bg: #0a0a0c;
      --color-footer-ink: #fafafa;
      --color-footer-secondary: #d4d4d8;
      --color-footer-muted: #a1a1aa;

      --shadow-tile:
        0px 0px 0px 1px oklch(0 0 0 / 0.06),
        0px 1px 2px 0px oklch(0 0 0 / 0.035);
      --shadow-chip: 0px 0px 0px 1px oklch(0 0 0 / 0.07);
      --shadow-main-curtain: 0px 24px 64px rgba(10, 10, 12, 0.22);
      --main-edge-ring: transparent;
    }

    html[data-theme="dark"] {
      /* Dark Mode Off-Black Palette (#2C2C2C) — Verified WCAG AA */
      --color-canvas: #2c2c2c;
      --color-surface: #353538;
      --color-surface-hover: #3e3e42;
      --color-ink: #f5f5f5;
      --color-ink-secondary: #d4d4d8;
      --color-ink-muted: #b4b4bc;
      --color-hairline: rgba(255, 255, 255, 0.1);
      --color-underline: rgba(255, 255, 255, 0.42);
      --color-underline-hover: #f5f5f5;

      --color-badge-bg: #1a4d2e;
      --color-badge-text: #bbf7d0;

      /* Emerging Curtain Footer (Deeper Charcoal under #2C2C2C) */
      --color-footer-bg: #1e1e20;
      --color-footer-ink: #f5f5f5;
      --color-footer-secondary: #d4d4d8;
      --color-footer-muted: #a8a8b2;

      --shadow-tile: 0px 0px 0px 1px oklch(1 0 0 / 0.1);

      --shadow-main-curtain: 0px 24px 64px rgba(0, 0, 0, 0.45);
      --main-edge-ring: rgba(255, 255, 255, 0.08);

    html {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      scroll-padding-block-start: 2rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-size-adjust: 100%;
    }

    @media (prefers-reduced-motion: no-preference) {
      html {
        scroll-behavior: smooth;
      }
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-canvas);
      color: var(--color-ink);
      overflow-x: clip;
    }

    .text-balance {
      text-wrap: balance;
    }

    .text-pretty {
      text-wrap: pretty;
    }

    /* Crisp Apple-style dotted underlines */
    .inline-link {
      color: var(--color-ink);
      font-weight: 500;
      text-decoration-line: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      text-decoration-color: var(--color-underline);
      transition-property: color, text-decoration-color;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    .muted-link {
      color: var(--color-ink-muted);
      text-decoration-line: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      text-decoration-color: var(--color-underline);
      transition-property: color, text-decoration-color;
      transition-duration: 150ms;
      transition-timing-function: ease-out;

    .tap-press {

      transition-timing-function: ease-out;

    .main-curtain-surface {

  <script type="text/babel" data-presets="my-react,env" data-type="module">
    const {
      useState,
      useEffect,
      useLayoutEffect,
      useRef,
      useMemo,
      useReducer,
      useCallback
    } = React;

    const MotionLib = window.Motion || {};
    const motion = MotionLib.motion;
    const AnimatePresence = MotionLib.AnimatePresence;
    const MotionConfig = MotionLib.MotionConfig || (({ children }) => children);
    const useFramerReducedMotion = MotionLib.useReducedMotion;

    function useReducedMotionSafe() {
      const framerPref = typeof useFramerReducedMotion === "function" ? useFramerReducedMotion() : null;
      const [mediaPref, setMediaPref] = useState(() =>
        typeof window !== "undefined" &&
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
      );

      useEffect(() => {
        if (!window.matchMedia) return;
        const mql = window.matchMedia("(prefers-reduced-motion: reduce)");
        const onChange = (e) => setMediaPref(e.matches);
        if (mql.addEventListener) mql.addEventListener("change", onChange);
        return () => {
          if (mql.removeEventListener) mql.removeEventListener("change", onChange);
        };
      }, []);

      return Boolean(framerPref ?? mediaPref);
    }

    // --- THEME SWITCH WITH TRANSITION SUPPRESSION ---
    function applyThemeWithoutSmear(nextTheme) {
      const style = document.createElement("style");
      style.append(document.createTextNode("*,*::before,*::after{transition:none !important}"));
      document.head.appendChild(style);

      if (nextTheme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }

      try {
        localStorage.setItem("jp-theme", nextTheme);
      } catch (e) {}

      void document.body.offsetHeight;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => style.remove());
      });
    }

    const MACHINE_REGISTRY = window.__APP_MACHINES__ || {};
    const GLOBAL_HISTORY = [];
    const GLOBAL_SUBSCRIBERS = new Set();
    let GLOBAL_SEQ = 0;

    function notifyGlobalSubscribers(record) {
      GLOBAL_SUBSCRIBERS.forEach((fn) => {
        try {
          fn(record);
        } catch (err) {
          console.error("[FSM Registry] Subscriber error:", err);
        }
      });
    }

    Object.defineProperties(MACHINE_REGISTRY, {
      __history__: { value: GLOBAL_HISTORY, enumerable: false, configurable: true },
      getAllSnapshots: {
        value: () => {
          const out = {};
          Object.keys(MACHINE_REGISTRY).forEach((k) => {
            if (MACHINE_REGISTRY[k] && typeof MACHINE_REGISTRY[k].getSnapshot === "function") {
              out[k] = MACHINE_REGISTRY[k].getSnapshot();
            }
          });
          return out;
        },
        enumerable: false,
        configurable: true
      },
      getHistory: {
        value: (limit = 30) => GLOBAL_HISTORY.slice(-limit),
        enumerable: false,
        configurable: true
      },
      send: {
        value: (machineId, event) => {
          const target = MACHINE_REGISTRY[machineId];
          if (!target || typeof target.send !== "function") return false;
          target.send(event);
          return true;
        },
        enumerable: false,
        configurable: true
      },
      resetAll: {
        value: () => {
          Object.keys(MACHINE_REGISTRY).forEach((k) => {
            if (MACHINE_REGISTRY[k] && typeof MACHINE_REGISTRY[k].reset === "function") {
              MACHINE_REGISTRY[k].reset();
            }
          });
        },
        enumerable: false,
        configurable: true
      },
      subscribe: {
        value: (listener) => {
          if (typeof listener !== "function") return () => {};
          GLOBAL_SUBSCRIBERS.add(listener);
          return () => GLOBAL_SUBSCRIBERS.delete(listener);
        },
        enumerable: false,
        configurable: true
      }
    });

    window.__APP_MACHINES__ = MACHINE_REGISTRY;

    function getAvailableEvents(config, stateValue) {
      const stateNode = config.states && config.states[stateValue];
      const stateEvents = stateNode && stateNode.on ? Object.keys(stateNode.on) : [];
      const rootEvents = config.on ? Object.keys(config.on) : [];
      return Array.from(new Set([...stateEvents, ...rootEvents]));
    }

    function evaluateMachineTransition(config, current, event) {
      const eventObj = typeof event === "string" ? { type: event } : (event || { type: "NOOP" });

      if (eventObj.type === "@@RESET") {
        const initialValue = typeof config.initial === "function" ? config.initial() : config.initial;
        const initialContext = typeof config.context === "function" ? config.context() : (config.context || {});
        return { value: initialValue, context: initialContext, changed: true, event: eventObj };
      }

      const stateNode = config.states && config.states[current.value];
      const handler =
        (stateNode && stateNode.on && stateNode.on[eventObj.type]) ||
        (config.on && config.on[eventObj.type]);

      if (!handler) {
        return { value: current.value, context: current.context, changed: false, event: eventObj };
      }

      let nextValue = current.value;
      let nextContext = current.context;

      if (typeof handler === "string") {
        nextValue = handler;
      } else if (typeof handler === "function") {
        const next = handler(current.context, eventObj, current.value);
        if (!next) {
          return { value: current.value, context: current.context, changed: false, event: eventObj };
        }
        nextValue = next.target || current.value;
        nextContext = next.context !== undefined ? next.context : current.context;
      } else if (typeof handler === "object") {
        nextValue = handler.target || current.value;
        nextContext = handler.reduce ? handler.reduce(current.context, eventObj, current.value) : current.context;
      }

      const changed = nextValue !== current.value || nextContext !== current.context;
      return { value: nextValue, context: nextContext, changed, event: eventObj };
    }

    function useMachine(config) {
      const initialRef = useRef(null);
      if (!initialRef.current) {
        initialRef.current = {
          value: typeof config.initial === "function" ? config.initial() : config.initial,
          context: typeof config.context === "function" ? config.context() : (config.context || {})
        };
      }

      const stateRef = useRef(initialRef.current);
      const historyRef = useRef([]);
      const listenersRef = useRef(new Set());
      const [, forceRender] = useReducer((x) => x + 1, 0);

      const send = useCallback((event) => {
        const prev = stateRef.current;
        const result = evaluateMachineTransition(config, prev, event);
        if (!result.changed) return stateRef.current;

        const nextState = { value: result.value, context: result.context };
        stateRef.current = nextState;

        const record = {
          seq: ++GLOBAL_SEQ,
          id: config.id || "anonymous",
          timestamp: new Date().toISOString(),
          event: result.event.type,
          from: prev.value,
          to: nextState.value
        };

        historyRef.current = [...historyRef.current.slice(-24), record];
        if (result.event.type !== "SCROLL_UPDATE" && result.event.type !== "SCRUB_PROGRESS") {
          GLOBAL_HISTORY.push(record);
          if (GLOBAL_HISTORY.length > 60) GLOBAL_HISTORY.shift();
        }

        forceRender();

        listenersRef.current.forEach((fn) => {
          try {
            fn(nextState, record);
          } catch (e) {
            console.error(e);
          }
        });
        notifyGlobalSubscribers(record);

        return nextState;
      }, [config]);

      const actor = useMemo(() => {
        const controller = {
          id: config.id,
          states: Object.keys(config.states || {}),
          send,
          reset: () => send({ type: "@@RESET" }),
          can: (eventType) => getAvailableEvents(config, stateRef.current.value).includes(eventType),
          getSnapshot: () => ({
            id: config.id,
            state: stateRef.current.value,
            context: stateRef.current.context,
            states: Object.keys(config.states || {}),
            availableEvents: getAvailableEvents(config, stateRef.current.value)
          }),
          subscribe: (fn) => {
            if (typeof fn !== "function") return () => {};
            listenersRef.current.add(fn);
            return () => listenersRef.current.delete(fn);
          }
        };

        Object.defineProperties(controller, {
          state: { get: () => stateRef.current.value, enumerable: true },
          context: { get: () => stateRef.current.context, enumerable: true },
          availableEvents: { get: () => getAvailableEvents(config, stateRef.current.value), enumerable: true },
          history: { get: () => historyRef.current.slice(), enumerable: true }
        });

        return controller;
      }, [config, send]);

      if (config.id && !MACHINE_REGISTRY[config.id]) {
        MACHINE_REGISTRY[config.id] = actor;
      }

      useEffect(() => {
        if (!config.id) return;
        MACHINE_REGISTRY[config.id] = actor;
        return () => {
          if (MACHINE_REGISTRY[config.id] === actor) {
            delete MACHINE_REGISTRY[config.id];
          }
        };
      }, [config.id, actor]);

      return [stateRef.current, send, actor];
    }

                  <article
                    key={edu.id}
                    className={`py-4 transition-opacity duration-150 ease-out ${
                      selectedTag && !matchesTag ? "opacity-35" : ""
                    }`}
                  >
                    <button
                      type="button"
                      aria-expanded={open}
                      aria-controls={panelId}
                      onClick={() => sendExplorer({ type: "TOGGLE_ITEM", id: edu.id })}
                      className="tap-press hover-surface w-full text-start -mx-3 px-3 py-2.5 rounded-xl flex items-start justify-between gap-3 cursor-pointer bg-transparent border-0"
                    >
                      <div className="min-w-0 flex-1 flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-1 sm:gap-4">
                        <div className="min-w-0">
                          <h3 className="text-base sm:text-[1.0625rem] font-medium text-ink tracking-[-0.015em] leading-[1.35]">
                            {edu.degree}
                          </h3>
                          <p className="mt-0.5 text-[0.9375rem] text-ink-muted">
                            {edu.institution}
                          </p>
                        </div>

                        <span className="text-[0.875rem] text-ink-muted tabular-nums shrink-0">
                          {edu.year}
                        </span>
                      </div>

                      <ChevronDownIcon
                        className={`no-print w-4 h-4 text-ink-muted shrink-0 mt-1 transition-transform duration-200 ease-[cubic-bezier(0.2,0,0,1)] ${
                          open ? "rotate-180" : ""
                        }`}
                      />
                    </button>

                    <CollapsiblePanel id={panelId} isOpen={open}>
                      <div className="pt-2.5 pb-1.5">
                        <p className="text-[0.96875rem] sm:text-base text-ink-secondary leading-[1.65] text-pretty mb-4 max-w-[58ch]">
                          {edu.thesis}
                        </p>

                        <div className="flex flex-wrap gap-1.5">
                          {edu.tags.map((tag) => {
                            const isTagSelected = selectedTag === tag;
                            return (
                              <button
                                key={tag}
                                type="button"
                                aria-pressed={isTagSelected}
                                onClick={() => sendExplorer({ type: "TOGGLE_TAG", tag })}
                                className={`tap-press px-2.5 py-1 min-h-[30px] rounded-md text-[0.8125rem] font-medium transition-colors duration-150 ease-out ${
                                  isTagSelected
                                    ? "bg-ink text-canvas"
                                    : "bg-surface text-ink-secondary hover-ink"
                                }`}
                              >
                                {tag}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </CollapsiblePanel>
                  </article>
                );
              })}
            </div>
          </motion.section>
        </motion.div>
      );
    };

    // --- SCROLL ENGINE & FOOTER CURTAIN MACHINES ---
    const SCROLL_ENGINE_MACHINE = {
      id: "scrollEngine",
      initial: () =>
        typeof window !== "undefined" &&
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "reducedMotion"
          : "idle",
      context: () => ({ direction: "down" }),
      on: {
        VISIBILITY_HIDDEN: "suspended",
        VISIBILITY_VISIBLE: "idle"
      },
      states: {
        idle: {
          on: {
            SCROLL_ACTIVE: (ctx, event) => ({ target: "scrolling", context: { ...ctx, direction: event.direction || ctx.direction } })
          }
        },
        scrolling: {
          on: {
            SCROLL_ACTIVE: (ctx, event) => {
              if (event.direction === ctx.direction) return null;
              return { target: "scrolling", context: { ...ctx, direction: event.direction } };
            },
            SCROLL_IDLE: "idle"
          }
        },
        suspended: {},
        reducedMotion: {}
      }
    };

    const FOOTER_CURTAIN_MACHINE = {
      id: "footerCurtain",
      initial: "hidden",
      context: () => ({ progress: 0, activeChannel: null }),
      on: {
        SCRUB_PROGRESS: (ctx, event, currentState) => {
          const p = Math.max(0, Math.min(1, Number(event.progress) || 0));
          const nextState = p <= 0.02 ? "hidden" : p >= 0.95 ? "revealed" : "revealing";
          if (nextState === currentState && Math.abs(ctx.progress - p) < 0.02) return null;
          return { target: nextState, context: { ...ctx, progress: Number(p.toFixed(3)) } };
        },
        REVEAL: (ctx) => ({ target: "revealed", context: { ...ctx, progress: 1 } }),
        FOCUS_CHANNEL: (ctx, event) => ({ context: { ...ctx, activeChannel: event.channel || null } }),
        BLUR_CHANNEL: (ctx) => ({ context: { ...ctx, activeChannel: null } })
      },
      states: { hidden: {}, revealing: {}, revealed: {} }
    };

    // --- FULL-BLEED EMERGING CURTAIN FOOTER ---
    const EmergingFooter = ({ curtainState, sendCurtain, reduce }) => {
      const handleFooterLinkFocus = (channel) => {
        sendCurtain({ type: "FOCUS_CHANNEL", channel });
        if (!reduce && curtainState.value !== "revealed") {
          window.scrollTo({
            top: document.documentElement.scrollHeight,
            behavior: "smooth"
          });
        }
      };

      const channels = [
        { id: "email", label: "Email", href: "mailto:pacochp@gmail.com", icon: <MailIcon />, external: false },
        { id: "linkedin", label: "LinkedIn", href: "https://www.linkedin.com/in/jakubpacocha/", icon: <LinkedinIcon />, external: true },
        { id: "twitter", label: "X / Twitter", href: "https://x.com/JakubPacocha", icon: <TwitterIcon />, external: true },
        { id: "github", label: "GitHub", href: "https://github.com/JPacoch", icon: <GithubIcon />, external: true }
      ];

      return (
        <footer
          id="footer-container"
          data-machine="footerCurtain"
          data-state={curtainState.value}
          data-progress={curtainState.context.progress}
          data-active-channel={curtainState.context.activeChannel || undefined}
          className={`${
            reduce
              ? "relative z-10 w-full bg-footer-bg text-footer-ink"
              : "fixed bottom-0 inset-x-0 z-0 h-[74dvh] min-h-[480px] sm:h-[64dvh] sm:min-h-[500px] w-full bg-footer-bg text-footer-ink overflow-hidden"
          } flex flex-col justify-between`}
        >
          <div
            id="footer-container-inner"
            className="w-full h-full max-w-[768px] mx-auto px-5 sm:px-8 pt-14 sm:pt-20 safe-bottom flex flex-col justify-between text-start"
          >
            <div className="my-auto">
              <p
                id="contact"
                className="font-medium text-xs uppercase tracking-[0.08em] text-footer-muted mb-4"
              >
                Contact
              </p>

              <h2 className="text-3xl sm:text-5xl font-medium leading-[1.08] tracking-[-0.035em] text-footer-ink text-balance mb-4">
                Open for{" "}
                <span className="text-footer-muted font-normal">collaboration.</span>
              </h2>

              <p className="text-[0.9375rem] sm:text-base text-footer-secondary leading-[1.6] text-pretty max-w-[42ch] mb-8">
                Want to discuss AI engineering, data systems, or a potential role?
              </p>

              <div className="flex flex-wrap items-center gap-2.5">
                {channels.map((ch) => (
                  <a
                    key={ch.id}
                    href={ch.href}
                    target={ch.external ? "_blank" : undefined}
                    rel={ch.external ? "noopener noreferrer" : undefined}
                    onFocus={() => handleFooterLinkFocus(ch.id)}
                    onBlur={() => sendCurtain("BLUR_CHANNEL")}
                    onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: ch.id })}
                    onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                    className="focus-ring-light tap-press hover-light-pill min-h-[42px] ps-3.5 pe-4 py-2 rounded-full bg-white/10 border border-white/15 text-footer-ink text-sm font-medium inline-flex items-center gap-2"
                  >
                    {ch.icon}
                    <span>{ch.label}</span>
                  </a>
                ))}
              </div>
            </div>

            <div className="pt-6 border-t border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-[0.8125rem] text-footer-muted">
              <span>© 2026 <span className="font-semibold text-footer-ink">Jakub Pacocha</span>. All rights reserved.</span>
              <span>Bydgoszcz, Poland</span>
            </div>
          </div>
        </footer>
      );
    };

    // --- ROOT APPLICATION ---
    const App = () => {
      const [scrollEngine, sendScrollEngine] = useMachine(SCROLL_ENGINE_MACHINE);
      const [curtainState, sendCurtain] = useMachine(FOOTER_CURTAIN_MACHINE);
      const reduce = useReducedMotionSafe();
      const mainRef = useRef(null);

      const [theme, setTheme] = useState(() =>
        typeof document !== "undefined" && document.documentElement.getAttribute("data-theme") === "dark"
          ? "dark"
          : "light"
      );

      const handleToggleTheme = useCallback(() => {
        setTheme((prev) => {
          const next = prev === "dark" ? "light" : "dark";
          applyThemeWithoutSmear(next);
          return next;
        });
      }, []);

      useEffect(() => {
        let lastY = window.scrollY;
        let idleTimer = null;

        const onScroll = () => {
          const currentY = window.scrollY;
          const direction = currentY >= lastY ? "down" : "up";
          lastY = currentY;
          sendScrollEngine({ type: "SCROLL_ACTIVE", direction });
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => sendScrollEngine("SCROLL_IDLE"), 160);
        };

        const onVisChange = () => {
          sendScrollEngine(document.visibilityState === "visible" ? "VISIBILITY_VISIBLE" : "VISIBILITY_HIDDEN");
        };

        window.addEventListener("scroll", onScroll, { passive: true });
        document.addEventListener("visibilitychange", onVisChange);
        return () => {
          clearTimeout(idleTimer);
          window.removeEventListener("scroll", onScroll);
          document.removeEventListener("visibilitychange", onVisChange);
        };
      }, [sendScrollEngine]);

      useLayoutEffect(() => {
        if (reduce || !window.gsap || !window.ScrollTrigger) {
          sendCurtain("REVEAL");
          return;
        }

        const { gsap, ScrollTrigger } = window;
        gsap.registerPlugin(ScrollTrigger);

        let st = null;
        let tl = null;
        let resizeObserver = null;

        const initCurtain = () => {
          const spacer = document.getElementById("footer-spacer");
          const mainEl = document.getElementById("main-content");
          const footerBackdrop = document.getElementById("footer-backdrop");
          const footerInner = document.getElementById("footer-container-inner");
          if (!spacer || !mainEl || !footerInner) return;

          const getCornerRadius = () => (window.innerWidth < 640 ? "26px" : "36px");

          tl = gsap.timeline()
            .to(footerBackdrop, { opacity: 1, duration: 0.06, ease: "none" }, 0)
            .to(
              mainEl,
              {
                scale: 0.96,
                borderBottomLeftRadius: getCornerRadius,
                borderBottomRightRadius: getCornerRadius,
                ease: "none"
              },
              0
            )
            .fromTo(
              footerInner,
              { y: "14%", opacity: 0.25 },
              { y: "0%", opacity: 1, ease: "none" },
              0
            );

          st = ScrollTrigger.create({
            trigger: spacer,
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            invalidateOnRefresh: true,
            onUpdate: (self) => {
              sendCurtain({ type: "SCRUB_PROGRESS", progress: self.progress });
            },
            animation: tl
          });

          ScrollTrigger.refresh();
        };

        const initTimer = window.setTimeout(initCurtain, 60);

        if (typeof ResizeObserver !== "undefined" && mainRef.current) {
          resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
          resizeObserver.observe(mainRef.current);
        }

        return () => {
          window.clearTimeout(initTimer);
          if (resizeObserver) resizeObserver.disconnect();
          if (st) st.kill();
          if (tl) tl.kill();
          gsap.set(["#main-content", "#footer-backdrop", "#footer-container-inner"], { clearProps: "all" });
        };
      }, [reduce, sendCurtain]);

      const enterItem = {
        hidden: reduce ? { opacity: 0 } : { opacity: 0, y: 10, filter: "blur(4px)" },
        visible: {
          opacity: 1,
          y: 0,
          filter: "blur(0px)",
          transition: { duration: 0.3, ease: "easeOut" }
        }
      };

      return (
        <MotionConfig reducedMotion="user">
          <div
            id="app-shell"
            data-machine="scrollEngine"
            data-state={scrollEngine.value}
            data-scroll-direction={scrollEngine.context.direction}
            className="bg-canvas min-h-[100dvh] font-sans text-ink selection:bg-ink selection:text-canvas"
          >
            <a
              href="#main-content"
              className="no-print sr-only focus:not-sr-only focus:fixed focus:top-4 focus:start-4 focus:z-[200] focus:px-4 focus:py-2 focus:rounded-lg focus:bg-ink focus:text-canvas focus:text-sm focus:font-medium"
            >
              Skip to content
            </a>

            {!reduce && (
              <div
                id="footer-backdrop"
                aria-hidden="true"
                className="fixed inset-0 z-0 bg-footer-bg opacity-0 pointer-events-none"
              />
            )}

            <main
              id="main-content"
              ref={mainRef}
              className="relative z-10 main-curtain-surface w-full origin-[50%_100%]"
            >
              <CVDocument
                theme={theme}
                onToggleTheme={handleToggleTheme}
                enterItem={enterItem}
              />
            </main>

            {!reduce && (
              <div
                id="footer-spacer"
                aria-hidden="true"
                className="h-[74dvh] min-h-[480px] sm:h-[64dvh] sm:min-h-[500px] w-full pointer-events-none"
              />
            )}

            <EmergingFooter
              curtainState={curtainState}
              sendCurtain={sendCurtain}
              reduce={reduce}
            />
          </div>
        </MotionConfig>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
