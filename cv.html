  <script type="text/babel" data-presets="my-react,env" data-type="module">
    const {
      useState,
      useEffect,
      useLayoutEffect,
      useRef,
      useMemo,
      useReducer,
      useCallback
    } = React;

    const MotionLib = window.Motion || {};
    const motion = MotionLib.motion;
    const AnimatePresence = MotionLib.AnimatePresence;
    const MotionConfig = MotionLib.MotionConfig || (({ children }) => children);
    const useFramerReducedMotion = MotionLib.useReducedMotion;

    function useReducedMotionSafe() {
      const framerPref = typeof useFramerReducedMotion === "function" ? useFramerReducedMotion() : null;
      const [mediaPref, setMediaPref] = useState(() =>
        typeof window !== "undefined" &&
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
      );

      useEffect(() => {
        if (!window.matchMedia) return;
        const mql = window.matchMedia("(prefers-reduced-motion: reduce)");
        const onChange = (e) => setMediaPref(e.matches);
        if (mql.addEventListener) mql.addEventListener("change", onChange);
        return () => {
          if (mql.removeEventListener) mql.removeEventListener("change", onChange);
        };
      }, []);

      return Boolean(framerPref ?? mediaPref);
    }

    // --- GLOBAL SOUND & HAPTICS ENGINE (Reproduces 0xchsh/portfolio GlobalHaptics + useHaptics) ---
    let SHARED_AUDIO_CTX = null;
    function getSharedAudioContext() {
      if (typeof window === "undefined") return null;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!SHARED_AUDIO_CTX) {
        try {
          SHARED_AUDIO_CTX = new AudioCtx();
        } catch (e) {
          return null;
        }
      }
      if (SHARED_AUDIO_CTX.state === "suspended") {
        SHARED_AUDIO_CTX.resume().catch(() => {});
      }
      return SHARED_AUDIO_CTX;
    }

    function isHapticsMuted() {
      try {
        return localStorage.getItem("haptics-muted") === "true";
      } catch (e) {
        return false;
      }
    }

    function playHapticClick() {
      if (isHapticsMuted()) return;
      const ctx = getSharedAudioContext();
      if (ctx) {
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const filter = ctx.createBiquadFilter();

          // Subtle tactile "toggle" click matching cuelume's toggle preset
          osc.type = "sine";
          osc.frequency.setValueAtTime(620, now);

                                aria-pressed={isTagSelected}
                                onClick={() => sendExplorer({ type: "TOGGLE_TAG", tag })}
                                className={`tap-press px-2.5 py-1 min-h-[30px] rounded-md text-[0.875rem] font-medium transition-colors duration-150 ease-out ${
                                  isTagSelected
                                    ? "bg-ink text-canvas"
                                    : "bg-surface text-ink-secondary hover-ink"
                                }`}
                              >
                                {tag}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </CollapsiblePanel>
                  </article>
                );
              })}
            </div>
          </motion.section>
        </motion.div>
      );
    };

    // --- SCROLL ENGINE & FOOTER CURTAIN MACHINES ---
    const SCROLL_ENGINE_MACHINE = {
      id: "scrollEngine",
      initial: () =>
        typeof window !== "undefined" &&
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "reducedMotion"
          : "idle",
      context: () => ({ direction: "down" }),
      on: {
        VISIBILITY_HIDDEN: "suspended",
        VISIBILITY_VISIBLE: "idle"
      },
      states: {
        idle: {
          on: {
            SCROLL_ACTIVE: (ctx, event) => ({ target: "scrolling", context: { ...ctx, direction: event.direction || ctx.direction } })
          }
        },
        scrolling: {
          on: {
            SCROLL_ACTIVE: (ctx, event) => {
              if (event.direction === ctx.direction) return null;
              return { target: "scrolling", context: { ...ctx, direction: event.direction } };
            },
            SCROLL_IDLE: "idle"
          }
        },
        suspended: {},
        reducedMotion: {}
      }
    };

    const FOOTER_CURTAIN_MACHINE = {
      id: "footerCurtain",
      initial: "hidden",
      context: () => ({ progress: 0, activeChannel: null }),
      on: {
        SCRUB_PROGRESS: (ctx, event, currentState) => {
          const p = Math.max(0, Math.min(1, Number(event.progress) || 0));
          const nextState = p <= 0.02 ? "hidden" : p >= 0.95 ? "revealed" : "revealing";
          if (nextState === currentState && Math.abs(ctx.progress - p) < 0.02) return null;
          return { target: nextState, context: { ...ctx, progress: Number(p.toFixed(3)) } };
        },
        REVEAL: (ctx) => ({ target: "revealed", context: { ...ctx, progress: 1 } }),
        FOCUS_CHANNEL: (ctx, event) => ({ context: { ...ctx, activeChannel: event.channel || null } }),
        BLUR_CHANNEL: (ctx) => ({ context: { ...ctx, activeChannel: null } })
      },
      states: { hidden: {}, revealing: {}, revealed: {} }
    };

    // --- FULL-BLEED EMERGING CURTAIN FOOTER ---
    const EmergingFooter = ({ curtainState, sendCurtain, reduce }) => {
      const handleFooterLinkFocus = (channel) => {
        sendCurtain({ type: "FOCUS_CHANNEL", channel });
        if (!reduce && curtainState.value !== "revealed") {
          window.scrollTo({
            top: document.documentElement.scrollHeight,
            behavior: "smooth"
          });
        }
      };

      const channels = [
        { id: "email", label: "Email", href: "mailto:pacochp@gmail.com", icon: <MailIcon />, external: false },
        { id: "linkedin", label: "LinkedIn", href: "https://www.linkedin.com/in/jakubpacocha/", icon: <LinkedinIcon />, external: true },
        { id: "twitter", label: "X / Twitter", href: "https://x.com/JakubPacocha", icon: <TwitterIcon />, external: true },
        { id: "github", label: "GitHub", href: "https://github.com/JPacoch", icon: <GithubIcon />, external: true }
      ];

      return (
        <footer
          id="footer-container"
          data-machine="footerCurtain"
          data-state={curtainState.value}
          data-progress={curtainState.context.progress}
          data-active-channel={curtainState.context.activeChannel || undefined}
          className={`${
            reduce
              ? "relative z-10 w-full bg-footer-bg text-footer-ink"
              : "fixed bottom-0 inset-x-0 z-0 h-[74dvh] min-h-[480px] sm:h-[64dvh] sm:min-h-[500px] w-full bg-footer-bg text-footer-ink overflow-hidden"
          } font-sans flex flex-col justify-between`}
        >
          <div
            id="footer-container-inner"
            className="w-full h-full max-w-[768px] mx-auto px-5 sm:px-8 pt-14 sm:pt-20 safe-bottom flex flex-col justify-between text-start"
          >
            <div className="my-auto">


              <h2 className="text-4xl sm:text-7xl font-semibold leading-[1.08] tracking-[-0.03em] text-footer-ink text-balance mb-4">
                Open for{" "}
                <span className="text-footer-muted font-medium italic">collaboration.</span>
              </h2>

              <p className="text-base sm:text-[1.0625rem] text-footer-secondary leading-[1.6] text-pretty max-w-[42ch] mb-8">
                Want to discuss AI engineering, data systems or a potential role?
              </p>

              <div className="flex flex-wrap items-center gap-2.5">
                {channels.map((ch) => (
                  <a
                    key={ch.id}
                    href={ch.href}
                    target={ch.external ? "_blank" : undefined}
                    rel={ch.external ? "noopener noreferrer" : undefined}
                    onFocus={() => handleFooterLinkFocus(ch.id)}
                    onBlur={() => sendCurtain("BLUR_CHANNEL")}
                    onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: ch.id })}
                    onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                    className="focus-ring-light tap-press hover-light-pill min-h-[42px] ps-3.5 pe-4 py-2 rounded-full bg-white/10 border border-white/15 text-footer-ink text-[0.9375rem] font-medium inline-flex items-center gap-2"
                  >
                    {ch.icon}
                    <span>{ch.label}</span>
                  </a>
                ))}
              </div>
            </div>

            <div className="pt-6 border-t border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-base text-footer-muted">
              <span>© 2026 <span className="font-semibold text-footer-ink">Jakub Pacocha</span>. All rights reserved.</span>
              <span>Bydgoszcz, Poland</span>
            </div>
          </div>
        </footer>
      );
    };

    // --- ROOT APPLICATION ---
    const App = () => {
      const [scrollEngine, sendScrollEngine] = useMachine(SCROLL_ENGINE_MACHINE);
      const [curtainState, sendCurtain] = useMachine(FOOTER_CURTAIN_MACHINE);
      const reduce = useReducedMotionSafe();
      const mainRef = useRef(null);

      const [theme, setTheme] = useState(() =>
        typeof document !== "undefined" && document.documentElement.getAttribute("data-theme") === "dark"
          ? "dark"
          : "light"
      );

      const [hapticsMuted, setHapticsMuted] = useState(() => isHapticsMuted());

      const handleToggleHaptics = useCallback(() => {
        setHapticsMuted((prev) => {
          const next = !prev;
          try {
            localStorage.setItem("haptics-muted", String(next));
          } catch (e) {}
          window.dispatchEvent(new Event("haptics-muted-change"));
          return next;
        });
      }, []);

      const handleToggleTheme = useCallback(() => {
        setTheme((prev) => {
          const next = prev === "dark" ? "light" : "dark";
          applyThemeWithoutSmear(next);
          return next;
        });
      }, []);

      useEffect(() => {
        let lastY = window.scrollY;
        let idleTimer = null;

        const onScroll = () => {
          const currentY = window.scrollY;
          const direction = currentY >= lastY ? "down" : "up";
          lastY = currentY;
          sendScrollEngine({ type: "SCROLL_ACTIVE", direction });
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => sendScrollEngine("SCROLL_IDLE"), 160);
        };

        const onVisChange = () => {
          sendScrollEngine(document.visibilityState === "visible" ? "VISIBILITY_VISIBLE" : "VISIBILITY_HIDDEN");
        };

        window.addEventListener("scroll", onScroll, { passive: true });
        document.addEventListener("visibilitychange", onVisChange);
        return () => {
          clearTimeout(idleTimer);
          window.removeEventListener("scroll", onScroll);
          document.removeEventListener("visibilitychange", onVisChange);
        };
      }, [sendScrollEngine]);

      useLayoutEffect(() => {
        if (reduce || !window.gsap || !window.ScrollTrigger) {
          sendCurtain("REVEAL");
          return;
        }

        const { gsap, ScrollTrigger } = window;
        gsap.registerPlugin(ScrollTrigger);

        let st = null;
        let tl = null;
        let resizeObserver = null;

        const initCurtain = () => {
          const spacer = document.getElementById("footer-spacer");
          const mainEl = document.getElementById("main-content");
          const footerBackdrop = document.getElementById("footer-backdrop");
          const footerInner = document.getElementById("footer-container-inner");
          if (!spacer || !mainEl || !footerInner) return;

          const getCornerRadius = () => (window.innerWidth < 640 ? "26px" : "36px");

          tl = gsap.timeline()
            .to(footerBackdrop, { opacity: 1, duration: 0.06, ease: "none" }, 0)
            .to(
              mainEl,
              {
                scale: 0.96,
                borderBottomLeftRadius: getCornerRadius,
                borderBottomRightRadius: getCornerRadius,
                ease: "none"
              },
              0
            )
            .fromTo(
              footerInner,
              { y: "14%", opacity: 0.25 },
              { y: "0%", opacity: 1, ease: "none" },
              0
            );

          st = ScrollTrigger.create({
            trigger: spacer,
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            invalidateOnRefresh: true,
            onUpdate: (self) => {
              sendCurtain({ type: "SCRUB_PROGRESS", progress: self.progress });
            },
            animation: tl
          });

          ScrollTrigger.refresh();
        };

        const initTimer = window.setTimeout(initCurtain, 60);

        if (typeof ResizeObserver !== "undefined" && mainRef.current) {
          resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
          resizeObserver.observe(mainRef.current);
        }

        return () => {
          window.clearTimeout(initTimer);
          if (resizeObserver) resizeObserver.disconnect();
          if (st) st.kill();
          if (tl) tl.kill();
          gsap.set(["#main-content", "#footer-backdrop", "#footer-container-inner"], { clearProps: "all" });
        };
      }, [reduce, sendCurtain]);

      const enterItem = {
        hidden: reduce ? { opacity: 0 } : { opacity: 0, y: 10, filter: "blur(4px)" },
        visible: {
          opacity: 1,
          y: 0,
          filter: "blur(0px)",
          transition: { duration: 0.3, ease: "easeOut" }
        }
      };

      return (
        <MotionConfig reducedMotion="user">
          <div
            id="app-shell"
            data-machine="scrollEngine"
            data-state={scrollEngine.value}
            data-scroll-direction={scrollEngine.context.direction}
            className="bg-canvas min-h-[100dvh] font-sans text-ink"
          >
            <GlobalHaptics />
            <ClickSpark />

            <a
              href="#main-content"
              className="no-print sr-only focus:not-sr-only focus:fixed focus:top-4 focus:start-4 focus:z-[200] focus:px-4 focus:py-2 focus:rounded-lg focus:bg-ink focus:text-canvas focus:text-sm focus:font-medium"
            >
              Skip to content
            </a>

            {!reduce && (
              <div
                id="footer-backdrop"
                aria-hidden="true"
                className="fixed inset-0 z-0 bg-footer-bg opacity-0 pointer-events-none"
              />
            )}

            <main
              id="main-content"
              ref={mainRef}
              className="relative z-10 main-curtain-surface w-full origin-[50%_100%]"
            >
              <CVDocument
                theme={theme}
                onToggleTheme={handleToggleTheme}
                hapticsMuted={hapticsMuted}
                onToggleHaptics={handleToggleHaptics}
                enterItem={enterItem}
              />
            </main>

            {!reduce && (
              <div
                id="footer-spacer"
                aria-hidden="true"
                className="h-[74dvh] min-h-[480px] sm:h-[64dvh] sm:min-h-[500px] w-full pointer-events-none"
              />
            )}

            <EmergingFooter
              curtainState={curtainState}
              sendCurtain={sendCurtain}
              reduce={reduce}
            />
          </div>
        </MotionConfig>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
