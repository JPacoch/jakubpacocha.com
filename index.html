    const { useState, useEffect, useLayoutEffect, useRef, useMemo, useReducer, useCallback } = React;

    // --- EXPLICIT FINITE STATE MACHINE ENGINE & AGENT/DEV TELEMETRY REGISTRY (UX + DX + AX) ---
    // Deterministic state transitions, synchronous snapshot consistency, bounded transition history,
    // event capability introspection, and live pub/sub on window.__APP_MACHINES__.
    const MACHINE_REGISTRY = window.__APP_MACHINES__ || {};
    const GLOBAL_HISTORY = [];
    const GLOBAL_SUBSCRIBERS = new Set();
    let GLOBAL_SEQ = 0;

    function notifyGlobalSubscribers(record) {
      GLOBAL_SUBSCRIBERS.forEach((fn) => {
        try {
          fn(record);
        } catch (err) {
          console.error("[FSM Registry] Subscriber error:", err);
        }
      });
    }

    Object.defineProperties(MACHINE_REGISTRY, {
      __history__: { value: GLOBAL_HISTORY, enumerable: false, configurable: true },
      getAllSnapshots: {
        value: () => {
          const out = {};
          Object.keys(MACHINE_REGISTRY).forEach((k) => {
            if (MACHINE_REGISTRY[k] && typeof MACHINE_REGISTRY[k].getSnapshot === "function") {
              out[k] = MACHINE_REGISTRY[k].getSnapshot();
            }
          });
          return out;
        },
        enumerable: false,
        configurable: true
      },
      getHistory: {
        value: (limit = 30) => GLOBAL_HISTORY.slice(-limit),
        enumerable: false,
        configurable: true
      },
      send: {
        value: (machineId, event) => {
          const target = MACHINE_REGISTRY[machineId];
          if (!target || typeof target.send !== "function") return false;
          target.send(event);
          return true;
        },
        enumerable: false,
        configurable: true
      },
      resetAll: {
        value: () => {
          Object.keys(MACHINE_REGISTRY).forEach((k) => {
            if (MACHINE_REGISTRY[k] && typeof MACHINE_REGISTRY[k].reset === "function") {
              MACHINE_REGISTRY[k].reset();
            }
          });
        },
        enumerable: false,
        configurable: true
      },
      subscribe: {
        value: (listener) => {
          if (typeof listener !== "function") return () => {};
          GLOBAL_SUBSCRIBERS.add(listener);
          return () => GLOBAL_SUBSCRIBERS.delete(listener);
        },
        enumerable: false,
        configurable: true
      },
      inspect: {
        value: () => {
          if (MACHINE_REGISTRY.machineInspector) {
            MACHINE_REGISTRY.machineInspector.send("TOGGLE");
            return MACHINE_REGISTRY.getAllSnapshots();
          }
          return MACHINE_REGISTRY.getAllSnapshots();
        },
        enumerable: false,
        configurable: true
      }
    });

    window.__APP_MACHINES__ = MACHINE_REGISTRY;

    function getAvailableEvents(config, stateValue) {
      const stateNode = config.states && config.states[stateValue];
      const stateEvents = stateNode && stateNode.on ? Object.keys(stateNode.on) : [];
      const rootEvents = config.on ? Object.keys(config.on) : [];
      return Array.from(new Set([...stateEvents, ...rootEvents]));
    }

    function evaluateMachineTransition(config, current, event) {
      const eventObj = typeof event === "string" ? { type: event } : (event || { type: "NOOP" });

      if (eventObj.type === "@@RESET") {
        const initialValue = typeof config.initial === "function" ? config.initial() : config.initial;
        const initialContext = typeof config.context === "function" ? config.context() : (config.context || {});
        return {
          value: initialValue,
          context: initialContext,
          changed: true,
          event: eventObj
        };
      }

      const stateNode = config.states && config.states[current.value];
      const handler =
        (stateNode && stateNode.on && stateNode.on[eventObj.type]) ||
        (config.on && config.on[eventObj.type]);

      if (!handler) {
        return { value: current.value, context: current.context, changed: false, event: eventObj };
      }

      let nextValue = current.value;
      let nextContext = current.context;

      if (typeof handler === "string") {
        nextValue = handler;
      } else if (typeof handler === "function") {
        const next = handler(current.context, eventObj, current.value);
        if (!next) {
          return { value: current.value, context: current.context, changed: false, event: eventObj };
        }
        nextValue = next.target || current.value;
        nextContext = next.context !== undefined ? next.context : current.context;
      } else if (typeof handler === "object") {
        nextValue = handler.target || current.value;
        nextContext = handler.reduce
          ? handler.reduce(current.context, eventObj, current.value)
          : current.context;
      }

      const changed = nextValue !== current.value || nextContext !== current.context;
      return { value: nextValue, context: nextContext, changed, event: eventObj };
    }

    function useMachine(config) {
      const initialRef = useRef(null);
      if (!initialRef.current) {
        initialRef.current = {
          value: typeof config.initial === "function" ? config.initial() : config.initial,
          context: typeof config.context === "function" ? config.context() : (config.context || {})
        };
      }

      const stateRef = useRef(initialRef.current);
      const historyRef = useRef([]);
      const listenersRef = useRef(new Set());
      const [, forceRender] = useReducer((x) => x + 1, 0);

      const send = useCallback((event) => {
        const prev = stateRef.current;
        const result = evaluateMachineTransition(config, prev, event);
        if (!result.changed) return stateRef.current;

        const nextState = { value: result.value, context: result.context };
        stateRef.current = nextState;

        const record = {
          seq: ++GLOBAL_SEQ,
          id: config.id || "anonymous",
          timestamp: new Date().toISOString(),
          event: result.event.type,
          from: prev.value,
          to: nextState.value
        };

        historyRef.current = [...historyRef.current.slice(-24), record];
        if (config.id !== "machineInspector" && result.event.type !== "SCROLL_UPDATE" && result.event.type !== "SCRUB_PROGRESS" && result.event.type !== "TICK") {
          GLOBAL_HISTORY.push(record);
          if (GLOBAL_HISTORY.length > 60) GLOBAL_HISTORY.shift();
        }

        forceRender();

        listenersRef.current.forEach((fn) => {
          try {
            fn(nextState, record);
          } catch (e) {
            console.error(e);
          }
        });
        notifyGlobalSubscribers(record);

        return nextState;
      }, [config]);

      const actor = useMemo(() => {
        const controller = {
          id: config.id,
          states: Object.keys(config.states || {}),
          send,
          reset: () => send({ type: "@@RESET" }),
          can: (eventType) => getAvailableEvents(config, stateRef.current.value).includes(eventType),
          getSnapshot: () => ({
            id: config.id,
            state: stateRef.current.value,
            context: stateRef.current.context,
            states: Object.keys(config.states || {}),
            availableEvents: getAvailableEvents(config, stateRef.current.value)
          }),
          subscribe: (fn) => {
            if (typeof fn !== "function") return () => {};
            listenersRef.current.add(fn);
            return () => listenersRef.current.delete(fn);
          }
        };

        Object.defineProperties(controller, {
          state: {
            get: () => stateRef.current.value,
            enumerable: true
          },
          context: {
            get: () => stateRef.current.context,
            enumerable: true
          },
          availableEvents: {
            get: () => getAvailableEvents(config, stateRef.current.value),
            enumerable: true
          },
          history: {
            get: () => historyRef.current.slice(),
            enumerable: true
          }
        });

        return controller;
      }, [config, send]);

      if (config.id && !MACHINE_REGISTRY[config.id]) {
        MACHINE_REGISTRY[config.id] = actor;
      }

      useEffect(() => {
        if (!config.id) return;
        MACHINE_REGISTRY[config.id] = actor;
        return () => {
          if (MACHINE_REGISTRY[config.id] === actor) {
            delete MACHINE_REGISTRY[config.id];
          }
        };
      }, [config.id, actor]);

      return [stateRef.current, send, actor];
    }

    // --- UNIFIED SECTION & HASH NAVIGATION HELPER ---
    function triggerSectionNavigation(e, sectionId, href) {

        ? document.getElementById("footer-spacer")

      if (!targetEl) return;
      if (e && typeof e.preventDefault === "function") {
        e.preventDefault();
      }

      if (MACHINE_REGISTRY.navigation) {
        MACHINE_REGISTRY.navigation.send({ type: "NAVIGATE", section: isContact ? "writing" : sectionId });
      }
      if (MACHINE_REGISTRY.scrollEngine) {
        MACHINE_REGISTRY.scrollEngine.send({ type: "PROGRAMMATIC_START", target: sectionId });
      }
      if (isContact && MACHINE_REGISTRY.footerCurtain) {
        MACHINE_REGISTRY.footerCurtain.send("REVEAL");
      }

      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", targetHref);
      }

      if (window.__LENIS__) {
        window.__LENIS__.scrollTo(isContact ? document.body.scrollHeight : targetEl, {
          offset: isContact ? 0 : -20,
          onComplete: () => {
            if (MACHINE_REGISTRY.navigation) {
              MACHINE_REGISTRY.navigation.send("NAVIGATE_COMPLETE");
            }
            if (MACHINE_REGISTRY.scrollEngine) {
              MACHINE_REGISTRY.scrollEngine.send("PROGRAMMATIC_END");
            }
          }
        });
      } else {
        targetEl.scrollIntoView({ behavior: "smooth" });
      }
    }

    // --- LIVE LOCAL TIME TELEMETRY MACHINE (Explicit Visibility & Deterministic Freeze State Machine) ---
    const computeBydgoszczTimeSnapshot = () => {
      try {
        const now = new Date();
        const timeFmt = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Europe/Warsaw',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const tzParts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Europe/Warsaw',
          timeZoneName: 'short'
        }).formatToParts(now);
        const tzName = tzParts.find(p => p.type === 'timeZoneName')?.value || 'CET';
        return {
          formatted: `${timeFmt.format(now)} ${tzName}`,
          timezone: tzName,
          ok: true
        };
      } catch (e) {
        return {
          formatted: "53°07'N 18°00'E",
          timezone: "UTC+1",
          ok: false
        };
      }
    };

    const TELEMETRY_CLOCK_MACHINE = {
      id: "telemetryClock",
      initial: () => {
        const snap = computeBydgoszczTimeSnapshot();
        if (!snap.ok) return "fallback";
        if (typeof document !== "undefined" && document.visibilityState === "hidden") return "suspended";
        return "ticking";
      },
      context: () => {
        const snap = computeBydgoszczTimeSnapshot();
        return {
          formatted: snap.formatted,
          timezone: snap.timezone,
          coordinates: "53°07′N 18°00′E"
        };
      },
      on: {
        FREEZE: (ctx, event) => ({
          target: "frozen",
          context: {
            ...ctx,
            formatted: event.formatted || ctx.formatted
          }
        }),
        UNFREEZE: (ctx) => {
          const snap = computeBydgoszczTimeSnapshot();
          return {
            target: snap.ok ? "ticking" : "fallback",
            context: {
              ...ctx,
              formatted: snap.formatted,
              timezone: snap.timezone
            }
          };
        }
      },
      states: {
        ticking: {
          on: {
            TICK: (ctx) => {
              const snap = computeBydgoszczTimeSnapshot();
              if (!snap.ok) {
                return { target: "fallback", context: { ...ctx, formatted: snap.formatted } };
              }
              if (snap.formatted === ctx.formatted) return null;
              return {
                target: "ticking",
                context: { ...ctx, formatted: snap.formatted, timezone: snap.timezone }
              };
            },
            VISIBILITY_HIDDEN: "suspended"
          }
        },
        suspended: {
          on: {
            VISIBILITY_VISIBLE: (ctx) => {
              const snap = computeBydgoszczTimeSnapshot();
              return {
                target: snap.ok ? "ticking" : "fallback",
                context: { ...ctx, formatted: snap.formatted, timezone: snap.timezone }
              };
            }
          }
        },
        frozen: {},
        fallback: {}
      }
    };

    const useBydgoszczTime = () => {
      const [clockState, send] = useMachine(TELEMETRY_CLOCK_MACHINE);

      useEffect(() => {
        if (clockState.value !== "ticking") return;
        const id = setInterval(() => {
          send("TICK");
        }, 1000);
        return () => clearInterval(id);
      }, [clockState.value, send]);

      useEffect(() => {
        const onVisChange = () => {
          send(document.visibilityState === "visible" ? "VISIBILITY_VISIBLE" : "VISIBILITY_HIDDEN");
        };
        document.addEventListener("visibilitychange", onVisChange);
        return () => document.removeEventListener("visibilitychange", onVisChange);
      }, [send]);

      return clockState;
    };

      }),
      on: {
        SCROLL_UPDATE: (ctx, event) => {
          const nextElevation = event.scrollY > 30 ? "elevated" : "top";
          const nextRegion = event.detectedRegion || event.activeSection || ctx.detectedRegion;
          let nextSection = event.activeSection || ctx.activeSection;
          let nextScrollMode = ctx.scrollMode;
          let nextTarget = ctx.targetSection;

          if (ctx.scrollMode === "programmatic" && ctx.targetSection) {
            if (event.activeSection === ctx.targetSection) {
              nextScrollMode = "spy";
              nextTarget = null;
              nextSection = ctx.targetSection;
            } else {
              nextSection = ctx.targetSection;
            }
          }

          if (
            ctx.elevation === nextElevation &&
            ctx.activeSection === nextSection &&
            ctx.detectedRegion === nextRegion &&
            ctx.scrollMode === nextScrollMode
          ) {
            return null;
          }

          return {
            context: {
              ...ctx,
              elevation: nextElevation,
              activeSection: nextSection,
              detectedRegion: nextRegion,
              scrollMode: nextScrollMode,
              targetSection: nextTarget
            }
          };
        },
        NAVIGATE: (ctx, event) => {
          const targetSec = event.section || ctx.activeSection;
          return {
            target: "closed",
            context: {
              ...ctx,
              activeSection: targetSec,
              targetSection: targetSec,
              scrollMode: "programmatic"
            }
          };
        },
        NAVIGATE_COMPLETE: (ctx) => {
          if (ctx.scrollMode === "spy" && !ctx.targetSection) return null;
          return {
            context: {
              ...ctx,
              scrollMode: "spy",
              targetSection: null
            }
          };
        }
      },
      states: {
        closed: {
          on: {
            TOGGLE_MENU: "open",
            OPEN_MENU: "open"
          }
        },
        open: {
          on: {
            TOGGLE_MENU: "closed",
            CLOSE_MENU: "closed",
            ESCAPE: "closed",
            VIEWPORT_DESKTOP: "closed"
          }
        }
      }
    };

    const Nav = () => {
      const [navState, send] = useMachine(NAV_MACHINE_CONFIG);
      const isOpen = navState.value === "open";
      const { elevation, activeSection, detectedRegion, scrollMode } = navState.context;
      const scrolled = elevation === "elevated";

      useEffect(() => {
        if (MACHINE_REGISTRY.scrollEngine) {
          MACHINE_REGISTRY.scrollEngine.send(
            isOpen ? { type: "LOCK", reason: "mobile-nav" } : { type: "UNLOCK" }
          );
        }
      }, [isOpen]);

      useEffect(() => {
        let programmaticTimer = null;

        const computeScrollState = () => {
          const navSections = ["writing", "projects", "about", "hero"];
          const allRegions = ["writing", "projects", "github", "skills", "about", "hero"];
          const scrollPos = window.scrollY + 240;

          let detectedSec = "hero";
          for (const secId of navSections) {
            const el = document.getElementById(secId);
            if (el && scrollPos >= el.offsetTop) {
              detectedSec = secId;
              break;
            }
          }

          let region = detectedSec;
          for (const regId of allRegions) {
            const el = document.getElementById(regId);
            if (el && scrollPos >= el.offsetTop) {
              region = regId;
              break;
            }
          }

          const footerSpacer = document.getElementById("footer-spacer");
          if (footerSpacer && window.scrollY + window.innerHeight >= footerSpacer.offsetTop + 180) {
            region = "contact";
          }

          send({
            type: "SCROLL_UPDATE",
            scrollY: window.scrollY,
            activeSection: detectedSec,
            detectedRegion: region
          });
        };

        const cancelProgrammaticOnUserInput = () => {
          if (MACHINE_REGISTRY.navigation && MACHINE_REGISTRY.navigation.context.scrollMode === "programmatic") {
            clearTimeout(programmaticTimer);
            programmaticTimer = setTimeout(() => {
              send("NAVIGATE_COMPLETE");
            }, 150);
          }
        };

        computeScrollState();

        if (window.location.hash && window.location.hash.length > 1) {
          const initialHashId = window.location.hash.slice(1);
          if (["about", "projects", "writing", "contact"].includes(initialHashId)) {
            setTimeout(() => {
              triggerSectionNavigation(null, initialHashId, `#${initialHashId}`);
            }, 120);
          }
        }

        window.addEventListener("scroll", computeScrollState, { passive: true });
        window.addEventListener("wheel", cancelProgrammaticOnUserInput, { passive: true });
        window.addEventListener("touchmove", cancelProgrammaticOnUserInput, { passive: true });
        return () => {
          clearTimeout(programmaticTimer);
          window.removeEventListener("scroll", computeScrollState);
          window.removeEventListener("wheel", cancelProgrammaticOnUserInput);
          window.removeEventListener("touchmove", cancelProgrammaticOnUserInput);
        };
      }, [send]);

      useEffect(() => {
        if (!isOpen) return;
        const onKeyDown = (e) => {
          if (e.key === "Escape") send("ESCAPE");
        };
        const onResize = () => {
          if (window.innerWidth >= 768) send("VIEWPORT_DESKTOP");
        };
        window.addEventListener("keydown", onKeyDown);
        window.addEventListener("resize", onResize);
        return () => {
          window.removeEventListener("keydown", onKeyDown);
          window.removeEventListener("resize", onResize);
        };
      }, [isOpen, send]);

      const handleAnchorClick = (e, sectionId, href) => {

      return (
        <>

    // --- ROTATING WORDS IN HERO (Explicit Ticker + Dual-Source Pause + Timer Reset State Machine) ---
    const HERO_ROTATOR_ITEMS = [
      { text: "HERE Technologies", tag: "Spatial & AI Engineering" },

      { text: "local NGOs", tag: "Civic Tech & Urban Impact" },

    const HERO_ROTATOR_MACHINE = {
      id: "heroRotator",
      initial: () =>
        typeof window !== "undefined" &&
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "reducedMotion"
          : "running",
      context: () => ({
        index: 0,
        total: HERO_ROTATOR_ITEMS.length,
        interactionPaused: false,
        visibilityPaused: false,
        cycleKey: 0
      }),
      on: {
        NEXT: (ctx, _event, currentState) => ({
          target: currentState,
          context: {
            ...ctx,
            index: (ctx.index + 1) % ctx.total,
            cycleKey: ctx.cycleKey + 1
          }
        }),
        PREV: (ctx, _event, currentState) => ({
          target: currentState,
          context: {
            ...ctx,
            index: (ctx.index - 1 + ctx.total) % ctx.total,
            cycleKey: ctx.cycleKey + 1
          }
        }),
        SELECT_INDEX: (ctx, event, currentState) => ({
          target: currentState,
          context: {
            ...ctx,
            index: Math.abs(Number(event.index) || 0) % ctx.total,
            cycleKey: ctx.cycleKey + 1
          }
        })
      },
      states: {
        running: {
          on: {
            TICK: (ctx) => ({
              target: "running",
              context: { ...ctx, index: (ctx.index + 1) % ctx.total }
            }),
            PAUSE: (ctx) => ({
              target: "paused",
              context: { ...ctx, interactionPaused: true }
            }),
            VISIBILITY_HIDDEN: (ctx) => ({
              target: "paused",
              context: { ...ctx, visibilityPaused: true }
            }),
            REDUCED_MOTION: "reducedMotion"
          }
        },
        paused: {
          on: {
            PAUSE: (ctx) => ({
              target: "paused",
              context: { ...ctx, interactionPaused: true }
            }),
            VISIBILITY_HIDDEN: (ctx) => ({
              target: "paused",
              context: { ...ctx, visibilityPaused: true }
            }),
            RESUME: (ctx) => {
              const nextCtx = { ...ctx, interactionPaused: false };
              return {
                target: nextCtx.visibilityPaused ? "paused" : "running",
                context: nextCtx
              };
            },
            VISIBILITY_VISIBLE: (ctx) => {
              const nextCtx = { ...ctx, visibilityPaused: false };
              return {
                target: nextCtx.interactionPaused ? "paused" : "running",
                context: nextCtx
              };
            },
            REDUCED_MOTION: "reducedMotion"
          }
        },
        reducedMotion: {
          on: {
            MOTION_ALLOWED: (ctx) => ({
              target: ctx.interactionPaused || ctx.visibilityPaused ? "paused" : "running",
              context: ctx
            })
          }
        }
      }
    };

    const RotatingWords = () => {
      const [rotator, send] = useMachine(HERO_ROTATOR_MACHINE);
      const { index, cycleKey } = rotator.context;
      const currentItem = HERO_ROTATOR_ITEMS[index];

      useEffect(() => {
        if (rotator.value !== "running") return;
        const interval = setInterval(() => {
          send("TICK");
        }, 2800);
        return () => clearInterval(interval);
      }, [rotator.value, cycleKey, send]);

      useEffect(() => {
        const onVisChange = () => {
          send(document.visibilityState === "visible" ? "VISIBILITY_VISIBLE" : "VISIBILITY_HIDDEN");
        };
        document.addEventListener("visibilitychange", onVisChange);

        const mql = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
        const onMotionChange = (e) => {
          send(e.matches ? "REDUCED_MOTION" : "MOTION_ALLOWED");
        };
        if (mql && mql.addEventListener) {
          mql.addEventListener("change", onMotionChange);
        }

        return () => {
          document.removeEventListener("visibilitychange", onVisChange);
          if (mql && mql.removeEventListener) {
            mql.removeEventListener("change", onMotionChange);
          }
        };
      }, [send]);

      return (
        <span
          data-machine="heroRotator"
          data-state={rotator.value}
          data-index={index}
          data-tag={currentItem.tag}
          onMouseEnter={() => send("PAUSE")}
          onMouseLeave={() => send("RESUME")}
          onFocus={() => send("PAUSE")}
          onBlur={() => send("RESUME")}
          onClick={() => send("NEXT")}
          onKeyDown={(e) => {
            if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") {
              e.preventDefault();
              send("NEXT");
            } else if (e.key === "ArrowLeft") {
              e.preventDefault();
              send("PREV");
            }
          }}
          role="button"
          tabIndex={0}
          aria-live="polite"
          aria-label={`${currentItem.text} — ${currentItem.tag}. Click or use arrow keys to cycle.`}
          title={`${currentItem.tag} (Click or use arrow keys to cycle)`}
          className="inline-flex flex-wrap items-baseline gap-x-4 align-baseline cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-electric/40 rounded-lg"
        >
          <span className="relative inline-grid overflow-hidden align-bottom py-2 -my-2" style={{ clipPath: 'inset(0 0 -0.45em 0)' }}>
            <AnimatePresence mode="wait">
              <motion.span
                key={index}
                initial={{ y: "90%", opacity: 0, filter: "blur(4px)" }}
                animate={{ y: "0%", opacity: 1, filter: "blur(0px)" }}
                exit={{ y: "-90%", opacity: 0, filter: "blur(4px)" }}
                transition={{ duration: 0.45, ease: [0.22, 1, 0.36, 1] }}
                className="col-start-1 row-start-1 text-electric italic font-serif font-normal pr-2 pb-1"
              >
                {currentItem.text}
              </motion.span>
            </AnimatePresence>
          </span>
        </span>
      );
    };

    // --- HERO SECTION ---

        >
          {/* Subtle Ambient Radial Highlight */}
          <div

          <div className="max-w-[1360px] w-full mx-auto relative z-10 flex-1 flex flex-col justify-between">

            >
              <div className="flex items-center gap-3">
                <span className="px-2.5 py-0.5 rounded-full bg-electric/10 text-electric font-semibold uppercase tracking-wider">
                  AI Engineer
                </span>

                transition={{ duration: 0.75, ease: [0.22, 1, 0.36, 1] }}
                className="font-serif text-[2.85rem] sm:text-[4.25rem] md:text-[5.25rem] lg:text-[6.2rem] leading-[1.04] tracking-[-0.03em] text-dark max-w-5xl"
              >
                I build systems for <br className="hidden sm:inline" />
                <RotatingWords /> <br />

              <motion.div

                <div className="flex flex-wrap items-center gap-3.5 shrink-0">

    // --- ABOUT & EXPERTISE SECTION (Explicit Capability & Stack Inspector State Machine) ---
    const CAPABILITIES_MACHINE = {
      id: "capabilitiesInspector",
      initial: "idle",
      context: () => ({
        activeCardId: null,
        selectedTag: null
      }),
      on: {
        TOGGLE_TAG: (ctx, event) => {
          const nextTag = ctx.selectedTag === event.tag ? null : event.tag;
          return {
            target: nextTag ? "filteredByTag" : (ctx.activeCardId ? "inspecting" : "idle"),
            context: { ...ctx, selectedTag: nextTag }
          };
        },
        CLEAR_TAG: (ctx) => ({
          target: ctx.activeCardId ? "inspecting" : "idle",
          context: { ...ctx, selectedTag: null }
        })
      },
      states: {
        idle: {
          on: {
            INSPECT_CARD: (ctx, event) => ({
              target: "inspecting",
              context: { ...ctx, activeCardId: event.id }
            })

    // --- GITHUB TELEMETRY MODULE (Explicit Fetch + Inspect + Pin State Machine) ---
    const GITHUB_TELEMETRY_MACHINE = {
      id: "githubTelemetry",
      initial: "loading",
      context: () => ({
        data: null,
        hoveredDay: null,
        pinnedDay: null,
        error: null
      }),
      states: {
        loading: {
          on: {
            FETCH_SUCCESS: (ctx, event) => ({
              target: "ready",
              context: { ...ctx, data: event.data, error: null }
            }),
            FETCH_ERROR: (ctx, event) => ({
              target: "error",
              context: { ...ctx, error: event.error || "Failed to load activity" }
            })
          }
        },
        ready: {
          on: {
            INSPECT_DAY: (ctx, event) => ({
              target: "inspecting",
              context: { ...ctx, hoveredDay: event.day }
            }),
            TOGGLE_PIN_DAY: (ctx, event) => ({
              target: "pinned",
              context: { ...ctx, pinnedDay: event.day, hoveredDay: event.day }
            })
          }
        },
        inspecting: {
          on: {
            INSPECT_DAY: (ctx, event) => ({
              target: "inspecting",
              context: { ...ctx, hoveredDay: event.day }
            }),
            CLEAR_INSPECT: (ctx) => ({
              target: "ready",
              context: { ...ctx, hoveredDay: null }
            }),
            TOGGLE_PIN_DAY: (ctx, event) => ({
              target: "pinned",
              context: { ...ctx, pinnedDay: event.day, hoveredDay: event.day }
            }),
            ESCAPE: (ctx) => ({
              target: "ready",
              context: { ...ctx, hoveredDay: null }
            })
          }
        },
        pinned: {
          on: {
            INSPECT_DAY: (ctx, event) => ({
              target: "pinned",
              context: { ...ctx, hoveredDay: event.day }
            }),
            CLEAR_INSPECT: (ctx) => ({
              target: "pinned",
              context: { ...ctx, hoveredDay: null }
            }),
            TOGGLE_PIN_DAY: (ctx, event) => {
              if (ctx.pinnedDay && event.day && ctx.pinnedDay.date === event.day.date) {
                return {
                  target: "ready",
                  context: { ...ctx, pinnedDay: null, hoveredDay: null }
                };
              }
              return {
                target: "pinned",
                context: { ...ctx, pinnedDay: event.day, hoveredDay: event.day }
              };
            },
            UNPIN_DAY: (ctx) => ({
              target: "ready",
              context: { ...ctx, pinnedDay: null, hoveredDay: null }
            }),
            ESCAPE: (ctx) => ({
              target: "ready",
              context: { ...ctx, pinnedDay: null, hoveredDay: null }
            })
          }
        },
        error: {
          on: {
            RETRY: (ctx) => ({
              target: "loading",
              context: { ...ctx, error: null }
            })
          }
        }
      }
    };

    const GithubActivity = () => {
      const [telemetry, send] = useMachine(GITHUB_TELEMETRY_MACHINE);
      const { data, hoveredDay, pinnedDay } = telemetry.context;
      const activeDay = hoveredDay || pinnedDay;
      const isLoading = telemetry.value === "loading";
      const isError = telemetry.value === "error";
      const isPinned = telemetry.value === "pinned";
      const gridRef = useRef(null);

      useEffect(() => {
        if (telemetry.value !== "loading") return;
        let cancelled = false;
        const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timeoutId = setTimeout(() => {
          if (controller) controller.abort();
        }, 8000);

        fetch('https://github-contributions-api.jogruber.de/v4/JPacoch?y=last', controller ? { signal: controller.signal } : undefined)
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then(json => {
            if (cancelled) return;
            const rawList = Array.isArray(json.contributions) ? json.contributions : [];
            if (!rawList.length) throw new Error("Empty contribution dataset");

            const today = new Date().toISOString().split('T')[0];
            const sorted = rawList.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
            const filtered = sorted.filter(c => c.date <= today);
            const sourceDays = filtered.length > 0 ? filtered : sorted;
            const lastYear = sourceDays.slice(-364);

            const firstDay = new Date(lastYear[0].date);
            const firstDayOfWeek = firstDay.getDay();
            const offset = (firstDayOfWeek + 6) % 7;

            const contributions = [
              ...Array(offset).fill(null),
              ...lastYear
            ];

            send({
              type: "FETCH_SUCCESS",
              data: {
                total: (json.total && (json.total.lastYear || json.total[new Date().getFullYear()])) || 'Many',
                contributions
              }
            });
          })
          .catch(err => {
            if (cancelled) return;
            console.error('Error fetching github data:', err);
            send({ type: "FETCH_ERROR", error: err.message });
          })
          .finally(() => {
            clearTimeout(timeoutId);
          });

        return () => {
          cancelled = true;
          clearTimeout(timeoutId);
          if (controller) controller.abort();
        };
      }, [telemetry.value, send]);

      const weeks = useMemo(() => {
        if (!data) {
          return Array.from({ length: 52 }, () => Array.from({ length: 7 }, () => null));
        }
        const result = [];
        for (let i = 0; i < data.contributions.length; i += 7) {
          result.push(data.contributions.slice(i, i + 7));
        }
        return result;
      }, [data]);

      const levelColors = [
        '#F3F4F6',
        '#D1E0FF',
        '#80AAFF',
        '#3377FF',
        '#0055FF'
      ];

      const getCalculatedLevel = (count) => {
        if (count === 0) return 0;
        if (count <= 3) return 1;
        if (count <= 6) return 2;
        if (count <= 9) return 3;
        return 4;
      };

      const handleCellKeyDown = (e, day) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          send({ type: "TOGGLE_PIN_DAY", day });
          return;
        }
        if (e.key === "Escape") {
          e.preventDefault();
          send("ESCAPE");
          return;
        }
        if (!["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].includes(e.key) || !gridRef.current) return;
        e.preventDefault();
        const cells = Array.from(gridRef.current.querySelectorAll('[data-day-date]'));
        const currentIdx = cells.findIndex((el) => el.getAttribute("data-day-date") === day.date);
        if (currentIdx === -1) return;
        const delta = e.key === "ArrowRight" ? 7 : e.key === "ArrowLeft" ? -7 : e.key === "ArrowDown" ? 1 : -1;
        const nextCell = cells[currentIdx + delta];
        if (nextCell) nextCell.focus();
      };

      return (

                    <GithubIcon />
                  </div>
                  <div>
                    <div className="flex items-center gap-2.5">
                      <h3 className="font-serif text-2xl text-dark font-semibold">Code <em className="text-electric italic font-normal">Pulse</em></h3>
                      <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-electric/10 text-electric font-mono text-[11px] font-semibold">
                        <span className="w-1.5 h-1.5 rounded-full bg-electric animate-pulse"></span>
                        {isLoading ? "Syncing..." : isError ? "Offline" : `${data.total} commits (12m)`}
                      </span>
                    </div>
                    <p className="text-xs font-mono text-dark/50 mt-0.5" aria-live="polite">
                      {activeDay
                        ? `${activeDay.count} contribution${activeDay.count === 1 ? '' : 's'} on ${activeDay.date}${isPinned && pinnedDay && pinnedDay.date === activeDay.date ? ' (Pinned)' : ''}`

                        ? "Telemetry temporarily unavailable — view directly on GitHub"
                        : "Rolling 52-week open-source & engineering activity"}
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2 self-start md:self-auto">
                  {isPinned && (
                    <button
                      type="button"
                      onClick={() => send("UNPIN_DAY")}
                      className="px-3 py-1.5 rounded-full bg-electric/10 hover:bg-electric text-electric hover:text-white text-xs font-mono font-medium transition-colors"

                      Clear Pin

                      Retry
                    </button>

                  <a
                    href="https://github.com/JPacoch"
                    target="_blank"

                    <span>github.com/JPacoch</span>
                    <ArrowUpRight className="w-3.5 h-3.5" />
                  </a>
                </div>
              </div>

              <div className="overflow-x-auto pb-2 custom-scrollbar-minimal">
                <div
                  ref={gridRef}
                  role="grid"
                  aria-label="52-week GitHub contribution matrix"
                  className="flex gap-[3.5px] min-w-max"
                >
                  {weeks.map((week, i) => (
                    <div key={i} role="row" className="flex flex-col gap-[3.5px]">
                      {week.map((day, j) => {
                        if (isLoading || isError) {
                          return (
                            <div
                              key={`skeleton-${i}-${j}`}
                              role="gridcell"
                              aria-disabled="true"
                              className={`w-3.5 h-3.5 rounded-[3px] bg-offwhite ${isLoading ? "animate-pulse" : "opacity-50"}`}
                            />
                          );
                        }

                        if (!day) return <div key={`empty-${i}-${j}`} role="gridcell" aria-hidden="true" className="w-3.5 h-3.5" />;

                        const activeLevel = (day.level === 0 && day.count > 0)
                          ? getCalculatedLevel(day.count)
                          : day.level;
                        const isDayPinned = Boolean(pinnedDay && pinnedDay.date === day.date);

                        return (
                          <div
                            key={day.date}
                            data-day-date={day.date}
                            tabIndex={0}
                            role="gridcell"
                            aria-selected={isDayPinned}
                            aria-label={`${day.count} contributions on ${day.date}`}
                            onMouseEnter={() => send({ type: "INSPECT_DAY", day })}
                            onMouseLeave={() => send("CLEAR_INSPECT")}
                            onFocus={() => send({ type: "INSPECT_DAY", day })}
                            onBlur={() => send("CLEAR_INSPECT")}
                            onClick={() => send({ type: "TOGGLE_PIN_DAY", day })}
                            onKeyDown={(e) => handleCellKeyDown(e, day)}
                            className={`w-3.5 h-3.5 rounded-[3px] transition-transform duration-150 hover:scale-125 focus:scale-125 focus:outline-none focus:ring-1 focus:ring-electric cursor-pointer ${
                              isDayPinned ? "ring-2 ring-dark scale-125 z-10" : ""
                            }`}
                            style={{ backgroundColor: levelColors[activeLevel] }}
                            title={`${day.count} contributions on ${day.date}`}
                          />
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>

              <div className="mt-4 pt-4 border-t border-dark/5 flex flex-wrap items-center justify-between gap-4 text-[11px] font-mono text-dark/45">
                <span>Hover, focus, or click any cell to inspect daily commit telemetry</span>
                <div className="flex items-center gap-2">
                  <span>Less</span>
                  <div className="flex gap-1">
                    {levelColors.map(c => (

                    ))}
                  </div>
                  <span>More</span>
                </div>

    // --- SMOOTH SCROLL & VIEWPORT LIFECYCLE ENGINE MACHINE ---
    const SCROLL_ENGINE_MACHINE = {
      id: "scrollEngine",
      initial: () =>
        typeof window !== "undefined" &&
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "reducedMotion"
          : "initializing",
      context: () => ({
        direction: "down",
        lockReason: null,
        targetSection: null
      }),
      on: {
        LOCK: (ctx, event) => ({
          target: "locked",
          context: { ...ctx, lockReason: event.reason || "modal" }
        }),
        UNLOCK: (ctx) => ({
          target: "idle",
          context: { ...ctx, lockReason: null }
        }),
        VISIBILITY_HIDDEN: "suspended",
        VISIBILITY_VISIBLE: (ctx) => ({
          target: ctx.lockReason ? "locked" : "idle",
          context: ctx
        }),
        REDUCED_MOTION: "reducedMotion",
        MOTION_ALLOWED: "idle"
      },
      states: {
        initializing: {
          on: {
            READY: "idle"
          }
        },
        idle: {
          on: {
            SCROLL_ACTIVE: (ctx, event) => ({
              target: "scrolling",
              context: { ...ctx, direction: event.direction || ctx.direction }
            }),
            PROGRAMMATIC_START: (ctx, event) => ({
              target: "programmatic",
              context: { ...ctx, targetSection: event.target || null }
            })
          }
        },
        scrolling: {
          on: {
            SCROLL_ACTIVE: (ctx, event) => {
              const nextDir = event.direction || ctx.direction;
              if (nextDir === ctx.direction) return null;
              return { target: "scrolling", context: { ...ctx, direction: nextDir } };
            },
            SCROLL_IDLE: "idle",
            PROGRAMMATIC_START: (ctx, event) => ({
              target: "programmatic",
              context: { ...ctx, targetSection: event.target || null }
            })
          }
        },
        programmatic: {
          on: {
            PROGRAMMATIC_END: (ctx) => ({
              target: "idle",
              context: { ...ctx, targetSection: null }
            }),
            SCROLL_IDLE: (ctx) => ({
              target: "idle",
              context: { ...ctx, targetSection: null }
            })
          }
        },
        locked: {},
        suspended: {},
        reducedMotion: {}
      }
    };

    // --- FOOTER REVEAL CURTAIN MACHINE ---
    const FOOTER_CURTAIN_MACHINE = {
      id: "footerCurtain",
      initial: "hidden",
      context: () => ({ progress: 0, activeChannel: null }),
      on: {
        SCRUB_PROGRESS: (ctx, event, currentState) => {
          const p = Math.max(0, Math.min(1, Number(event.progress) || 0));
          const nextState = p <= 0.01 ? "hidden" : p >= 0.98 ? "revealed" : "revealing";
          if (nextState === currentState && Math.abs(ctx.progress - p) < 0.02) {
            return null;
          }
          return {
            target: nextState,
            context: { ...ctx, progress: Number(p.toFixed(3)) }
          };
        },
        REVEAL: (ctx) => ({
          target: "revealed",
          context: { ...ctx, progress: 1 }
        }),
        HIDE: (ctx) => ({
          target: "hidden",
          context: { ...ctx, progress: 0 }
        }),
        FOCUS_CHANNEL: (ctx, event) => ({
          context: { ...ctx, activeChannel: event.channel || null }
        }),
        BLUR_CHANNEL: (ctx) => ({
          context: { ...ctx, activeChannel: null }

      },
      states: {

    // --- DEV / AGENT STATE MACHINE TELEMETRY HUD (Toggle with Alt+M or ?debug=machines) ---
    const MACHINE_INSPECTOR_CONFIG = {

            TOGGLE: "closed",

    const MachineInspectorHUD = () => {
      const [inspector, send] = useMachine(MACHINE_INSPECTOR_CONFIG);
      const [, setTick] = useState(0);
      const isOpen = inspector.value === "open";
      const { selectedMachineId } = inspector.context;

      useEffect(() => {
        const onKeyDown = (e) => {
          if ((e.altKey && e.key.toLowerCase() === "m") || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "m")) {
            e.preventDefault();
            send("TOGGLE");
          } else if (e.key === "Escape" && isOpen) {
            send("ESCAPE");

        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [isOpen, send]);

      useEffect(() => {
        if (!isOpen) return;
        return MACHINE_REGISTRY.subscribe(() => {
          setTick((t) => t + 1);
        });
      }, [isOpen]);

      if (!isOpen) return null;

      const snapshots = MACHINE_REGISTRY.getAllSnapshots();
      const machineIds = Object.keys(snapshots).filter((id) => id !== "machineInspector");
      const activeSnap = snapshots[selectedMachineId] || snapshots[machineIds[0]];
      const recentHistory = MACHINE_REGISTRY.getHistory(8).slice().reverse();

      return (
        <aside
          data-machine="machineInspector"
          data-state={inspector.value}
          aria-label="State Machine Telemetry Inspector"
          className="fixed bottom-4 right-4 z-[9999] w-[380px] max-w-[calc(100vw-2rem)] bg-dark/95 backdrop-blur-xl text-white rounded-2xl border border-white/15 shadow-2xl p-4 font-mono text-xs"
        >
          <div className="flex items-center justify-between pb-3 mb-3 border-b border-white/10">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-electric animate-pulse" />
              <span className="font-semibold tracking-wider uppercase text-[11px]">FSM Telemetry HUD</span>
              <span className="text-[10px] text-white/40">({machineIds.length} active)</span>
            </div>
            <button
              type="button"
              onClick={() => send("CLOSE")}
              className="px-2 py-0.5 rounded bg-white/10 hover:bg-white/20 text-white/70 hover:text-white text-[10px]"
            >
              Esc / Alt+M
            </button>
          </div>

          <div className="flex flex-wrap gap-1 mb-3">
            {machineIds.map((id) => {
              const snap = snapshots[id];
              const isSelected = activeSnap && activeSnap.id === id;
              return (
                <button
                  key={id}
                  type="button"
                  onClick={() => send({ type: "SELECT_MACHINE", id })}
                  className={`px-2 py-1 rounded-md text-[10px] transition-colors flex items-center gap-1.5 ${
                    isSelected ? "bg-electric text-white" : "bg-white/5 hover:bg-white/10 text-white/70"
                  }`}
                >
                  <span>{id}</span>
                  <span className="px-1 rounded bg-black/30 text-[9px] text-white/90">{snap.state}</span>
                </button>
              );
            })}
          </div>

          {activeSnap && (
            <div className="space-y-2.5 bg-black/30 rounded-xl p-3 border border-white/10 mb-3">
              <div className="flex items-center justify-between">
                <span className="text-white/50">State:</span>
                <span className="px-2 py-0.5 rounded bg-electric/20 text-electric font-semibold">
                  {activeSnap.state}
                </span>
              </div>
              <div>
                <div className="text-white/50 mb-1">Available Events:</div>
                <div className="flex flex-wrap gap-1">
                  {activeSnap.availableEvents.map((evt) => (
                    <button
                      key={evt}
                      type="button"
                      onClick={() => MACHINE_REGISTRY.send(activeSnap.id, evt)}
                      className="px-1.5 py-0.5 rounded bg-white/10 hover:bg-electric text-white text-[10px] transition-colors"
                    >
                      {evt}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <div className="text-white/50 mb-1">Context:</div>
                <pre className="text-[10px] text-white/80 overflow-x-auto max-h-24 custom-scrollbar-minimal">
                  {JSON.stringify(activeSnap.context, null, 2)}
                </pre>
              </div>
            </div>
          )}

          <div>
            <div className="text-white/45 text-[10px] uppercase tracking-wider mb-1">Recent Transitions</div>
            <div className="space-y-1 max-h-24 overflow-y-auto custom-scrollbar-minimal">
              {recentHistory.length === 0 ? (
                <div className="text-white/35 text-[10px]">Interact with the page to log transitions</div>
              ) : (
                recentHistory.map((h) => (
                  <div key={h.seq} className="text-[10px] text-white/70 flex items-center justify-between gap-2">
                    <span className="truncate">
                      <strong className="text-white">{h.id}</strong>: {h.from} → <span className="text-electric">{h.to}</span>
                    </span>
                    <span className="text-white/40 shrink-0">{h.event}</span>
                  </div>
                ))
              )}
            </div>
          </div>
        </aside>
      );
    };

    const App = () => {
      const [scrollEngine, sendScrollEngine] = useMachine(SCROLL_ENGINE_MACHINE);
      const [curtainState, sendCurtain] = useMachine(FOOTER_CURTAIN_MACHINE);
      const isFooterHidden = curtainState.value === "hidden";

      useEffect(() => {
        const lenis = window.__LENIS__;
        if (!lenis) return;
        if (scrollEngine.value === "locked") {
          lenis.stop();
        } else if (scrollEngine.value !== "suspended") {
          lenis.start();
        }
      }, [scrollEngine.value]);

      useLayoutEffect(() => {
        const prefersReduced =
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const lenis = new Lenis({
          duration: prefersReduced ? 0 : 1.15,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
        });
        window.__LENIS__ = lenis;

        gsap.registerPlugin(ScrollTrigger);

        let scrollIdleTimer = null;
        lenis.on("scroll", ({ velocity, direction }) => {
          ScrollTrigger.update();
          const currentEngineState = MACHINE_REGISTRY.scrollEngine && MACHINE_REGISTRY.scrollEngine.state;
          if (currentEngineState === "programmatic" || currentEngineState === "locked") return;

          if (Math.abs(velocity) > 0.08) {
            sendScrollEngine({
              type: "SCROLL_ACTIVE",
              direction: direction >= 0 ? "down" : "up"
            });
            clearTimeout(scrollIdleTimer);
            scrollIdleTimer = setTimeout(() => {
              sendScrollEngine("SCROLL_IDLE");
            }, 160);
          }
        });

        let rafId = null;
        let isTabVisible = document.visibilityState !== "hidden";

        function raf(time) {
          if (isTabVisible) {
            lenis.raf(time);
            rafId = requestAnimationFrame(raf);
          } else {
            rafId = null;
          }
        }
        rafId = requestAnimationFrame(raf);

        const onVisChange = () => {
          isTabVisible = document.visibilityState !== "hidden";
          if (isTabVisible) {
            sendScrollEngine("VISIBILITY_VISIBLE");
            if (rafId === null) rafId = requestAnimationFrame(raf);
          } else {
            sendScrollEngine("VISIBILITY_HIDDEN");
            if (rafId !== null) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
          }
        };
        document.addEventListener("visibilitychange", onVisChange);

        const initScrollTrigger = () => {
          ScrollTrigger.create({
            trigger: "#footer-spacer",
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            onUpdate: (self) => {
              sendCurtain({ type: "SCRUB_PROGRESS", progress: self.progress });
            },
            animation: gsap.timeline()
              .to(["#footer-container", "#blue-bg"], { autoAlpha: 1, duration: 0.05, ease: "none" }, 0)
              .to("#main-content", {
                scale: 0.96,
                borderBottomLeftRadius: "48px",
                borderBottomRightRadius: "48px",
                ease: "none"
              }, 0)
              .fromTo("#footer-container-inner", { y: "15%" }, { y: "0%", ease: "none" }, 0)
          });
          sendScrollEngine("READY");
        };

        const initTimer = setTimeout(() => {
          initScrollTrigger();
          ScrollTrigger.refresh();
        }, 100);

        const resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
        resizeObserver.observe(document.body);

        return () => {
          clearTimeout(initTimer);
          clearTimeout(scrollIdleTimer);
          document.removeEventListener("visibilitychange", onVisChange);
          if (rafId !== null) cancelAnimationFrame(rafId);
          delete window.__LENIS__;
          lenis.destroy();
          ScrollTrigger.getAll().forEach(t => t.kill());
          resizeObserver.disconnect();
        };
      }, [sendCurtain, sendScrollEngine]);

      const handleFooterLinkFocus = (channel) => {
        sendCurtain({ type: "FOCUS_CHANNEL", channel });
        if (curtainState.value !== "revealed" && window.__LENIS__) {
          window.__LENIS__.scrollTo(document.body.scrollHeight);
        }
      };

      return (
        <div
          id="app-shell"
          data-machine="scrollEngine"
          data-state={scrollEngine.value}
          data-scroll-direction={scrollEngine.context.direction}
          className="bg-white min-h-screen font-sans text-dark selection:bg-electric selection:text-white"
        >
          <div id="blue-bg" className="fixed inset-0 bg-electric z-0 opacity-0 invisible pointer-events-none"></div>
          <Nav />

          <main
            id="main-content"
            className="bg-white w-full relative z-10 shadow-[0_20px_60px_rgba(0,0,0,0.1)] origin-[50%_100%] overflow-hidden"
            style={{ willChange: "transform, border-radius" }}
          >
            <Hero />
            <AboutAndCapabilities />
            <GithubActivity />
            <Projects />
            <Writing />
          </main>

          <div id="footer-spacer" className="min-h-[700px] h-[85vh] md:min-h-0 md:h-[70vh] w-full pointer-events-none"></div>

          <footer
            id="footer-container"
            data-machine="footerCurtain"
            data-state={curtainState.value}
            data-progress={curtainState.context.progress}
            data-active-channel={curtainState.context.activeChannel || undefined}
            aria-hidden={isFooterHidden}
            className="fixed bottom-0 left-0 w-full min-h-[700px] h-[85vh] md:min-h-0 md:h-[70vh] z-0 flex flex-col justify-end bg-electric text-white overflow-hidden opacity-0 invisible"
          >
            <div id="footer-container-inner" className="w-full h-full px-6 md:px-12 lg:px-24 py-16 flex flex-col justify-between">
              <div className="max-w-[1400px] w-full mx-auto flex flex-col h-full justify-between">
                <div className="pt-8">
                  <div id="contact" className="text-white/60 font-semibold uppercase tracking-widest text-sm mb-4">Contact</div>
                  <h2 className="font-serif text-5xl md:text-7xl leading-tight mb-8">
                    Let's do <br /> something <em className="italic font-light">together</em>
                  </h2>
                  <p className="text-xl text-white/80 mb-12">Want to say hello? Hit me up:</p>

                  <div className="flex flex-wrap gap-4">
                    <a
                      href="mailto:pacochp@gmail.com"
                      tabIndex={isFooterHidden ? -1 : 0}
                      onFocus={() => handleFooterLinkFocus("email")}
                      onBlur={() => sendCurtain("BLUR_CHANNEL")}
                      onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: "email" })}
                      onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <MailIcon /> Email
                    </a>
                    <a
                      href="https://www.linkedin.com/in/jakubpacocha/"
                      target="_blank"
                      rel="noopener noreferrer"
                      tabIndex={isFooterHidden ? -1 : 0}
                      onFocus={() => handleFooterLinkFocus("linkedin")}
                      onBlur={() => sendCurtain("BLUR_CHANNEL")}
                      onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: "linkedin" })}
                      onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <LinkedinIcon /> LinkedIn
                    </a>
                    <a
                      href="https://x.com/JakubPacocha"
                      target="_blank"
                      rel="noopener noreferrer"
                      tabIndex={isFooterHidden ? -1 : 0}
                      onFocus={() => handleFooterLinkFocus("twitter")}
                      onBlur={() => sendCurtain("BLUR_CHANNEL")}
                      onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: "twitter" })}
                      onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <TwitterIcon /> Twitter / X
                    </a>
                    <a
                      href="https://github.com/JPacoch"
                      target="_blank"
                      rel="noopener noreferrer"
                      tabIndex={isFooterHidden ? -1 : 0}
                      onFocus={() => handleFooterLinkFocus("github")}
                      onBlur={() => sendCurtain("BLUR_CHANNEL")}
                      onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: "github" })}
                      onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                      className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium"
                    >
                      <GithubIcon /> GitHub
                    </a>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row justify-between items-center pt-8 border-t border-white/10 text-white/50 text-sm mt-12">
                  <div>© 2026 <span className="font-semibold text-white">Jakub Pacocha</span> All rights reserved.</div>
                  <div>Bydgoszcz, Poland</div>
                </div>
              </div>
            </div>
          </footer>

          <MachineInspectorHUD />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
