<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jakub Pacocha — AI Engineer & Writer</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            electric: '#0055FF',
            dark: '#111827',
            offwhite: '#F9FAFB',
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #111827;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0055FF;
    }

    ::-webkit-scrollbar-thumb {
      background: #ffffff;
      border-radius: 4px;
    }

    /* Subtle architectural dot/grid background */
    .bg-Swiss-grid {
      background-size: 48px 48px;
      background-image: 
        linear-gradient(to right, rgba(17, 24, 39, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17, 24, 39, 0.035) 1px, transparent 1px);
    }

    .custom-scrollbar-minimal::-webkit-scrollbar {
      height: 4px;
    }
    .custom-scrollbar-minimal::-webkit-scrollbar-track {
      background: #F9FAFB;
    }
    .custom-scrollbar-minimal::-webkit-scrollbar-thumb {
      background: rgba(17, 24, 39, 0.15);
      border-radius: 9999px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    Babel.registerPreset('my-react', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
    });
  </script>
  <script type="text/babel" data-presets="my-react,env" data-type="module">
    const { useState, useEffect, useLayoutEffect, useRef, useMemo } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- ICONS ---
    const ArrowRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12h14" /><path d="m12 5 7 7-7 7" />
      </svg>
    );
    const ArrowUpRight = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M7 17L17 7" /><path d="M7 7h10v10" />
      </svg>
    );
    const DownloadIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" />
      </svg>
    );
    const MenuIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" />
      </svg>
    );
    const CloseIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );
    const MailIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
      </svg>
    );
    const LinkedinIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect width="4" height="12" x="2" y="9" /><circle cx="4" cy="4" r="2" />
      </svg>
    );
    const TwitterIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5 5.96 15.6 7 12c-1.2.3-2.4.2-3.6-.1C2.5 10.6 4 9 4 9c-1.1-.3-2-.9-2.5-1.9 1-.3 2.1-.3 3.1-.1C2.3 5 4 2 4 2c1.6 2 4 4 7.4 4.5 0-1.1.5-2.2 1.5-2.9 1.4-1.1 3.5-.8 4.6.5 1.1-.2 2.1-.7 3-1.2-.4 1.1-1.1 2-2 2.7 1-.1 1.9-.4 2.8-.8Z" />
      </svg>
    );
    const GithubIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" />
      </svg>
    );

    // Custom Technical SVG Icons for Capabilities
    const RagArchitectureSvg = () => (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2" />
        <polyline points="2 17 12 22 22 17" />
        <polyline points="2 12 12 17 22 12" />
      </svg>
    );
    const InfraSvg = () => (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <rect x="2" y="2" width="20" height="8" rx="2" ry="2" />
        <rect x="2" y="14" width="20" height="8" rx="2" ry="2" />
        <line x1="6" y1="6" x2="6.01" y2="6" />
        <line x1="6" y1="18" x2="6.01" y2="18" />
      </svg>
    );
    const CloudOpsSvg = () => (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
      </svg>
    );
    const SpatialSvg = () => (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
        <path d="M2 12h20" />
      </svg>
    );

    // --- LIVE LOCAL TIME HOOK ---
    const useBydgoszczTime = () => {
      const [time, setTime] = useState("");
      useEffect(() => {
        const update = () => {
          try {
            const fmt = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Europe/Warsaw',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false
            });
            setTime(fmt.format(new Date()) + " CET");
          } catch (e) {
            setTime("53°07'N 18°00'E");
          }
        };
        update();
        const id = setInterval(update, 1000);
        return () => clearInterval(id);
      }, []);
      return time;
    };

    // --- SECTION HEADER COMPONENT ---
    const SectionHeader = ({ index, label, title, italicTitle, subtitle, rightElement }) => (
      <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-8 pb-12 mb-14 border-b border-dark/10">
        <div>
          <div className="flex items-center gap-3 mb-4">
            <span className="font-mono text-xs font-semibold text-electric bg-electric/8 px-2.5 py-1 rounded-md border border-electric/15">
              {index}
            </span>
            <span className="font-mono text-xs uppercase tracking-[0.2em] text-dark/50 font-medium">
              {label}
            </span>
          </div>
          <h2 className="font-serif text-4xl sm:text-5xl md:text-6xl text-dark leading-[1.08] tracking-[-0.02em]">
            {title} {italicTitle && <em className="text-electric italic font-normal">{italicTitle}</em>}
          </h2>
        </div>
        {rightElement ? (
          <div className="shrink-0">{rightElement}</div>
        ) : subtitle ? (
          <p className="text-base md:text-lg text-dark/60 max-w-md leading-relaxed font-normal">
            {subtitle}
          </p>
        ) : null}
      </div>
    );

    // --- FLOATING NAVIGATION BAR ---
    const Nav = () => {
      const [isOpen, setIsOpen] = useState(false);
      const [activeSection, setActiveSection] = useState("hero");
      const [scrolled, setScrolled] = useState(false);

      const links = [
        { id: "about", name: "About", href: "#about" },
        { id: "projects", name: "Projects", href: "#projects" },
        { id: "writing", name: "Writing", href: "#writing" },
      ];

      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 30);
          const sections = ["writing", "projects", "about", "hero"];
          const scrollPos = window.scrollY + 240;
          for (const secId of sections) {
            const el = document.getElementById(secId);
            if (el && scrollPos >= el.offsetTop) {
              setActiveSection(secId);
              break;
            }
          }
        };
        window.addEventListener("scroll", handleScroll, { passive: true });
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      return (
        <>
          <header className="fixed top-5 left-0 right-0 z-[100] px-4 sm:px-8 pointer-events-none flex justify-center">
            <nav
              className={`pointer-events-auto transition-all duration-500 rounded-full flex items-center justify-between px-3 py-2 border ${
                scrolled
                  ? "bg-white/85 backdrop-blur-xl border-dark/10 shadow-[0_12px_40px_rgba(17,24,39,0.08)]"
                  : "bg-white/70 backdrop-blur-md border-dark/8 shadow-[0_4px_20px_rgba(17,24,39,0.03)]"
              } w-full max-w-[780px]`}
            >
              <a
                href="#hero"
                className="flex items-center gap-2.5 pl-3 pr-4 py-1 rounded-full hover:bg-offwhite transition-colors group"
              >
                <span className="h-2.5 w-2.5 rounded-full bg-electric shrink-0"></span>
                <span className="font-bold tracking-tight text-dark text-sm">Jakub Pacocha</span>
              </a>

              <div className="hidden md:flex items-center gap-1 bg-offwhite/80 p-1 rounded-full border border-dark/5">
                {links.map((l) => {
                  const isActive = activeSection === l.id;
                  return (
                    <a
                      key={l.id}
                      href={l.href}
                      className={`relative px-4 py-1.5 text-xs font-medium rounded-full transition-colors duration-200 ${
                        isActive ? "text-white" : "text-dark/65 hover:text-dark"
                      }`}
                    >
                      {isActive && (
                        <motion.span
                          layoutId="navIndicator"
                          transition={{ type: "spring", stiffness: 380, damping: 30 }}
                          className="absolute inset-0 bg-electric rounded-full -z-10 shadow-[0_2px_10px_rgba(0,85,255,0.3)]"
                        />
                      )}
                      {l.name}
                    </a>
                  );
                })}
              </div>

              <div className="hidden md:flex items-center gap-2 pr-1">
                <a
                  href="cv.html"
                  className="px-4 py-1.5 rounded-full text-xs font-semibold text-dark/80 hover:text-electric hover:bg-electric/5 border border-dark/10 hover:border-electric/30 transition-all flex items-center gap-1.5"
                >
                  <span>Full CV</span>
                  <ArrowUpRight className="w-3.5 h-3.5" />
                </a>
              </div>

              <button
                onClick={() => setIsOpen(!isOpen)}
                aria-label="Toggle Menu"
                className="md:hidden p-2 rounded-full bg-offwhite border border-dark/10 text-dark hover:border-electric hover:text-electric transition-colors"
              >
                {isOpen ? <CloseIcon /> : <MenuIcon />}
              </button>
            </nav>
          </header>

          <AnimatePresence>
            {isOpen && (
              <motion.div
                initial={{ opacity: 0, y: -12 }}
                animate={{ opacity: 1, y: 0 }}
                exit={{ opacity: 0, y: -12 }}
                transition={{ duration: 0.25 }}
                className="fixed inset-x-4 top-20 z-[95] bg-white/95 backdrop-blur-2xl rounded-3xl border border-dark/10 shadow-2xl p-6 flex flex-col gap-3 md:hidden"
              >
                {links.map((l, i) => (
                  <motion.a
                    key={l.name}
                    href={l.href}
                    onClick={() => setIsOpen(false)}
                    initial={{ opacity: 0, x: -10 }}
                    animate={{ opacity: 1, x: 0 }}
                    transition={{ delay: i * 0.05 }}
                    className="px-4 py-3 rounded-2xl text-lg font-medium text-dark hover:bg-electric hover:text-white transition-colors flex items-center justify-between"
                  >
                    <span>{l.name}</span>
                    <ArrowRight className="w-4 h-4 opacity-60" />
                  </motion.a>
                ))}
                <div className="h-[1px] bg-dark/10 my-1" />
                <div className="flex gap-3">
                  <a
                    href="cv.html"
                    className="flex-1 py-3 px-4 rounded-2xl bg-electric text-white font-semibold text-sm flex items-center justify-center gap-2"
                  >
                    <span>Open Full CV</span>
                    <ArrowUpRight className="w-4 h-4" />
                  </a>
                  <a
                    href="assets/resume.pdf"
                    download
                    className="py-3 px-4 rounded-2xl bg-offwhite border border-dark/10 text-dark font-semibold text-sm flex items-center justify-center gap-2"
                  >
                    <DownloadIcon className="w-4 h-4" />
                    <span>PDF</span>
                  </a>
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </>
      );
    };

    // --- ROTATING WORDS IN HERO ---
    const RotatingWords = () => {
      const items = [
        { text: "HERE Technologies", tag: "Spatial & AI Engineering" },
        { text: "the digital world", tag: "Full-Stack ML Systems" },
        { text: "local NGOs", tag: "Civic Tech & Urban Impact" },
        { text: "mind & soul", tag: "Philosophy & Essays" }
      ];
      const [index, setIndex] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => {
          if (document.visibilityState === "visible") {
            setIndex((prev) => (prev + 1) % items.length);
          }
        }, 2800);
        return () => clearInterval(interval);
      }, []);

      return (
        <span className="inline-flex flex-wrap items-baseline gap-x-4 align-baseline">
          <span className="relative inline-grid overflow-hidden align-bottom py-2 -my-2" style={{ clipPath: 'inset(0 0 -0.45em 0)' }}>
            <AnimatePresence mode="wait">
              <motion.span
                key={index}
                initial={{ y: "90%", opacity: 0, filter: "blur(4px)" }}
                animate={{ y: "0%", opacity: 1, filter: "blur(0px)" }}
                exit={{ y: "-90%", opacity: 0, filter: "blur(4px)" }}
                transition={{ duration: 0.45, ease: [0.22, 1, 0.36, 1] }}
                className="col-start-1 row-start-1 text-electric italic font-serif font-normal pr-2 pb-1"
              >
                {items[index].text}
              </motion.span>
            </AnimatePresence>
          </span>
        </span>
      );
    };

    // --- HERO SECTION ---
    const Hero = () => {
      const localTime = useBydgoszczTime();

      const stats = [
        { id: "01", value: "6+", label: "Years in Data & Software", detail: "Production systems & pipelines" },
        { id: "02", value: "4+", label: "Years Building AI / ML", detail: "RAG, LLMOps & Computer Vision" },
        { id: "03", value: "8.5k+", label: "Words Published", detail: "Phenomenology, theology & society" },
        { id: "04", value: "🇵🇱 PL", label: "Bydgoszcz, Poland", detail: "Civic tech & NGO contributor" }
      ];

      return (
        <section
          id="hero"
          className="relative min-h-screen flex flex-col justify-between pt-28 pb-16 px-6 md:px-12 lg:px-20 bg-Swiss-grid border-b border-dark/10 overflow-hidden"
        >
          {/* Subtle Ambient Radial Highlight */}
          <div
            className="pointer-events-none absolute -top-40 right-0 w-[650px] h-[650px] rounded-full opacity-40 blur-3xl"
            style={{ background: "radial-gradient(circle, rgba(0,85,255,0.12) 0%, rgba(255,255,255,0) 70%)" }}
          />

          <div className="max-w-[1360px] w-full mx-auto relative z-10 flex-1 flex flex-col justify-between">
            {/* Top Telemetry Bar */}
            <motion.div
              initial={{ opacity: 0, y: 12 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.6 }}
              className="flex flex-wrap items-center justify-between gap-4 py-4 border-b border-dark/10 text-xs font-mono text-dark/55"
            >
              <div className="flex items-center gap-3">
                <span className="px-2.5 py-0.5 rounded-full bg-electric/10 text-electric font-semibold uppercase tracking-wider">
                  AI Engineer
                </span>
                <span className="hidden sm:inline text-dark/25">/</span>
                <span className="hidden sm:inline">RAG Architectures • Scalable ML • Spatial Systems</span>
              </div>
              <div className="flex items-center gap-4">
                <span className="hidden md:inline text-dark/40">53°07′N 18°00′E</span>
                <span className="px-2.5 py-0.5 rounded-md bg-offwhite border border-dark/10 text-dark/70">
                  {localTime}
                </span>
              </div>
            </motion.div>

            {/* Main Editorial Headline */}
            <div className="my-auto py-14 md:py-20">
              <motion.h1
                initial={{ opacity: 0, y: 24 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.75, ease: [0.22, 1, 0.36, 1] }}
                className="font-serif text-[2.85rem] sm:text-[4.25rem] md:text-[5.25rem] lg:text-[6.2rem] leading-[1.04] tracking-[-0.03em] text-dark max-w-5xl"
              >
                I architect systems for <br className="hidden sm:inline" />
                <RotatingWords /> <br />
                &amp; write about them.
              </motion.h1>

              <motion.div
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.75, delay: 0.15, ease: [0.22, 1, 0.36, 1] }}
                className="mt-10 md:mt-14 flex flex-col lg:flex-row lg:items-end justify-between gap-8"
              >
                <p className="font-sans text-lg md:text-xl text-dark/65 max-w-2xl leading-relaxed font-normal">
                  Full-stack AI engineer specializing in production <strong className="text-dark font-medium">RAG architectures</strong>,{" "}
                  <strong className="text-dark font-medium">containerized ML infrastructure</strong>, and{" "}
                  <strong className="text-dark font-medium">spatial intelligence</strong>. Outside the terminal, I write philosophical essays on phenomenology, theology, and society.
                </p>

                <div className="flex flex-wrap items-center gap-3.5 shrink-0">
                  <a
                    href="#projects"
                    className="group px-6 py-3.5 rounded-full bg-electric text-white font-medium text-sm flex items-center gap-2.5 shadow-[0_8px_25px_rgba(0,85,255,0.28)] hover:shadow-[0_12px_32px_rgba(0,85,255,0.4)] hover:-translate-y-0.5 transition-all duration-300"
                  >
                    <span>Explore Side Projects</span>
                    <ArrowRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                  </a>
                  <a
                    href="#writing"
                    className="px-6 py-3.5 rounded-full bg-white hover:bg-offwhite text-dark border border-dark/15 hover:border-dark/30 font-medium text-sm transition-all duration-300"
                  >
                    Read my Blog
                  </a>
                  <a
                    href="assets/resume.pdf"
                    download
                    className="px-5 py-3.5 rounded-full bg-offwhite hover:bg-electric/10 text-dark/75 hover:text-electric border border-dark/10 hover:border-electric/25 font-mono text-xs font-medium flex items-center gap-2 transition-all duration-300"
                  >
                    <DownloadIcon className="w-3.5 h-3.5" />
                    <span>CV.pdf</span>
                  </a>
                </div>
              </motion.div>
            </div>

            {/* Bottom Architectural Metrics Grid */}
            <motion.div
              initial={{ opacity: 0, y: 20 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.7, delay: 0.25 }}
              className="grid grid-cols-2 lg:grid-cols-4 bg-white/90 backdrop-blur-md border border-dark/10 rounded-2xl overflow-hidden shadow-[0_4px_24px_rgba(17,24,39,0.03)]"
            >
              {stats.map((s, idx) => (
                <div
                  key={s.id}
                  className={`p-5 md:p-6 flex flex-col justify-between transition-colors hover:bg-offwhite/80 ${
                    idx !== stats.length - 1 ? "border-b lg:border-b-0 border-r border-dark/10" : ""
                  }`}
                >
                  <div className="flex items-center justify-between mb-3">
                    <span className="font-mono text-[11px] text-dark/35">{s.id}</span>
                    <span className="w-1.5 h-1.5 rounded-full bg-electric/60"></span>
                  </div>

    // --- GITHUB TELEMETRY MODULE ---
    const GithubActivity = () => {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [hoveredDay, setHoveredDay] = useState(null);

      useEffect(() => {
        fetch('https://github-contributions-api.jogruber.de/v4/JPacoch?y=last')
          .then(res => res.json())
          .then(json => {
            const today = new Date().toISOString().split('T')[0];
            const sorted = json.contributions.sort((a, b) => new Date(a.date) - new Date(b.date));
            const filtered = sorted.filter(c => c.date <= today);
            const lastYear = filtered.slice(-364);

            const firstDay = new Date(lastYear[0].date);
            const firstDayOfWeek = firstDay.getDay();
            const offset = (firstDayOfWeek + 6) % 7;

            const contributions = [
              ...Array(offset).fill(null),
              ...lastYear
            ];

            setData({
              total: json.total.lastYear || json.total[new Date().getFullYear()] || 'Many',
              contributions: contributions
            });
            setLoading(false);
          })
          .catch(err => {
            console.error('Error fetching github data:', err);
            setLoading(false);
          });
      }, []);

      if (loading || !data) return null;

      const weeks = [];
      for (let i = 0; i < data.contributions.length; i += 7) {
        weeks.push(data.contributions.slice(i, i + 7));
      }

      const levelColors = [
        '#F3F4F6',
        '#D1E0FF',
        '#80AAFF',
        '#3377FF',
        '#0055FF'
      ];

      const getCalculatedLevel = (count) => {
        if (count === 0) return 0;
        if (count <= 3) return 1;
        if (count <= 6) return 2;
        if (count <= 9) return 3;
        return 4;
      };

      return (
        <section id="github" className="px-6 md:px-12 lg:px-20 py-16 bg-offwhite border-b border-dark/10">
          <div className="max-w-[1360px] mx-auto">
            <div className="bg-white rounded-3xl border border-dark/10 p-6 sm:p-8 md:p-10 shadow-[0_4px_20px_rgba(17,24,39,0.02)]">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 mb-6 border-b border-dark/10">
                <div className="flex items-center gap-4">
                  <div className="w-10 h-10 rounded-xl bg-electric/10 text-electric flex items-center justify-center">
                    <GithubIcon />
                  </div>
                  <div>
                    <div className="flex items-center gap-2.5">
                      <h3 className="font-serif text-2xl text-dark font-semibold">Code <em className="text-electric italic font-normal">Pulse</em></h3>
                      <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-electric/10 text-electric font-mono text-[11px] font-semibold">
                        <span className="w-1.5 h-1.5 rounded-full bg-electric animate-pulse"></span>
                        {data.total} commits (12m)
                      </span>
                    </div>
                    <p className="text-xs font-mono text-dark/50 mt-0.5">
                      {hoveredDay
                        ? `${hoveredDay.count} contribution${hoveredDay.count === 1 ? '' : 's'} on ${hoveredDay.date}`
                        : "Rolling 52-week open-source & engineering activity"}
                    </p>
                  </div>
                </div>

                <a
                  href="https://github.com/JPacoch"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="self-start md:self-auto px-4 py-2 rounded-full bg-offwhite hover:bg-electric hover:text-white border border-dark/10 hover:border-electric text-xs font-mono font-medium text-dark transition-all flex items-center gap-2"
                >
                  <span>github.com/JPacoch</span>
                  <ArrowUpRight className="w-3.5 h-3.5" />
                </a>
              </div>

              <div className="overflow-x-auto pb-2 custom-scrollbar-minimal">
                <div className="flex gap-[3.5px] min-w-max">
                  {weeks.map((week, i) => (
                    <div key={i} className="flex flex-col gap-[3.5px]">
                      {week.map((day, j) => {
                        if (!day) return <div key={`empty-${i}-${j}`} className="w-3.5 h-3.5" />;

                        const activeLevel = (day.level === 0 && day.count > 0)
                          ? getCalculatedLevel(day.count)
                          : day.level;

                        return (
                          <div
                            key={day.date}
                            onMouseEnter={() => setHoveredDay(day)}
                            onMouseLeave={() => setHoveredDay(null)}
                            className="w-3.5 h-3.5 rounded-[3px] transition-transform duration-150 hover:scale-125 cursor-pointer"
                            style={{ backgroundColor: levelColors[activeLevel] }}
                            title={`${day.count} contributions on ${day.date}`}
                          />
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>

              <div className="mt-4 pt-4 border-t border-dark/5 flex flex-wrap items-center justify-between gap-4 text-[11px] font-mono text-dark/45">
                <span>Hover any cell to inspect daily commit telemetry</span>
                <div className="flex items-center gap-2">
                  <span>Less</span>
                  <div className="flex gap-1">
                    {levelColors.map(c => (

                    ))}
                  </div>
                  <span>More</span>
                </div>

                    key={essay.id}
                    href={essay.link}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="group p-6 md:p-7 hover:bg-offwhite/70 transition-all duration-300 flex flex-col sm:flex-row sm:items-center justify-between gap-4 relative"
                  >
                    <div className="absolute left-0 top-0 bottom-0 w-1 bg-electric scale-y-0 group-hover:scale-y-100 transition-transform origin-center duration-300" />
                    <div className="space-y-2 max-w-xl pl-1">
                      <div className="flex items-center gap-3 text-xs font-mono">
                        <span className="text-electric font-semibold">{essay.id}</span>
                        <span className="uppercase tracking-wider text-dark/50 font-medium">{essay.category}</span>
                        <span className="text-dark/25">•</span>
                        <span className="text-dark/45">{essay.date}</span>
                      </div>
                      <h4 className="font-serif text-2xl text-dark font-semibold group-hover:text-electric transition-colors">
                        {essay.title}
                      </h4>
                      <p className="text-sm text-dark/60 line-clamp-2 leading-relaxed">
                        {essay.desc}
                      </p>
                    </div>

                    <div className="flex sm:flex-col items-center sm:items-end justify-between shrink-0 gap-3">
                      <span className="font-mono text-[11px] px-2.5 py-1 rounded-md bg-offwhite border border-dark/8 text-dark/60">
                        {essay.read}
                      </span>
                      <div className="w-9 h-9 rounded-full border border-dark/10 group-hover:bg-electric group-hover:border-electric group-hover:text-white text-dark/50 flex items-center justify-center transition-all">
                        <ArrowUpRight className="w-4 h-4" />
                      </div>
                    </div>
                  </a>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    };

    // --- MAIN APP WITH PRESERVED FOOTER REVEAL ---
    const App = () => {
      useLayoutEffect(() => {
        const lenis = new Lenis({
          duration: 1.15,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
        });
        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        gsap.registerPlugin(ScrollTrigger);

        const initScrollTrigger = () => {
          ScrollTrigger.create({
            trigger: "#footer-spacer",
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            animation: gsap.timeline()
              .to(["#footer-container", "#blue-bg"], { autoAlpha: 1, duration: 0.05, ease: "none" }, 0)
              .to("#main-content", {
                scale: 0.96,
                borderBottomLeftRadius: "48px",
                borderBottomRightRadius: "48px",
                ease: "none"
              }, 0)
              .fromTo("#footer-container-inner", { y: "15%" }, { y: "0%", ease: "none" }, 0)
          });
        };

        setTimeout(() => {
          initScrollTrigger();
          ScrollTrigger.refresh();
        }, 100);

        const resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
        resizeObserver.observe(document.body);

        return () => {
          lenis.destroy();
          ScrollTrigger.getAll().forEach(t => t.kill());
          resizeObserver.disconnect();
        };
      }, []);

      return (
        <div className="bg-white min-h-screen font-sans text-dark selection:bg-electric selection:text-white">
          <div id="blue-bg" className="fixed inset-0 bg-electric z-0 opacity-0 invisible pointer-events-none"></div>
          <Nav />

          <main
            id="main-content"
            className="bg-white w-full relative z-10 shadow-[0_20px_60px_rgba(0,0,0,0.1)] origin-[50%_100%] overflow-hidden"
            style={{ willChange: "transform, border-radius" }}
          >
            <Hero />
            <AboutAndCapabilities />
            <GithubActivity />
            <Projects />
            <Writing />
          </main>

          <div id="footer-spacer" className="min-h-[700px] h-[85vh] md:min-h-0 md:h-[70vh] w-full pointer-events-none"></div>

          <footer
            id="footer-container"
            className="fixed bottom-0 left-0 w-full min-h-[700px] h-[85vh] md:min-h-0 md:h-[70vh] z-0 flex flex-col justify-end bg-electric text-white overflow-hidden opacity-0 invisible"
          >
            <div id="footer-container-inner" className="w-full h-full px-6 md:px-12 lg:px-24 py-16 flex flex-col justify-between">
              <div className="max-w-[1400px] w-full mx-auto flex flex-col h-full justify-between">
                <div className="pt-8">
                  <div id="contact" className="text-white/60 font-semibold uppercase tracking-widest text-sm mb-4">Contact</div>
                  <h2 className="font-serif text-5xl md:text-7xl leading-tight mb-8">
                    Let's do <br /> something <em className="italic font-light">together</em>
                  </h2>
                  <p className="text-xl text-white/80 mb-12">Want to say hello? Hit me up:</p>

                  <div className="flex flex-wrap gap-4">
                    <a href="mailto:pacochp@gmail.com" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <MailIcon /> Email
                    </a>
                    <a href="https://www.linkedin.com/in/jakubpacocha/" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <LinkedinIcon /> LinkedIn
                    </a>
                    <a href="https://x.com/JakubPacocha" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <TwitterIcon /> Twitter / X
                    </a>
                    <a href="https://github.com/JPacoch" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <GithubIcon /> GitHub
                    </a>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row justify-between items-center pt-8 border-t border-white/10 text-white/50 text-sm mt-12">
                  <div>© 2026 <span className="font-semibold text-white">Jakub Pacocha</span> All rights reserved.</div>
                  <div>Bydgoszcz, Poland</div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
