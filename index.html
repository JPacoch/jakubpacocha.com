<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    const { useState, useEffect, useLayoutEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- ICONS ---

    const MenuIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg>;
    const CloseIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const MailIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>;
    const LinkedinIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect width="4" height="12" x="2" y="9" /><circle cx="4" cy="4" r="2" /></svg>;
    const TwitterIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5 5.96 15.6 7 12c-1.2.3-2.4.2-3.6-.1C2.5 10.6 4 9 4 9c-1.1-.3-2-.9-2.5-1.9 1-.3 2.1-.3 3.1-.1C2.3 5 4 2 4 2c1.6 2 4 4 7.4 4.5 0-1.1.5-2.2 1.5-2.9 1.4-1.1 3.5-.8 4.6.5 1.1-.2 2.1-.7 3-1.2-.4 1.1-1.1 2-2 2.7 1-.1 1.9-.4 2.8-.8Z" /></svg>;
    const GithubIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" /></svg>;

                  <motion.a
                    key={l.name} href={l.href} onClick={() => setIsOpen(false)}

                    className="text-3xl md:text-4xl font-sans font-medium tracking-tight text-dark hover:text-electric transition-colors flex items-center gap-3"
                  >
                    {l.name}
                  </motion.a>
                ))}
              </motion.div>
            )}
          </AnimatePresence>
        </>
      );
    };

    const RotatingWords = () => {
      const words = ["digital world", "iQor", "local NGOs", "mind & soul"];
      const [index, setIndex] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => setIndex(prev => (prev + 1) % words.length), 2500);
        return () => clearInterval(interval);
      }, []);

      return (
        <span className="inline-grid align-bottom h-[1.1em]" style={{ clipPath: 'inset(0 0 -0.5em 0)' }}>
          <AnimatePresence>
            <motion.span
              key={index}
              initial={{ y: "100%", opacity: 0 }}
              animate={{ y: "0%", opacity: 1 }}
              exit={{ y: "-100%", opacity: 0 }}
              transition={{ duration: 0.6, ease: [0.34, 1.56, 0.64, 1] }}
              className="col-start-1 row-start-1 text-electric italic pr-4 font-light whitespace-nowrap"
            >
              {words[index]}
            </motion.span>
          </AnimatePresence>
        </span>
      );
    };

    const Hero = () => (
      <section className="min-h-screen flex flex-col justify-center px-6 md:px-12 lg:px-24 pt-32 pb-20 max-w-[1400px] mx-auto relative border-b border-dark/5">
        <div className="max-w-5xl relative z-10">
          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8 }} className="flex items-center gap-4 mb-12">
            <div className="w-12 h-[1px] bg-dark/20"></div>
            <span className="text-sm font-semibold tracking-widest uppercase text-dark/50">Jakub Pacocha</span>
          </motion.div>

          <motion.h1
            initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, ease: [0.34, 1.56, 0.64, 1] }}
            className="font-serif text-[3.5rem] sm:text-[4.5rem] md:text-[5.5rem] lg:text-[6.5rem] leading-[1.05] tracking-[-0.03em] text-dark mb-10"
          >
            I build things <br /> for <RotatingWords /> <br /> & write about them.
          </motion.h1>

          <div className="flex flex-col md:flex-row gap-8 md:items-end justify-between mt-16">
            <motion.p
              initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, delay: 0.2, ease: [0.34, 1.56, 0.64, 1] }}
              className="font-sans text-xl md:text-2xl text-dark/60 max-w-xl leading-relaxed font-light"
            >
              Full-stack AI engineer and hobbyist writer specializing in RAG architectures and scalable ML infrastructure. Based in Bydgoszcz, Poland.
            </motion.p>
            <motion.div
              initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, delay: 0.4, ease: [0.34, 1.56, 0.64, 1] }}
              className="flex items-center gap-4"
            >
              <a href="#about" className="w-16 h-16 rounded-full border border-dark/20 flex items-center justify-center hover:bg-electric hover:border-electric hover:text-white transition-colors duration-300">

            </motion.div>
          </div>
        </div>

        <div className="max-w-[1200px] mx-auto">
          <div className="mb-20">
            <div className="text-electric font-semibold uppercase tracking-widest text-sm mb-4">About Me</div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-12 gap-12 items-start">
            <div className="md:col-span-8">
              <h2 className="font-serif text-4xl md:text-5xl lg:text-6xl text-dark leading-[1.2] mb-12">
                Scaling solutions, <em className="text-electric italic font-light">grounding ideas.</em>
              </h2>
              <div className="text-xl md:text-2xl text-dark/60 leading-relaxed font-sans max-w-2xl space-y-8 font-light">

                <p><strong className="text-dark font-medium">Every data tells a story</strong>. I build the digital layers that make sense of that data. As a Full-Stack AI Engineer, I don't just build and use models; I build the infrastructure - dockerized, hosted, and ready for production.</p>
                <p>Beyond the IDE, <strong className="text-dark font-medium">I’m deeply invested in my local community</strong>. Whether it’s collaborating with NGOs or navigating municipal structures to improve urban life, I believe technology should serve the public good.</p>

                <div className="text-sm font-semibold tracking-widest uppercase text-dark/50">Years of Experience</div>
              </div>
              <div>
                <div className="text-6xl font-serif text-dark mb-2">4+</div>
                <div className="text-sm font-semibold tracking-widest uppercase text-dark/50">Years with AI</div>
              </div>
              <div>
                <div className="text-6xl font-serif text-dark mb-2">6.5k</div>
                <div className="text-sm font-semibold tracking-widest uppercase text-dark/50">Words Published</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    );

    const Skills = () => {
      const skillsData = [
        { icon: "🖥️", title: "Generative AI & RAG", desc: "Utilizing LLMs and ML techniques for data analysis, serving AI-based apps and services.", tags: ["Python", "Vector stores", "Prompt Engineering"] },
        { icon: "⚙️", title: "Full-Stack AI Infra", desc: "Productization of AI and ML workflows via containerization and cloud orchestration.", tags: ["Docker", "FastAPI", "Flask"] },
        { icon: "☁️", title: "Cloud & DevOps", desc: "Deploying and maintaining infrastructure, containerization & monitoring on cloud.", tags: ["AWS", "Azure", "GitHub Actions"] },
        { icon: "🗺️", title: "Spatial & Civic Tech", desc: "Leveraging GIS and Computer Vision backgrounds for municipal and social impact.", tags: ["GIS", "Computer Vision", "Spatial Data"] }

      return (
        <section id="skills" className="px-6 md:px-12 lg:px-24 py-32 bg-offwhite relative">

          </div>
          <div className="flex items-center gap-6 font-medium text-dark/50 group-hover:text-white/70 transition-colors duration-300">
            <span>{essay.date}</span>
            <span>•</span>
            <span>{essay.read}</span>
            <div className="w-12 h-12 rounded-full border border-dark/20 group-hover:border-white/0 group-hover:bg-white group-hover:text-electric flex items-center justify-center transition-all duration-300">
              <ArrowUpRight />
            </div>
          </div>

    const Projects = () => {
      const projectsData = [
        {
          title: "WideAwake",
          desc: "A Windows utility that prevents sleep and keeps your status 'Green' using Kernel pings.",
          url: "https://wideawake.jakubpacocha.com/",
          tags: ["C#", "Utility"],
          colors: {
            bg: "#000080",
            text: "#00FF00",
            accent: "#FF00FF"
          }
        },
        {
          title: "From the Cabinet",
          desc: "A philosophical blog exploring ideas, theology and sociology.",
          url: "https://fromthecabinet.com/",
          tags: ["Writing", "Blog"],
          colors: { bg: "#f7f1e6", text: "#14110d", accent: "#b4512c" }
        },
        {
          title: "Cabinet Quotes",
          desc: "A dark-mode application for daily quotes and contemplation.",
          url: "https://quotes.fromthecabinet.com/",
          tags: ["Web App", "React"],
          colors: { bg: "#0e0d0b", text: "#ede8e0", accent: "#d66940" }
        },
        {
          title: "Gallery",
          desc: "A minimalist digital exhibition of my personal photography.",
          url: "https://gallery.jakubpacocha.com/",
          tags: ["Photography", "Portfolio"],
          colors: { bg: "#FDFDFD", text: "#0A0A0A", accent: "#6B6B6B" }
        },
        {
          title: "Ostrzółka",
          desc: "An NGO database project preserving the history of Bydgoszcz.",
          url: "https://ostrzolka.vercel.app/",
          tags: ["Database", "NGO"],
          colors: { bg: "#f3efe6", text: "#151515", accent: "#c85d52" }
        }
      ];

      return (
        <section id="projects" className="px-6 md:px-12 lg:px-24 py-32 bg-white relative">
          <div className="max-w-[1400px] mx-auto relative z-10">
            <div className="mb-16">
              <div className="text-electric font-semibold uppercase tracking-widest text-sm mb-4">My works</div>
              <h2 className="font-serif text-5xl md:text-7xl text-dark leading-tight">
                Selected <em className="text-electric italic font-light">projects</em>
              </h2>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                  target="_blank"
                  rel="noopener noreferrer"
                  className="flex flex-col p-8 md:p-12 border border-dark/10 hover:border-transparent rounded-2xl group transition-all duration-500 relative overflow-hidden min-h-[320px]"
                  style={{
                    '--hover-bg': proj.colors.bg,
                    '--hover-text': proj.colors.text,
                    '--hover-accent': proj.colors.accent,
                    fontFamily: proj.title === 'WideAwake' ? '"Comic Sans MS", "Comic Sans", cursive' : 'inherit'
                  }}
                >
                  <div
                    className="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 -z-10"
                    style={{ backgroundColor: 'var(--hover-bg)' }}
                  ></div>

                  <div className="flex justify-between items-start mb-12">
                    <h3
                      className={`text-3xl md:text-4xl transition-colors duration-500 group-hover:[color:var(--hover-text)] text-dark 
  ${proj.title === 'WideAwake'
                          ? 'font-sans group-hover:font-["Comic_Sans_MS",_cursive]'
                          : 'font-serif'}`}
                    >
                      {proj.title}
                    </h3>
                    <ArrowUpRight className="transition-colors duration-500 group-hover:[color:var(--hover-accent)] text-dark/30 w-6 h-6" />
                  </div>

                  <p className={`text-lg md:text-xl transition-colors duration-500 group-hover:[color:var(--hover-text)] text-dark/60 max-w-md mb-12 group-hover:opacity-80 
  ${proj.title === 'WideAwake' ? 'font-sans group-hover:font-["Comic_Sans_MS",_cursive]' : 'font-sans'}`}>
                    {proj.desc}
                  </p>

                  <div className="mt-auto flex flex-wrap gap-2">
                    {proj.tags.map(tag => (
                      <span
                        key={tag}
                        className="px-4 py-1.5 border border-dark/10 rounded-full text-xs font-semibold uppercase tracking-wider transition-all duration-500 group-hover:border-transparent group-hover:[background-color:var(--hover-accent)] group-hover:[color:var(--hover-bg)] text-dark/60"
                      >
                        {tag}
                      </span>
                    ))}
                  </div>
                </a>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const Writing = () => {
      const essays = [
        { title: "The Phenomenology and Certainty", category: "Epistemology", desc: "Science produces precise but constrained abstractions of experience, while metaphysics investigates the conditions that make experience possible; both contribute to understanding, but only within a cycle that returns them to the Life-World.", date: "Apr 2026", read: "5 min read", link: "https://fromthecabinet.com/texts/phenomenology-certainty.html" },
        { title: "The Wall and Nausea", category: "Existentialism", desc: "Being truly conscious means existing in a painful superposition between a social system and the honest, dull silence of the 'In-Itself' and reality.", date: "Apr 2026", read: "3 min read", link: "https://fromthecabinet.com/text.html?slug=the-wall-and-nausea" },
        { title: "The Sartrean Trap", category: "Metaphysics", desc: "When the method becomes a prison - on how Sartre misused phenomenology. 'And if phenomenology refuses to step outside of itself, then isn't it becoming the very thing it was meant to battle?'", date: "Feb 2026", read: "10 min read", link: "https://fromthecabinet.com/text.html?slug=sartrean-trap" },
        { title: "Christocentric Determinism", category: "Theology", desc: "On bridging the theological tension between arminianism and calvinism. Creating a doctrine that might be both true to the gospel and intellectually satisfying.", date: "Jan 2026", read: "9 min read", link: "https://fromthecabinet.com/text.html?slug=christocentric-determinism" }
      ];

      return (
        <section id="writing" className="px-6 md:px-12 lg:px-24 pt-32 pb-32 bg-white">
          <div className="max-w-[1400px] mx-auto">
            <div className="mb-16">
              <div className="text-electric font-semibold uppercase tracking-widest text-sm mb-4">Writing</div>
              <h2 className="font-serif text-5xl md:text-7xl text-dark leading-tight">Recent <em className="text-electric italic font-light">essays</em></h2>
            </div>
            <div className="flex flex-col border-t border-dark/10">
              {essays.map((essay, i) => <WritingEntry key={i} essay={essay} />)}
            </div>
          </div>
        </section>
      );
    };

    const PageTransition = ({ isExiting }) => (
      <>
        <motion.div
          initial={{ y: "0%" }}
          animate={{ y: "-100%" }}
          transition={{ duration: 0.8, ease: [0.87, 0, 0.13, 1], delay: 0.2 }}
          className="fixed inset-0 bg-electric z-[200] flex items-center justify-center pointer-events-none"
        >
          <span className="text-white font-sans text-3xl md:text-5xl font-medium tracking-tight">Loading...</span>
        </motion.div>
        <motion.div
          initial={{ y: "100%" }}
          animate={isExiting ? { y: "0%" } : { y: "100%" }}
          transition={{ duration: 0.8, ease: [0.87, 0, 0.13, 1] }}
          className="fixed inset-0 bg-electric z-[200] flex items-center justify-center pointer-events-none"
        >
          <span className="text-white font-sans text-3xl md:text-5xl font-medium tracking-tight">Loading...</span>
        </motion.div>
      </>
    );

    const App = () => {
      const [isExiting, setIsExiting] = useState(false);

      useEffect(() => {
        const handleClick = (e) => {
          const target = e.target.closest('a');
          if (target && target.href && !target.hasAttribute('download') && target.getAttribute('target') !== '_blank') {
            const url = new URL(target.href);
            if (url.origin === window.location.origin && url.pathname !== window.location.pathname) {
              e.preventDefault();
              setIsExiting(true);
              setTimeout(() => {
                window.location.href = target.href;
              }, 800);
            }
          }
        };
        document.addEventListener('click', handleClick);
        return () => document.removeEventListener('click', handleClick);
      }, []);

      useLayoutEffect(() => {
        const lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        gsap.registerPlugin(ScrollTrigger);

        const initScrollTrigger = () => {
          ScrollTrigger.create({
            trigger: "#footer-spacer",
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            animation: gsap.timeline()
              .to("#main-content", {
                scale: 0.96,
                borderBottomLeftRadius: "48px",
                borderBottomRightRadius: "48px",
                ease: "none"
              })
              .fromTo("#footer-container-inner", { y: "15%" }, { y: "0%", ease: "none" }, 0)
          });
        };

        // Initialize after a tiny delay to ensure layout is computed
        setTimeout(() => {
          initScrollTrigger();
          ScrollTrigger.refresh();
        }, 100);

        const resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
        resizeObserver.observe(document.body);

        return () => {
          lenis.destroy();
          ScrollTrigger.getAll().forEach(t => t.kill());
          resizeObserver.disconnect();
        };
      }, []);

      return (
        <div className="bg-electric min-h-screen font-sans text-dark selection:bg-electric selection:text-white">
          <PageTransition isExiting={isExiting} />
          <Nav isCV={false} />

          <main id="main-content" className="bg-white w-full relative z-10 shadow-[0_20px_60px_rgba(0,0,0,0.1)] origin-[50%_100%] overflow-hidden" style={{ willChange: "transform, border-radius" }}>
            <Hero />
            <About />
            <Skills />
            <Projects />
            <Writing />
          </main>

          <div id="footer-spacer" className="h-[75vh] md:h-[70vh] w-full pointer-events-none"></div>

          <footer id="footer-container" className="fixed bottom-0 left-0 w-full h-[75vh] md:h-[70vh] z-0 flex flex-col justify-end bg-electric text-white overflow-hidden">
            <div id="footer-container-inner" className="w-full h-full px-6 md:px-12 lg:px-24 py-16 flex flex-col justify-between">
              <div className="max-w-[1400px] w-full mx-auto flex flex-col h-full justify-between">
                <div className="pt-8">
                  <div id="contact" className="text-white/60 font-semibold uppercase tracking-widest text-sm mb-4">Contact</div>
                  <h2 className="font-serif text-5xl md:text-7xl leading-tight mb-8">Let's do <br /> something <em className="italic font-light">together</em></h2>
                  <p className="text-xl text-white/80 mb-12">Want to say hello? Hit me up:</p>

                  <div className="flex flex-wrap gap-4">
                    <a href="mailto:pacochp@gmail.com" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <MailIcon /> Email
                    </a>
                    <a href="https://www.linkedin.com/in/jakubpacocha/" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <LinkedinIcon /> LinkedIn
                    </a>
                    <a href="https://x.com/JakubPacocha" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <TwitterIcon /> Twitter / X
                    </a>
                    <a href="https://github.com/JPacoch" className="px-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-3 transition-colors font-medium">
                      <GithubIcon /> GitHub
                    </a>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row justify-between items-center pt-8 border-t border-white/10 text-white/50 text-sm mt-12">
                  <div>© 2026 <span className="font-semibold text-white">Jakub Pacocha</span> All rights reserved.</div>
                  <div>Bydgoszcz, Poland</div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
