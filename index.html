  <style>
    :root {
      /* Light Mode Palette — Verified WCAG AA */
      --color-canvas: #fcfcfc;
      --color-surface: #f4f4f5;
      --color-surface-hover: #ececef;
      --color-ink: #111113;
      --color-ink-secondary: #4a4a52;
      --color-ink-muted: #63636d;
      --color-hairline: rgba(17, 17, 19, 0.08);
      --color-underline: rgba(17, 17, 19, 0.24);
      --color-underline-hover: #111113;

      --color-badge-bg: #fce7f3;
      --color-badge-text: #9d174d;

      /* Emerging Curtain Footer */
      --color-footer-bg: #0a0a0c;
      --color-footer-ink: #fafafa;
      --color-footer-secondary: #d4d4d8;
      --color-footer-muted: #a1a1aa;

      /* Contribution Scale (Light) */
      --contrib-0: #e7e7ea;
      --contrib-1: #bbf7d0;
      --contrib-2: #4ade80;
      --contrib-3: #16a34a;
      --contrib-4: #15803d;

      /* Paper Thumbnail & Icon Tile Shadows (better-ui) */
      --shadow-tile:
        0px 0px 0px 1px oklch(0 0 0 / 0.06),
        0px 1px 2px 0px oklch(0 0 0 / 0.04);
      --shadow-paper:
        0px 0px 0px 1px oklch(0 0 0 / 0.08),
        0px 2px 5px -1px oklch(0 0 0 / 0.06);
      --shadow-main-curtain: 0px 24px 64px rgba(10, 10, 12, 0.22);
      --main-edge-ring: transparent;
    }

    html[data-theme="dark"] {
      /* Dark Mode Palette — Verified WCAG AA */
      --color-canvas: #0c0c0e;
      --color-surface: #16161a;
      --color-surface-hover: #1e1e24;
      --color-ink: #fafafa;
      --color-ink-secondary: #b4b4be;
      --color-ink-muted: #9494a0;
      --color-hairline: rgba(250, 250, 250, 0.09);
      --color-underline: rgba(250, 250, 250, 0.28);
      --color-underline-hover: #fafafa;

      --color-badge-bg: #3b1226;
      --color-badge-text: #f9a8d4;

      /* Emerging Curtain Footer (Elevated Charcoal in Dark Mode) */
      --color-footer-bg: #141418;
      --color-footer-ink: #fafafa;
      --color-footer-secondary: #d4d4d8;
      --color-footer-muted: #a1a1aa;

      /* Contribution Scale (Dark) */
      --contrib-0: #222228;
      --contrib-1: #14532d;
      --contrib-2: #166534;
      --contrib-3: #16a34a;
      --contrib-4: #22c55e;

      --shadow-tile: 0px 0px 0px 1px oklch(1 0 0 / 0.09);
      --shadow-paper: 0px 0px 0px 1px oklch(1 0 0 / 0.11);
      --shadow-main-curtain: 0px 24px 64px rgba(0, 0, 0, 0.6);
      --main-edge-ring: rgba(255, 255, 255, 0.08);
    }

    html {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      scroll-padding-block-start: 2rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-size-adjust: 100%;
    }

    @media (prefers-reduced-motion: no-preference) {
      html {
        scroll-behavior: smooth;
      }
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-canvas);
      color: var(--color-ink);
      overflow-x: clip;
    }

    .text-balance {
      text-wrap: balance;
    }

    .text-pretty {
      text-wrap: pretty;
    }

    /* Crisp inline editorial links */
    .inline-link {
      color: var(--color-ink);
      font-weight: 500;
      text-decoration: underline;
      text-underline-position: from-font;
      text-decoration-thickness: from-font;
      text-decoration-color: var(--color-underline);
      transition-property: color, text-decoration-color;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    .muted-link {
      color: var(--color-ink-muted);
      text-decoration: underline;
      text-underline-position: from-font;
      text-decoration-thickness: from-font;
      text-decoration-color: var(--color-underline);
      transition-property: color, text-decoration-color;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    /* Accessible focus rings */
    :where(a, button, [tabindex]):focus-visible {
      outline: 2px solid var(--color-ink);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .focus-ring-light:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    /* Tactile press feedback: exact scale(0.96) over 150ms ease-out */
    .tap-press {
      -webkit-tap-highlight-color: transparent;
      transition-property: transform, background-color, color, opacity, border-color;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    .tap-press:not(:disabled):active {
      transform: scale(0.96);
    }

    .icon-tile {
      background-color: var(--color-surface);
      border: 1px solid transparent;
      box-shadow: var(--shadow-tile);
      transition-property: transform, background-color, box-shadow;
      transition-duration: 180ms;
      transition-timing-function: ease-out;
    }

    .paper-thumb {
      background-color: var(--color-canvas);
      border: 1px solid transparent;
      box-shadow: var(--shadow-paper);
      transition-property: transform, box-shadow;
      transition-duration: 200ms;
      transition-timing-function: ease-out;
    }

    .main-curtain-surface {
      background-color: var(--color-canvas);
      box-shadow: 0 0 0 1px var(--main-edge-ring), var(--shadow-main-curtain);
    }

    /* Hover effects strictly gated behind hover-capable pointers (better-ui) */
    @media (hover: hover) {
      .inline-link:hover,
      .muted-link:hover {
        color: var(--color-ink);
        text-decoration-color: var(--color-underline-hover);
      }

      /* Rauno/Linear-style sibling dimming on list hover */
      .focus-list:hover .focus-list-item:not(:hover) {
        opacity: 0.45;
      }

      .focus-list-item:hover {
        background-color: var(--color-surface);
      }

      .focus-list-item:hover .row-arrow {
        opacity: 1;
        transform: translate(2px, -2px);
      }

      .focus-list-item:hover .icon-tile {
        transform: scale(1.04);
      }

      .focus-list-item:hover .paper-thumb {
        transform: translateY(-2px) rotate(-3deg);
      }

      .hover-surface:hover {
        background-color: var(--color-surface);
        color: var(--color-ink);
      }

      .hover-ink:hover {
        color: var(--color-ink);
      }

      .hover-light-pill:hover {
        background-color: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.28);
      }

      .contrib-pill:hover {
        transform: scaleY(1.18);
      }
    }

    .safe-top {
      padding-block-start: max(3.5rem, calc(env(safe-area-inset-top) + 2.5rem));
    }

    .safe-bottom {
      padding-block-end: max(2rem, env(safe-area-inset-bottom));
    }

  <script>
    Babel.registerPreset('my-react', {

  <script type="text/babel" data-presets="my-react,env" data-type="module">
    const {
      useState,
      useEffect,
      useLayoutEffect,
      useRef,
      useMemo,
      useReducer,
      useCallback
    } = React;

    const MotionLib = window.Motion || {};
    const motion = MotionLib.motion;
    const AnimatePresence = MotionLib.AnimatePresence;
    const MotionConfig = MotionLib.MotionConfig || (({ children }) => children);
    const useFramerReducedMotion = MotionLib.useReducedMotion;

    function useReducedMotionSafe() {
      const framerPref = typeof useFramerReducedMotion === "function" ? useFramerReducedMotion() : null;
      const [mediaPref, setMediaPref] = useState(() =>
        typeof window !== "undefined" &&
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
      );

      useEffect(() => {
        if (!window.matchMedia) return;
        const mql = window.matchMedia("(prefers-reduced-motion: reduce)");
        const onChange = (e) => setMediaPref(e.matches);
        if (mql.addEventListener) mql.addEventListener("change", onChange);
        return () => {
          if (mql.removeEventListener) mql.removeEventListener("change", onChange);
        };
      }, []);

      return Boolean(framerPref ?? mediaPref);
    }

    // --- THEME SWITCH WITH TRANSITION SUPPRESSION (better-ui exact recipe) ---
    function applyThemeWithoutSmear(nextTheme) {
      const style = document.createElement("style");
      style.append(document.createTextNode("*,*::before,*::after{transition:none !important}"));
      document.head.appendChild(style);

      if (nextTheme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }

      try {
        localStorage.setItem("jp-theme", nextTheme);
      } catch (e) {}

      void document.body.offsetHeight; // synchronous style flush

      requestAnimationFrame(() => {
        requestAnimationFrame(() => style.remove());
      });
    }

    // --- EXPLICIT FINITE STATE MACHINE ENGINE & TELEMETRY REGISTRY ---
    const MACHINE_REGISTRY = window.__APP_MACHINES__ || {};
    const GLOBAL_HISTORY = [];
    const GLOBAL_SUBSCRIBERS = new Set();
    let GLOBAL_SEQ = 0;

    function notifyGlobalSubscribers(record) {
      GLOBAL_SUBSCRIBERS.forEach((fn) => {
        try {
          fn(record);
        } catch (err) {
          console.error("[FSM Registry] Subscriber error:", err);
        }
      });
    }

    Object.defineProperties(MACHINE_REGISTRY, {
      __history__: { value: GLOBAL_HISTORY, enumerable: false, configurable: true },
      getAllSnapshots: {
        value: () => {
          const out = {};
          Object.keys(MACHINE_REGISTRY).forEach((k) => {
            if (MACHINE_REGISTRY[k] && typeof MACHINE_REGISTRY[k].getSnapshot === "function") {
              out[k] = MACHINE_REGISTRY[k].getSnapshot();
            }
          });
          return out;
        },
        enumerable: false,
        configurable: true
      },
      getHistory: {
        value: (limit = 30) => GLOBAL_HISTORY.slice(-limit),
        enumerable: false,
        configurable: true
      },
      send: {
        value: (machineId, event) => {
          const target = MACHINE_REGISTRY[machineId];
          if (!target || typeof target.send !== "function") return false;
          target.send(event);
          return true;
        },
        enumerable: false,
        configurable: true
      },
      resetAll: {
        value: () => {
          Object.keys(MACHINE_REGISTRY).forEach((k) => {
            if (MACHINE_REGISTRY[k] && typeof MACHINE_REGISTRY[k].reset === "function") {
              MACHINE_REGISTRY[k].reset();
            }
          });
        },
        enumerable: false,
        configurable: true
      },
      subscribe: {
        value: (listener) => {
          if (typeof listener !== "function") return () => {};
          GLOBAL_SUBSCRIBERS.add(listener);
          return () => GLOBAL_SUBSCRIBERS.delete(listener);
        },
        enumerable: false,
        configurable: true
      },
      inspect: {
        value: () => {
          if (MACHINE_REGISTRY.machineInspector) {
            MACHINE_REGISTRY.machineInspector.send("TOGGLE");
          }
          return MACHINE_REGISTRY.getAllSnapshots();
        },
        enumerable: false,
        configurable: true
      }
    });

    window.__APP_MACHINES__ = MACHINE_REGISTRY;

    function getAvailableEvents(config, stateValue) {
      const stateNode = config.states && config.states[stateValue];
      const stateEvents = stateNode && stateNode.on ? Object.keys(stateNode.on) : [];
      const rootEvents = config.on ? Object.keys(config.on) : [];
      return Array.from(new Set([...stateEvents, ...rootEvents]));
    }

    function evaluateMachineTransition(config, current, event) {
      const eventObj = typeof event === "string" ? { type: event } : (event || { type: "NOOP" });

      if (eventObj.type === "@@RESET") {
        const initialValue = typeof config.initial === "function" ? config.initial() : config.initial;
        const initialContext = typeof config.context === "function" ? config.context() : (config.context || {});
        return { value: initialValue, context: initialContext, changed: true, event: eventObj };
      }

      const stateNode = config.states && config.states[current.value];
      const handler =
        (stateNode && stateNode.on && stateNode.on[eventObj.type]) ||
        (config.on && config.on[eventObj.type]);

      if (!handler) {
        return { value: current.value, context: current.context, changed: false, event: eventObj };
      }

      let nextValue = current.value;
      let nextContext = current.context;

      if (typeof handler === "string") {
        nextValue = handler;
      } else if (typeof handler === "function") {
        const next = handler(current.context, eventObj, current.value);
        if (!next) {
          return { value: current.value, context: current.context, changed: false, event: eventObj };
        }
        nextValue = next.target || current.value;
        nextContext = next.context !== undefined ? next.context : current.context;
      } else if (typeof handler === "object") {
        nextValue = handler.target || current.value;
        nextContext = handler.reduce ? handler.reduce(current.context, eventObj, current.value) : current.context;
      }

      const changed = nextValue !== current.value || nextContext !== current.context;
      return { value: nextValue, context: nextContext, changed, event: eventObj };
    }

    function useMachine(config) {
      const initialRef = useRef(null);
      if (!initialRef.current) {
        initialRef.current = {
          value: typeof config.initial === "function" ? config.initial() : config.initial,
          context: typeof config.context === "function" ? config.context() : (config.context || {})
        };
      }

      const stateRef = useRef(initialRef.current);
      const historyRef = useRef([]);
      const listenersRef = useRef(new Set());
      const [, forceRender] = useReducer((x) => x + 1, 0);

      const send = useCallback((event) => {
        const prev = stateRef.current;
        const result = evaluateMachineTransition(config, prev, event);
        if (!result.changed) return stateRef.current;

        const nextState = { value: result.value, context: result.context };
        stateRef.current = nextState;

        const record = {
          seq: ++GLOBAL_SEQ,
          id: config.id || "anonymous",
          timestamp: new Date().toISOString(),
          event: result.event.type,
          from: prev.value,
          to: nextState.value
        };

        historyRef.current = [...historyRef.current.slice(-24), record];
        if (
          config.id !== "machineInspector" &&
          result.event.type !== "SCROLL_UPDATE" &&
          result.event.type !== "SCRUB_PROGRESS" &&
          result.event.type !== "TICK"
        ) {
          GLOBAL_HISTORY.push(record);
          if (GLOBAL_HISTORY.length > 60) GLOBAL_HISTORY.shift();
        }

        forceRender();

        listenersRef.current.forEach((fn) => {
          try {
            fn(nextState, record);
          } catch (e) {
            console.error(e);
          }
        });
        notifyGlobalSubscribers(record);

        return nextState;
      }, [config]);

      const actor = useMemo(() => {
        const controller = {
          id: config.id,
          states: Object.keys(config.states || {}),
          send,
          reset: () => send({ type: "@@RESET" }),
          can: (eventType) => getAvailableEvents(config, stateRef.current.value).includes(eventType),
          getSnapshot: () => ({
            id: config.id,
            state: stateRef.current.value,
            context: stateRef.current.context,
            states: Object.keys(config.states || {}),
            availableEvents: getAvailableEvents(config, stateRef.current.value)
          }),
          subscribe: (fn) => {
            if (typeof fn !== "function") return () => {};
            listenersRef.current.add(fn);
            return () => listenersRef.current.delete(fn);
          }
        };

        Object.defineProperties(controller, {
          state: { get: () => stateRef.current.value, enumerable: true },
          context: { get: () => stateRef.current.context, enumerable: true },
          availableEvents: { get: () => getAvailableEvents(config, stateRef.current.value), enumerable: true },
          history: { get: () => historyRef.current.slice(), enumerable: true }
        });

        return controller;
      }, [config, send]);

      if (config.id && !MACHINE_REGISTRY[config.id]) {
        MACHINE_REGISTRY[config.id] = actor;
      }

      useEffect(() => {
        if (!config.id) return;
        MACHINE_REGISTRY[config.id] = actor;
        return () => {
          if (MACHINE_REGISTRY[config.id] === actor) {
            delete MACHINE_REGISTRY[config.id];
          }
        };
      }, [config.id, actor]);

      return [stateRef.current, send, actor];
    }

    // --- ICONS (Unified 24px grid, currentColor, non-scaling stroke) ---
    const ArrowUpRightIcon = ({ className = "w-3.5 h-3.5", strokeWidth = 1.75 }) => (

    const LinkedinIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <path vectorEffect="non-scaling-stroke" d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />

    const computeBydgoszczTimeSnapshot = () => {
      try {
        const now = new Date();

          timeZone: 'Europe/Warsaw',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const tzParts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Europe/Warsaw',
          timeZoneName: 'short'
        }).formatToParts(now);
        const tzName = tzParts.find((p) => p.type === 'timeZoneName')?.value || 'CET';
        return { formatted: timeFmt.format(now), timezone: tzName, ok: true };
      } catch (e) {
        return { formatted: "Bydgoszcz", timezone: "CET", ok: false };
      }
    };

    const TELEMETRY_CLOCK_MACHINE = {
      id: "telemetryClock",
      initial: () => {
        const snap = computeBydgoszczTimeSnapshot();
        if (!snap.ok) return "fallback";
        if (typeof document !== "undefined" && document.visibilityState === "hidden") return "suspended";
        return "ticking";
      },
      context: () => {
        const snap = computeBydgoszczTimeSnapshot();
        return { formatted: snap.formatted, timezone: snap.timezone };
      },
      on: {
        FREEZE: (ctx, event) => ({ target: "frozen", context: { ...ctx, formatted: event.formatted || ctx.formatted } }),
        UNFREEZE: (ctx) => {
          const snap = computeBydgoszczTimeSnapshot();
          return { target: snap.ok ? "ticking" : "fallback", context: { ...ctx, formatted: snap.formatted, timezone: snap.timezone } };
        }
      },
      states: {
        ticking: {
          on: {
            TICK: (ctx) => {
              const snap = computeBydgoszczTimeSnapshot();
              if (!snap.ok) return { target: "fallback", context: { ...ctx, formatted: snap.formatted } };
              if (snap.formatted === ctx.formatted) return null;
              return { target: "ticking", context: { ...ctx, formatted: snap.formatted, timezone: snap.timezone } };
            },
            VISIBILITY_HIDDEN: "suspended"
          }
        },
        suspended: {
          on: {
            VISIBILITY_VISIBLE: (ctx) => {
              const snap = computeBydgoszczTimeSnapshot();
              return { target: snap.ok ? "ticking" : "fallback", context: { ...ctx, formatted: snap.formatted, timezone: snap.timezone } };
            }
          }
        },
        frozen: {},
        fallback: {}
      }
    };

        const id = setInterval(() => send("TICK"), 1000);
        return () => clearInterval(id);
      }, [clockState.value, send]);

      useEffect(() => {
        const onVisChange = () => {
          send(document.visibilityState === "visible" ? "VISIBILITY_VISIBLE" : "VISIBILITY_HIDDEN");
        };
        document.addEventListener("visibilitychange", onVisChange);
        return () => document.removeEventListener("visibilitychange", onVisChange);
      }, [send]);

      return clockState;
    };

    const GITHUB_TELEMETRY_MACHINE = {

          }
        },
        ready: {

            TOGGLE_PIN_DAY: (ctx, event) => ({ target: "pinned", context: { ...ctx, pinnedDay: event.day, hoveredDay: event.day } })

        inspecting: {
          on: {
            INSPECT_DAY: (ctx, event) => ({ target: "inspecting", context: { ...ctx, hoveredDay: event.day } }),

            TOGGLE_PIN_DAY: (ctx, event) => ({ target: "pinned", context: { ...ctx, pinnedDay: event.day, hoveredDay: event.day } }),
            ESCAPE: (ctx) => ({ target: "ready", context: { ...ctx, hoveredDay: null } })
          }
        },
        pinned: {
          on: {
            INSPECT_DAY: (ctx, event) => ({ target: "pinned", context: { ...ctx, hoveredDay: event.day } }),
            CLEAR_INSPECT: (ctx) => ({ target: "pinned", context: { ...ctx, hoveredDay: null } }),
            TOGGLE_PIN_DAY: (ctx, event) => {
              if (ctx.pinnedDay && event.day && ctx.pinnedDay.date === event.day.date) {
                return { target: "ready", context: { ...ctx, pinnedDay: null, hoveredDay: null } };
              }
              return { target: "pinned", context: { ...ctx, pinnedDay: event.day, hoveredDay: event.day } };
            },
            UNPIN_DAY: (ctx) => ({ target: "ready", context: { ...ctx, pinnedDay: null, hoveredDay: null } }),
            ESCAPE: (ctx) => ({ target: "ready", context: { ...ctx, pinnedDay: null, hoveredDay: null } })
          }

    const ActivityStrip = ({ enterItem }) => {
      const [telemetry, send] = useMachine(GITHUB_TELEMETRY_MACHINE);
      const reduce = useReducedMotionSafe();
      const { data, hoveredDay, pinnedDay } = telemetry.context;
      const activeDay = hoveredDay || pinnedDay;
      const isLoading = telemetry.value === "loading";
      const isError = telemetry.value === "error";
      const isPinned = telemetry.value === "pinned";
      const barRefs = useRef([]);
      const [rovingIdx, setRovingIdx] = useState(29);

      useEffect(() => {
        if (telemetry.value !== "loading") return;
        let cancelled = false;
        const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timeoutId = setTimeout(() => {
          if (controller) controller.abort();
        }, 8000);

        fetch('https://github-contributions-api.jogruber.de/v4/JPacoch?y=last', controller ? { signal: controller.signal } : undefined)
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then((json) => {
            if (cancelled) return;
            const rawList = Array.isArray(json.contributions) ? json.contributions : [];
            if (!rawList.length) throw new Error("Empty dataset");

            const today = new Date().toISOString().split('T')[0];
            const sorted = rawList.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
            const filtered = sorted.filter((c) => c.date <= today);
            const sourceDays = filtered.length > 0 ? filtered : sorted;
            const last30 = sourceDays.slice(-30);
            const last30Total = last30.reduce((sum, d) => sum + (Number(d.count) || 0), 0);
            const yearTotal =
              (json.total && (json.total.lastYear || json.total[new Date().getFullYear()])) ||
              sourceDays.reduce((sum, d) => sum + (Number(d.count) || 0), 0);

            send({
              type: "FETCH_SUCCESS",
              data: { last30, last30Total, yearTotal }
            });
          })
          .catch((err) => {
            if (cancelled) return;
            send({ type: "FETCH_ERROR", error: err.message });
          })
          .finally(() => clearTimeout(timeoutId));

        return () => {
          cancelled = true;
          clearTimeout(timeoutId);
          if (controller) controller.abort();
        };
      }, [telemetry.value, send]);

      const bars = useMemo(() => {
        if (data && data.last30) return data.last30;
        return Array.from({ length: 30 }, (_, i) => ({ date: `placeholder-${i}`, count: 0, level: 0, placeholder: true }));
      }, [data]);

      const getLevelVar = (day) => {
        if (day.placeholder) return "var(--contrib-0)";
        let lvl = day.level || 0;
        if (lvl === 0 && day.count > 0) {
          lvl = day.count <= 2 ? 1 : day.count <= 5 ? 2 : day.count <= 8 ? 3 : 4;
        }
        return `var(--contrib-${Math.min(4, Math.max(0, lvl))})`;
      };

      const formatShortDate = (iso) => {
        try {
          return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(new Date(iso + "T00:00:00"));
        } catch (e) {
          return iso;

      };

      const handleKeyDown = (e, idx, day) => {
        if (e.key === "ArrowRight") {
          e.preventDefault();
          const next = Math.min(bars.length - 1, idx + 1);
          setRovingIdx(next);
          if (barRefs.current[next]) barRefs.current[next].focus();
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          const prev = Math.max(0, idx - 1);
          setRovingIdx(prev);
          if (barRefs.current[prev]) barRefs.current[prev].focus();
        } else if (e.key === "Escape") {
          e.preventDefault();
          send("ESCAPE");
        } else if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          send({ type: "TOGGLE_PIN_DAY", day });
        }
      };

      return (
        <motion.section
          id="github"
          variants={enterItem}
          data-machine="githubTelemetry"
          data-state={telemetry.value}
          data-total-commits={data ? data.yearTotal : undefined}

          data-pinned-date={pinnedDay ? pinnedDay.date : undefined}
          aria-label="GitHub contribution activity"

            role="group"
            aria-label="Last 30 days of GitHub contributions"
            className="grid grid-cols-[repeat(30,minmax(0,1fr))] gap-[3px] sm:gap-[5px] items-end h-7 mb-4"
          >
            {bars.map((day, idx) => {
              const isDayPinned = Boolean(pinnedDay && pinnedDay.date === day.date);

                  <span
                    key={day.date}
                    aria-hidden="true"
                    className={`block w-full h-6 rounded-full ${isLoading ? "motion-safe:animate-pulse" : "opacity-50"}`}

                  key={day.date}
                  ref={(el) => { barRefs.current[idx] = el; }}
                  type="button"
                  tabIndex={rovingIdx === idx ? 0 : -1}
                  aria-pressed={isDayPinned}
                  aria-label={`${day.count} ${day.count === 1 ? "contribution" : "contributions"} on ${formatShortDate(day.date)}`}
                  initial={reduce ? { opacity: 1 } : { scaleY: 0.25, opacity: 0 }}
                  animate={{ scaleY: 1, opacity: 1 }}
                  transition={{ duration: 0.26, delay: reduce ? 0 : idx * 0.012, ease: "easeOut" }}
                  onMouseEnter={() => send({ type: "INSPECT_DAY", day })}
                  onMouseLeave={() => send("CLEAR_INSPECT")}
                  onFocus={() => {
                    setRovingIdx(idx);
                    send({ type: "INSPECT_DAY", day });
                  }}
                  onBlur={() => send("CLEAR_INSPECT")}
                  onClick={() => {
                    setRovingIdx(idx);
                    send({ type: "TOGGLE_PIN_DAY", day });

                  onKeyDown={(e) => handleKeyDown(e, idx, day)}
                  className={`contrib-pill origin-bottom w-full h-6 p-0 border-0 rounded-full cursor-pointer transition-transform duration-150 ease-out ${

                  style={{ backgroundColor: getLevelVar(day) }}
                  title={`${day.count} ${day.count === 1 ? "contribution" : "contributions"} on ${formatShortDate(day.date)}`}

    // --- ROOT APPLICATION ---
    const App = () => {
      const [scrollEngine, sendScrollEngine] = useMachine(SCROLL_ENGINE_MACHINE);
      const [curtainState, sendCurtain] = useMachine(FOOTER_CURTAIN_MACHINE);
      const reduce = useReducedMotionSafe();
      const mainRef = useRef(null);

      const [theme, setTheme] = useState(() =>
        typeof document !== "undefined" && document.documentElement.getAttribute("data-theme") === "dark"
          ? "dark"
          : "light"
      );

      const handleToggleTheme = useCallback(() => {
        setTheme((prev) => {
          const next = prev === "dark" ? "light" : "dark";
          applyThemeWithoutSmear(next);
          return next;
        });
      }, []);

      useEffect(() => {
        let lastY = window.scrollY;
        let idleTimer = null;

        const onScroll = () => {
          const currentY = window.scrollY;
          const direction = currentY >= lastY ? "down" : "up";
          lastY = currentY;
          sendScrollEngine({ type: "SCROLL_ACTIVE", direction });
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => sendScrollEngine("SCROLL_IDLE"), 160);
        };

        const onVisChange = () => {
          sendScrollEngine(document.visibilityState === "visible" ? "VISIBILITY_VISIBLE" : "VISIBILITY_HIDDEN");
        };

        window.addEventListener("scroll", onScroll, { passive: true });
        document.addEventListener("visibilitychange", onVisChange);
        return () => {
          clearTimeout(idleTimer);
          window.removeEventListener("scroll", onScroll);
          document.removeEventListener("visibilitychange", onVisChange);
        };
      }, [sendScrollEngine]);

      useLayoutEffect(() => {
        if (reduce || !window.gsap || !window.ScrollTrigger) {
          sendCurtain("REVEAL");
          return;
        }

        const { gsap, ScrollTrigger } = window;
        gsap.registerPlugin(ScrollTrigger);

        let st = null;
        let tl = null;
        let resizeObserver = null;

        const initCurtain = () => {
          const spacer = document.getElementById("footer-spacer");
          const mainEl = document.getElementById("main-content");
          const footerBackdrop = document.getElementById("footer-backdrop");
          const footerInner = document.getElementById("footer-container-inner");
          if (!spacer || !mainEl || !footerInner) return;

          const getCornerRadius = () => (window.innerWidth < 640 ? "26px" : "36px");

          tl = gsap.timeline()
            .to(footerBackdrop, { opacity: 1, duration: 0.06, ease: "none" }, 0)
            .to(
              mainEl,
              {
                scale: 0.96,
                borderBottomLeftRadius: getCornerRadius,
                borderBottomRightRadius: getCornerRadius,
                ease: "none"
              },
              0
            )
            .fromTo(
              footerInner,
              { y: "14%", opacity: 0.25 },
              { y: "0%", opacity: 1, ease: "none" },
              0
            );

          st = ScrollTrigger.create({
            trigger: spacer,
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            invalidateOnRefresh: true,
            onUpdate: (self) => {
              sendCurtain({ type: "SCRUB_PROGRESS", progress: self.progress });
            },
            animation: tl
          });

          ScrollTrigger.refresh();
        };

        const initTimer = window.setTimeout(initCurtain, 60);

        if (typeof ResizeObserver !== "undefined" && mainRef.current) {
          resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
          resizeObserver.observe(mainRef.current);
        }

        return () => {
          window.clearTimeout(initTimer);
          if (resizeObserver) resizeObserver.disconnect();
          if (st) st.kill();
          if (tl) tl.kill();
          gsap.set(["#main-content", "#footer-backdrop", "#footer-container-inner"], { clearProps: "all" });
        };
      }, [reduce, sendCurtain]);

      const enterItem = {
        hidden: reduce ? { opacity: 0 } : { opacity: 0, y: 10, filter: "blur(4px)" },
        visible: {
          opacity: 1,
          y: 0,
          filter: "blur(0px)",
          transition: { duration: 0.3, ease: "easeOut" }
        }
      };

      return (
        <MotionConfig reducedMotion="user">
          <div
            id="app-shell"
            data-machine="scrollEngine"
            data-state={scrollEngine.value}
            data-scroll-direction={scrollEngine.context.direction}
            className="bg-canvas min-h-[100dvh] font-sans text-ink selection:bg-ink selection:text-canvas"
          >
            <a
              href="#main-content"
              className="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:start-4 focus:z-[200] focus:px-4 focus:py-2 focus:rounded-lg focus:bg-ink focus:text-canvas focus:text-sm focus:font-medium"
            >
              Skip to content
            </a>

            {!reduce && (
              <div
                id="footer-backdrop"
                aria-hidden="true"
                className="fixed inset-0 z-0 bg-footer-bg opacity-0 pointer-events-none"
              />
            )}

            <main
              id="main-content"
              ref={mainRef}
              className="relative z-10 main-curtain-surface w-full origin-[50%_100%]"
            >
              <motion.div
                initial="hidden"
                animate="visible"
                variants={{ visible: { transition: { staggerChildren: reduce ? 0 : 0.08 } } }}
                className="max-w-[600px] mx-auto px-5 sm:px-6 safe-top pb-24 sm:pb-28 space-y-14 sm:space-y-16"
              >
                <IdentityAndBio
                  theme={theme}
                  onToggleTheme={handleToggleTheme}
                  enterItem={enterItem}
                />
                <ActivityStrip enterItem={enterItem} />
                <Projects enterItem={enterItem} />
                <Writing enterItem={enterItem} />
                <FocusIndex enterItem={enterItem} />
              </motion.div>
            </main>

            {!reduce && (
              <div
                id="footer-spacer"
                aria-hidden="true"
                className="h-[74dvh] min-h-[480px] sm:h-[64dvh] sm:min-h-[500px] w-full pointer-events-none"
              />
            )}

            <EmergingFooter
              curtainState={curtainState}
              sendCurtain={sendCurtain}
              reduce={reduce}
            />
          </div>
        </MotionConfig>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
