    .inline-link {

    /* Smooth hover/focus trailing icon reveal (nudges following text smoothly) */
    .reveal-link {
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .reveal-link .reveal-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      vertical-align: 0.04em;
      max-width: 0;
      margin-inline-start: 0;

        max-width 400ms cubic-bezier(0.22, 1, 0.36, 1),

        color 240ms ease-out;
    }

    .reveal-link .reveal-slot-copy {
      vertical-align: -0.08em;
    }

    .reveal-link .reveal-glyph {
      flex-shrink: 0;
      transform: translate(-3px, 3px) scale(0.7);
      transition: transform 380ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal-link .reveal-glyph-copy {
      transform: scale(0.7);
    }

    .reveal-link:focus-visible .inline-link,
    .reveal-link[data-revealed="true"] .inline-link {
      color: var(--color-ink);
      text-decoration-color: var(--color-underline-hover);
    }

    .reveal-link:focus-visible .reveal-slot,
    .reveal-link[data-revealed="true"] .reveal-slot {
      max-width: 0.68em;
      margin-inline-start: 0.14em;
      opacity: 1;

        margin-inline-start 480ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 320ms ease-out 90ms,
        color 240ms ease-out;

      max-width: 0.84em;
      margin-inline-start: 0.18em;
    }

    .reveal-link:focus-visible .reveal-glyph,

      transform: translate(0, 0) scale(1);
      transition: transform 460ms cubic-bezier(0.22, 1, 0.36, 1) 50ms;
    }

    @media (hover: hover) {

          const container = containerRef.current;

        const cacheKey = `jp-gh-contrib-v1:${username}`;

        try {
          const cachedRaw = sessionStorage.getItem(cacheKey);
          if (cachedRaw) {
            const cached = JSON.parse(cachedRaw);
            if (cached && cached.ts && Date.now() - cached.ts < GITHUB_CACHE_TTL_MS && cached.payload) {
              send({ type: "FETCH_SUCCESS", data: cached.payload });
              return;
            }
          }
        } catch (e) {}

        const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timeoutId = setTimeout(() => {
          if (controller) controller.abort();
        }, 8000);

        fetch(
          `https://github-contributions-api.jogruber.de/v4/${encodeURIComponent(username)}?y=last`,
          controller ? { signal: controller.signal } : undefined
        )
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then((json) => {
            if (cancelled) return;
            const rawList = Array.isArray(json.contributions) ? json.contributions : [];
            if (!rawList.length) throw new Error("Empty dataset");

            const now = new Date();
            const today = now.toISOString().slice(0, 10);
            const firstDay = new Date(`${today}T00:00:00.000Z`);
            firstDay.setUTCDate(firstDay.getUTCDate() - 29);
            const yearStart = `${now.getUTCFullYear()}-01-01`;

            const contributionsByDay = new Map();
            for (let i = 0; i < 30; i++) {
              const d = new Date(firstDay);
              d.setUTCDate(firstDay.getUTCDate() + i);
              contributionsByDay.set(d.toISOString().slice(0, 10), 0);
            }

            let yearToDateContributions = 0;
            for (const item of rawList) {
              if (!item || !item.date) continue;
              const count = Number(item.count) || 0;
              if (item.date >= yearStart && item.date <= today) {
                yearToDateContributions += count;
              }
              if (contributionsByDay.has(item.date)) {
                contributionsByDay.set(item.date, count);
              }
            }

            const days = Array.from(contributionsByDay, ([date, count]) => ({ date, count }));
            const totalCommits = days.reduce((sum, d) => sum + d.count, 0);
            const payload = { days, totalCommits, yearToDateContributions };

            try {
              sessionStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), payload }));
            } catch (e) {}

            send({ type: "FETCH_SUCCESS", data: payload });
          })
          .catch((err) => {
            if (cancelled) return;
            send({ type: "FETCH_ERROR", error: err.message });
          })
          .finally(() => clearTimeout(timeoutId));

        return () => {
          cancelled = true;
          clearTimeout(timeoutId);
          if (controller) controller.abort();
        };
      }, [telemetry.value, username, send]);

      useEffect(() => {
        return () => {
          if (leaveTimeoutRef.current) clearTimeout(leaveTimeoutRef.current);
        };
      }, []);

      ];

      return (
        <footer
          id="footer-container"
          data-machine="footerCurtain"
          data-state={curtainState.value}
          data-progress={curtainState.context.progress}
          data-active-channel={curtainState.context.activeChannel || undefined}
          className={`${
            reduce
              ? "relative z-10 w-full bg-footer-bg text-footer-ink"
              : "fixed bottom-0 inset-x-0 z-0 h-[74dvh] min-h-[480px] sm:h-[64dvh] sm:min-h-[500px] w-full bg-footer-bg text-footer-ink overflow-hidden"
          } font-sans flex flex-col justify-between`}
        >
          <div
            id="footer-container-inner"
            className="w-full h-full max-w-[768px] mx-auto px-5 sm:px-8 pt-14 sm:pt-20 safe-bottom flex flex-col justify-between text-start"
          >
            <div className="my-auto">


              <h2 className="text-4xl sm:text-7xl font-semibold leading-[1.08] tracking-[-0.03em] text-footer-ink text-balance mb-4">
                Let’s build something{" "}
                <span className="text-footer-muted font-medium italic">together.</span>
              </h2>

              <p className="text-base sm:text-[1.0625rem] text-footer-secondary leading-[1.6] text-pretty max-w-[42ch] mb-8">
                Open to conversations about AI systems, spatial engineering, civic tech and philosophy.
              </p>

              <div className="flex flex-wrap items-center gap-2.5">
                {channels.map((ch) => (
                  <a
                    key={ch.id}
                    href={ch.href}
                    target={ch.external ? "_blank" : undefined}
                    rel={ch.external ? "noopener noreferrer" : undefined}
                    onFocus={() => handleFooterLinkFocus(ch.id)}
                    onBlur={() => sendCurtain("BLUR_CHANNEL")}
                    onMouseEnter={() => sendCurtain({ type: "FOCUS_CHANNEL", channel: ch.id })}
                    onMouseLeave={() => sendCurtain("BLUR_CHANNEL")}
                    className="focus-ring-light tap-press hover-light-pill min-h-[42px] ps-3.5 pe-4 py-2 rounded-full bg-white/10 border border-white/15 text-footer-ink text-[0.9375rem] font-medium inline-flex items-center gap-2"
                  >
                    {ch.icon}
                    <span>{ch.label}</span>
                  </a>
                ))}
              </div>
            </div>

            <div className="pt-6 border-t border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-base text-footer-muted">
              <span>© 2026 <span className="font-semibold text-footer-ink">Jakub Pacocha</span>. All rights reserved.</span>
              <span>Bydgoszcz, Poland</span>
            </div>
          </div>
        </footer>
      );
    };

    // --- ROOT APPLICATION ---
    const App = () => {
      const [scrollEngine, sendScrollEngine] = useMachine(SCROLL_ENGINE_MACHINE);
      const [curtainState, sendCurtain] = useMachine(FOOTER_CURTAIN_MACHINE);
      const reduce = useReducedMotionSafe();
      const mainRef = useRef(null);

      const [theme, setTheme] = useState(() =>
        typeof document !== "undefined" && document.documentElement.getAttribute("data-theme") === "dark"
          ? "dark"
          : "light"
      );

      const [hapticsMuted, setHapticsMuted] = useState(() => isHapticsMuted());

      const handleToggleHaptics = useCallback(() => {
        setHapticsMuted((prev) => {
          const next = !prev;
          try {
            localStorage.setItem("haptics-muted", String(next));
          } catch (e) {}
          window.dispatchEvent(new Event("haptics-muted-change"));
          return next;
        });
      }, []);

      const handleToggleTheme = useCallback(() => {
        setTheme((prev) => {
          const next = prev === "dark" ? "light" : "dark";
          applyThemeWithoutSmear(next);
          return next;
        });
      }, []);

      useEffect(() => {
        let lastY = window.scrollY;
        let idleTimer = null;

        const onScroll = () => {
          const currentY = window.scrollY;
          const direction = currentY >= lastY ? "down" : "up";
          lastY = currentY;
          sendScrollEngine({ type: "SCROLL_ACTIVE", direction });
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => sendScrollEngine("SCROLL_IDLE"), 160);
        };

        const onVisChange = () => {
          sendScrollEngine(document.visibilityState === "visible" ? "VISIBILITY_VISIBLE" : "VISIBILITY_HIDDEN");
        };

        window.addEventListener("scroll", onScroll, { passive: true });
        document.addEventListener("visibilitychange", onVisChange);
        return () => {
          clearTimeout(idleTimer);
          window.removeEventListener("scroll", onScroll);
          document.removeEventListener("visibilitychange", onVisChange);
        };
      }, [sendScrollEngine]);

      useLayoutEffect(() => {
        if (reduce || !window.gsap || !window.ScrollTrigger) {
          sendCurtain("REVEAL");
          return;
        }

        const { gsap, ScrollTrigger } = window;
        gsap.registerPlugin(ScrollTrigger);

        let st = null;
        let tl = null;
        let resizeObserver = null;

        const initCurtain = () => {
          const spacer = document.getElementById("footer-spacer");
          const mainEl = document.getElementById("main-content");
          const footerBackdrop = document.getElementById("footer-backdrop");
          const footerInner = document.getElementById("footer-container-inner");
          if (!spacer || !mainEl || !footerInner) return;

          const getCornerRadius = () => (window.innerWidth < 640 ? "26px" : "36px");

          tl = gsap.timeline()
            .to(footerBackdrop, { opacity: 1, duration: 0.06, ease: "none" }, 0)
            .to(
              mainEl,
              {
                scale: 0.96,
                borderBottomLeftRadius: getCornerRadius,
                borderBottomRightRadius: getCornerRadius,
                ease: "none"
              },
              0
            )
            .fromTo(
              footerInner,
              { y: "14%", opacity: 0.25 },
              { y: "0%", opacity: 1, ease: "none" },
              0
            );

          st = ScrollTrigger.create({
            trigger: spacer,
            start: "top bottom",
            end: "bottom bottom",
            scrub: true,
            invalidateOnRefresh: true,
            onUpdate: (self) => {
              sendCurtain({ type: "SCRUB_PROGRESS", progress: self.progress });
            },
            animation: tl
          });

          ScrollTrigger.refresh();
        };

        const initTimer = window.setTimeout(initCurtain, 60);

        if (typeof ResizeObserver !== "undefined" && mainRef.current) {
          resizeObserver = new ResizeObserver(() => ScrollTrigger.refresh());
          resizeObserver.observe(mainRef.current);
        }

        return () => {
          window.clearTimeout(initTimer);
          if (resizeObserver) resizeObserver.disconnect();
          if (st) st.kill();
          if (tl) tl.kill();
          gsap.set(["#main-content", "#footer-backdrop", "#footer-container-inner"], { clearProps: "all" });
        };
      }, [reduce, sendCurtain]);

      const enterItem = {
        hidden: reduce ? { opacity: 0 } : { opacity: 0, y: 10, filter: "blur(4px)" },
        visible: {
          opacity: 1,
          y: 0,
          filter: "blur(0px)",
          transition: { duration: 0.3, ease: "easeOut" }
        }
      };

      return (
        <MotionConfig reducedMotion="user">
          <div
            id="app-shell"
            data-machine="scrollEngine"
            data-state={scrollEngine.value}
            data-scroll-direction={scrollEngine.context.direction}
            className="bg-canvas min-h-[100dvh] font-sans text-ink"
          >
            <GlobalHaptics />
            <ClickSpark />

            <a
              href="#main-content"
              className="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:start-4 focus:z-[200] focus:px-4 focus:py-2 focus:rounded-lg focus:bg-ink focus:text-canvas focus:text-sm focus:font-medium"
            >
              Skip to content
            </a>

            {!reduce && (
              <div
                id="footer-backdrop"
                aria-hidden="true"
                className="fixed inset-0 z-0 bg-footer-bg opacity-0 pointer-events-none"
              />
            )}

            <main
              id="main-content"
              ref={mainRef}
              className="relative z-10 main-curtain-surface w-full origin-[50%_100%]"
            >
              <motion.div
                initial="hidden"
                animate="visible"
                variants={{ visible: { transition: { staggerChildren: reduce ? 0 : 0.08 } } }}
                className="max-w-[768px] mx-auto px-5 sm:px-8 safe-top pb-24 sm:pb-28 space-y-16 sm:space-y-20"
              >
                <IdentityAndBio
                  theme={theme}
                  onToggleTheme={handleToggleTheme}
                  hapticsMuted={hapticsMuted}
                  onToggleHaptics={handleToggleHaptics}
                  enterItem={enterItem}
                />
                <ActivityStrip enterItem={enterItem} />
                <Projects enterItem={enterItem} />
                <Writing enterItem={enterItem} />
                <FocusIndex enterItem={enterItem} />
              </motion.div>
            </main>

            {!reduce && (
              <div
                id="footer-spacer"
                aria-hidden="true"
                className="h-[74dvh] min-h-[480px] sm:h-[64dvh] sm:min-h-[500px] w-full pointer-events-none"
              />
            )}

            <EmergingFooter
              curtainState={curtainState}
              sendCurtain={sendCurtain}
              reduce={reduce}
            />
          </div>
        </MotionConfig>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
